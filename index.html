    const o = { n: 0, net: { a: 0, b: 0, t: 0 }, gross: { a: 0, b: 0, t: 0 }, holes: { a: 0, b: 0, t: 0 }, skins: { a: 0, b: 0, n: 0 }, g18: 0, gA: 0, gB: 0, nA: 0, nB: 0, money: 0, moneyN: 0, last: [] };
    const cmp = (x, y) => (x < y ? 'a' : y < x ? 'b' : 't');
    for (const r of rounds) {
      const ids = Golf.pids(r);
      if (!ids.includes(A) || !ids.includes(B)) continue;
      const a = Golf.analyze(r);
      if (!a.complete) continue;
      o.n += 1;
      const k = cmp(a.stroke.net[A], a.stroke.net[B]);
      o.net[k] += 1;
      o.gross[cmp(a.stroke.gross[A], a.stroke.gross[B])] += 1;
      a.holes.forEach((x) => { o.holes[cmp(x.n[A], x.n[B])] += 1; });
      if (r.games.skins.on) { o.skins.a += a.skins.won[A]; o.skins.b += a.skins.won[B]; o.skins.n += 1; }
      if (a.list.length === 18) { o.g18 += 1; o.gA += a.stroke.gross[A]; o.gB += a.stroke.gross[B]; o.nA += a.stroke.net[A]; o.nB += a.stroke.net[B]; }
      if (ids.length === 2 && a.money.anyStake) { o.money += a.money.cents[A] / CENTS; o.moneyN += 1; }
      if (o.last.length < 6) o.last.push({ id: r.id, date: r.date, w: k, nA: a.stroke.net[A], nB: a.stroke.net[B] });
    }
    return o;
  }
  // The pair to show first: the two who have finished the most rounds together.
  function busiestPair(rounds) {
    const n = {};
    for (const r of rounds) {
      const ids = Golf.pids(r);
      for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) { const k = ids[i] + '|' + ids[j]; n[k] = (n[k] || 0) + 1; }
    }
    const best = Object.keys(n).sort((x, y) => n[y] - n[x])[0];
    return best ? { a: best.split('|')[0], b: best.split('|')[1] } : null;
  }
  function h2hHTML(rounds, ids, nameOf, yr) {
    const done = rounds.filter((r) => { const a = Golf.analyze(r); return a.complete; });
    let pair = S.h2h && ids.includes(S.h2h.a) && ids.includes(S.h2h.b) && S.h2h.a !== S.h2h.b ? S.h2h : busiestPair(done);
    if (!pair) return '<p class="muted" style="margin:0">Finish a round with two or more players to see head to head.</p>';
    const A = nameOf(pair.a); const B = nameOf(pair.b);
    const pickA = '<select id="h2h-a" aria-label="First player">' + ids.map((id) => opt(id, nameOf(id).name, pair.a)).join('') + '</select>';
    const pickB = '<select id="h2h-b" aria-label="Second player">' + ids.map((id) => opt(id, nameOf(id).name, pair.b)).join('') + '</select>';
    let out = '<div class="h2h-pick">' + pickA + '<span class="muted">v</span>' + pickB + '</div>';
    const o = headToHead(done, pair.a, pair.b);
    const when = yr === 'all' ? '' : ' in ' + yr;
    if (!o.n) return out + '<p class="muted" style="margin:0">' + esc(A.name + ' and ' + B.name) + ' haven’t finished a round together' + esc(when) + '.</p>';
    const lead = o.net.a > o.net.b ? A : o.net.b > o.net.a ? B : null;
    out += '<div class="h2h-score"><div class="h2h-side"><b class="c' + A.color + '">' + o.net.a + '</b><span>' + esc(A.name) + '</span></div><div class="h2h-mid"><span class="label">Net wins</span><span class="muted">' + (o.net.t ? plural(o.net.t, 'tie') : 'no ties') + '</span></div><div class="h2h-side"><b class="c' + B.color + '">' + o.net.b + '</b><span>' + esc(B.name) + '</span></div></div>';
    out += '<div class="h2h-verdict">' + (lead ? nm(lead) + ' leads, ' + Math.max(o.net.a, o.net.b) + ' to ' + Math.min(o.net.a, o.net.b) : 'All square') + ' over ' + plural(o.n, 'round') + ' together' + esc(when) + '.</div>';
    const rows = [['Gross wins', o.gross.a, o.gross.b, false]];
    rows.push(['Holes won, net', o.holes.a, o.holes.b, false]);
    if (o.skins.n) rows.push(['Skins', o.skins.a, o.skins.b, false, frac]);
    if (o.g18) { rows.push(['Avg gross', o.gA / o.g18, o.gB / o.g18, true, (v) => v.toFixed(1)]); rows.push(['Avg net', o.nA / o.g18, o.nB / o.g18, true, (v) => v.toFixed(1)]); }
    out += '<div class="h2h-rows">' + rows.map(([label, x, y, low, f]) => {
      const fmt = f || String;
      const better = Math.abs(x - y) < 1e-9 ? '' : (low ? (x < y ? 'a' : 'b') : (x > y ? 'a' : 'b'));
      return '<div class="h2h-row"><span class="' + (better === 'a' ? 'win' : '') + '">' + esc(fmt(x)) + '</span><span class="k">' + esc(label) + '</span><span class="' + (better === 'b' ? 'win' : '') + '">' + esc(fmt(y)) + '</span></div>';
    }).join('') + '</div>';
    const notes = [];
    if (o.holes.t) notes.push(plural(o.holes.t, 'hole') + ' halved');
    if (o.g18 && o.g18 < o.n) notes.push('averages from 18-hole rounds');
    if (o.moneyN && Math.round(o.money * 100)) notes.push((o.money > 0 ? A.name : B.name) + ' up ' + money(Math.abs(o.money)) + ' in rounds with just the two of them');
    if (notes.length) out += '<div class="muted h2h-note">' + esc(notes.join(' · ')) + '</div>';
    const same1 = clipText(A.name, 1).toUpperCase() === clipText(B.name, 1).toUpperCase();
    const ini = (x) => (same1 ? clipText(x.name, 2) : clipText(x.name, 1).toUpperCase());
    out += '<div class="h2h-last"><span class="label">Latest</span><div class="h2h-chips">' + o.last.map((g) => {
      const who = g.w === 'a' ? A : g.w === 'b' ? B : null;
      return '<button class="h2h-chip' + (who ? ' t' + who.color : '') + '" data-action="open" data-id="' + esc(g.id) + '" aria-label="' + esc(fmtDate(g.date) + ', ' + (who ? who.name + ' won' : 'tied') + ', net ' + g.nA + ' to ' + g.nB) + '"><b>' + esc(who ? ini(who) : '=') + '</b><span>' + esc(fmtDate(g.date).replace(/^[A-Za-z]+, /, '')) + '</span></button>';
    }).join('') + '</div></div>';
    return out;
  }

  // ---------- home ----------
  function homeHTML() {
    const rounds = roundsSorted();
    const ex = expiryWarning();
    const top = (ex ? '<div class="expiry" role="status">' + esc(ex) + '</div>' : '') + homeScreenHint();
    const now = resumeHTML(rounds) + tripNowHTML();
    let more = S.readOnly ? '<div class="row"><span class="chip">View only</span></div>' : '<button class="btn primary wide" data-action="new">Start a round</button><div class="row"><span></span><button class="btn ghost" data-action="trip-new">Start a trip</button></div>';
    const trips = tripsSorted();
    if (trips.length) more += '<section class="stack"><div class="label">Trips</div>' + trips.map(tripRowHTML).join('') + '</section>';
    more += '<section class="stack"><div class="label">Rounds</div>' + (rounds.length ? rounds.map(roundRowHTML).join('') : '<div class="notice">No rounds yet. Start one on the first tee, or enter a finished card hole by hole.</div>') + '</section>';

    return isWide() ? top + twoCols(now + more, seasonHTML(rounds), 'home') : top + now + seasonHTML(rounds) + more;

  // Standings or head to head for the season picked, or all time.
  function seasonHTML(rounds) {
    const roster = conf().roster;
    const years = [...new Set(rounds.map((r) => String(r.date || '').slice(0, 4)).filter((y) => /^\d{4}$/.test(y)))].sort().reverse();
    const thisYear = String(new Date().getFullYear());
    let yr = S.year;
    if (!yr || (yr !== 'all' && !years.includes(yr))) yr = years.includes(thisYear) ? thisYear : (years[0] || thisYear);
    const pick = rounds.filter((r) => yr === 'all' || String(r.date || '').startsWith(yr));
    const s = Golf.season(pick);
    let out = '<section class="card stack">';
    out += '<div class="row"><div><div class="label">' + (yr === 'all' ? 'All time' : 'Season') + '</div><div class="title">' + (yr === 'all' ? 'Every round' : esc(yr)) + '</div></div>';
    if (years.length > 1) out += '<select id="f-year" aria-label="Season" style="width:auto">' + years.map((y) => opt(y, y, yr)).join('') + opt('all', 'All time', yr) + '</select>';
    out += '</div>';
    const ids = Object.keys(s.players);
    if (!s.rounds) {

    } else {
      const nameOf = (id) => { const ro = roster.find((p) => p.id === id); if (ro) return ro; for (const r of pick) { const pp = people(r).P[id]; if (pp) return pp; } return { name: 'Player', color: 0 }; };
      const avgNet = (st) => (st.g18 ? st.net / st.g18 : null);
      ids.sort((p, q) => s.players[q].wins - s.players[p].wins || (avgNet(s.players[p]) ?? 999) - (avgNet(s.players[q]) ?? 999) || s.players[q].rounds - s.players[p].rounds);
      const col = (f, low) => { const vals = ids.map((id) => f(s.players[id])).filter((v) => v != null); return vals.length ? (low ? Math.min(...vals) : Math.max(...vals)) : null; };
      const bestWins = col((x) => x.wins);
      const bestSkins = col((x) => x.skins);
      const bestNet = col((x) => avgNet(x), true);
      const showSkins = ids.some((id) => s.players[id].skins);
      const showNet = ids.some((id) => s.players[id].g18);
      const showCarts = ids.some((id) => s.players[id].teamWins);
      if (ids.length >= 2) out += seg('report', [['table', 'Standings'], ['h2h', 'Head to head']], S.report);
      if (S.report === 'h2h' && ids.length >= 2) out += h2hHTML(pick, ids, nameOf, yr);
      else {
      out += '<table class="stand"><thead><tr><th scope="col">Player</th><th scope="col">Rds</th><th scope="col">Wins</th>' + (showSkins ? '<th scope="col">Skins</th>' : '') + (showCarts ? '<th scope="col">Carts</th>' : '') + (showNet ? '<th scope="col">Avg net</th>' : '') + (s.anyMoney ? '<th scope="col">$</th>' : '') + '</tr></thead><tbody>';
      for (const id of ids) {
        const st = s.players[id];
        const p = nameOf(id);
        const an = avgNet(st);
        out += '<tr><th scope="row" class="c' + p.color + '">' + esc(p.name) + '</th><td>' + st.rounds + '</td><td class="' + (st.wins && st.wins === bestWins ? 'lead' : '') + '">' + st.wins + (st.ties ? '<span class="muted"> +' + st.ties + 'T</span>' : '') + '</td>' +
          (showSkins ? '<td class="' + (st.skins && Math.abs(st.skins - bestSkins) < 1e-9 ? 'lead' : '') + '">' + frac(st.skins) + '</td>' : '') +
          (showCarts ? '<td>' + st.teamWins + '</td>' : '') +
          (showNet ? '<td class="' + (an != null && Math.abs(an - bestNet) < 1e-9 ? 'lead' : '') + '">' + (an == null ? '' : an.toFixed(1)) + '</td>' : '') +

  }
  // A round from today or yesterday that isn't finished goes first on home, one tap from the hole you're on.

  }
  function resumeHTML(rounds) {

    if (!r) return '';

  }
  function roundRowHTML(r) {
    const a = Golf.analyze(r);

    const chips = [];

      }
      if (g.skins.on) {

    const facts = [r.course.name, locOf(r), fmtTime(r.teeTime), durationOf(r)].filter(Boolean).join(' · ');

    return '<button class="round-row" data-action="open" data-id="' + esc(r.id) + '">' +
      '<span class="rr-top"><span class="rr-date">' + esc(fmtDate(r.date)) + '</span>' + wxChip(r.weather, false) + '</span>' +
      (facts ? '<span class="rr-meta">' + esc(facts) + '</span>' : '') +
      '<span class="rr-scores">' + scores + '</span>' +
      '<span class="chips">' + chips.join('') + '</span>' +
      (setup ? '<span class="rr-meta">' + esc(setup) + '</span>' : '') + '</button>';
  }
  function locOf(r) { const c = S.courses[r.courseId]; return (c && c.location) || (r.course && r.course.location) || ''; }
  function fmtTime(hm) {
    if (!/^\d{1,2}:\d{2}$/.test(hm || '')) return '';
    const [h, m] = hm.split(':').map(Number);
    return (h % 12 || 12) + ':' + String(m).padStart(2, '0') + (h >= 12 ? ' PM' : ' AM');
  }
  // Tee time to the moment the round was finished, when both are known and plausible.
  function durationOf(r) {
    if (!/^\d{1,2}:\d{2}$/.test(r.teeTime || '') || !r.finishedAt || !/^\d{4}-\d{2}-\d{2}$/.test(r.date || '')) return '';
    const [y, mo, d] = r.date.split('-').map(Number);
    const [h, mi] = r.teeTime.split(':').map(Number);
    const mins = Math.round((Date.parse(r.finishedAt) - new Date(y, mo - 1, d, h, mi).getTime()) / 60000);
    if (!(mins >= 30 && mins <= 480)) return '';
    return Math.floor(mins / 60) + 'h ' + String(mins % 60).padStart(2, '0') + 'm';
  }
  const SKY = [['sunny', 'Sunny'], ['partly', 'Partly cloudy'], ['cloudy', 'Cloudy'], ['rain', 'Rain']];
  const WIND = [['calm', 'Calm'], ['breezy', 'Breezy'], ['windy', 'Windy']];
  const PRECIP = [['none', 'Dry'], ['drizzle', 'Drizzle'], ['showers', 'Showers'], ['rain', 'Steady rain']];
  const DIRS = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
  const hasNum = (v) => v != null && v !== '' && Number.isFinite(Number(v));
  function windOf(w) {
    if (hasNum(w.windMph)) {
      const mph = Math.round(Number(w.windMph));
      return { mph, dir: DIRS.includes(w.windDir) ? w.windDir : '', bucket: mph <= 5 ? 'calm' : mph <= 14 ? 'breezy' : 'windy' };
    }
    return w.wind ? { mph: null, dir: DIRS.includes(w.windDir) ? w.windDir : '', bucket: w.wind } : null;
  }
  const gustOf = (w, wd) => (wd && wd.mph != null && hasNum(w.gustMph) && Math.round(Number(w.gustMph)) > wd.mph ? Math.round(Number(w.gustMph)) : 0);
  function wxSource(w) {
    if (!w || !w.src) return '';
    if (w.src === 'accuweather') return 'AccuWeather' + (w.kind === 'forecast' ? ' forecast' : '') + (w.place ? ', ' + w.place : '');
    if (w.src === 'open-meteo') return 'Open-Meteo' + (w.kind === 'forecast' ? ' forecast' : '') + (w.place ? ', ' + w.place : '');
    if (w.src === 'obs') return w.place || 'Weather station';
    return w.src === 'manual' ? 'Entered by hand' : '';
  }
  function weatherLine(w) {
    if (!w) return '';
    const parts = [];
    const sky = SKY.find((x) => x[0] === w.sky);
    if (sky) parts.push(sky[1]);
    if (hasNum(w.temp)) parts.push(Math.round(Number(w.temp)) + '°F');
    const wd = windOf(w);
    if (wd) parts.push(wd.mph != null ? 'wind ' + wd.mph + ' mph' + (wd.dir ? ' ' + wd.dir : '') : (WIND.find((x) => x[0] === wd.bucket) || ['', ''])[1].toLowerCase());
    const g = gustOf(w, wd);
    if (g) parts.push('gusts ' + g + ' mph');
    const pr = PRECIP.find((x) => x[0] === w.precip);
    if (pr && pr[0] !== 'none') parts.push(pr[1].toLowerCase());
    if (hasNum(w.humidity)) parts.push(Math.round(Number(w.humidity)) + '% humidity');
    const t = parts.join(', ');
    return t.charAt(0).toUpperCase() + t.slice(1);
  }
  const SVG = (inner) => '<svg viewBox="0 0 24 24" aria-hidden="true">' + inner + '</svg>';
  const WX = {
    sunny: SVG('<circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/>'),

    cloudy: SVG('<path d="M7.5 19h9.5a4 4 0 0 0 .4-7.98A6 6 0 0 0 5.9 11.3 3.9 3.9 0 0 0 7.5 19z"/>'),
    rain: SVG('<path d="M7.5 14.5h9.5a4 4 0 0 0 .4-7.98A6 6 0 0 0 5.9 6.8 3.9 3.9 0 0 0 7.5 14.5z"/><path class="wx-d" d="M8.5 17.5l-1 3M12.5 17.5l-1 3M16.5 17.5l-1 3"/>'),
    wind: SVG('<path d="M3 8.5h10.5A2.5 2.5 0 1 0 11 6M3 12.5h15a2.5 2.5 0 1 1-2.5 2.5M3 16.5h7"/>'),

  // Arrow points the way the wind blew (a NW wind blows toward the SE).
  function windArrow(dir) {

  }
  // A small weather chip: sky icon and temperature, wind speed and direction, a drop when it rained.
  function wxChip(w, big) {
    if (!w) return '';
    const wd = windOf(w);
    const wet = w.precip && w.precip !== 'none';
    if (!w.sky && !hasNum(w.temp) && !wd && !wet) return '';
    const sky = wet && w.sky !== 'sunny' ? 'rain' : w.sky;
    const tone = sky === 'sunny' ? 'sun' : sky === 'rain' ? 'rain' : sky === 'partly' ? 'partly' : 'cloud';

    if (!a.thru) return 'Not started';
    let t = a.ids.slice().sort((p, q) => a.skins.won[q] - a.skins.won[p]).map((id) => P[id].name + ' ' + frac(a.skins.won[id])).join(', ');
    if (a.skins.riding > 1) t += ', ' + a.skins.riding + ' riding';
    if (a.skins.unclaimed) t += ', ' + a.skins.unclaimed + ' unclaimed';
    return t;
  }
  function nassauText(a, P) {
    const won = Golf.betsWon(a.nassau, a.ids);
    return a.ids.slice().sort((p, q) => won[q] - won[p]).map((id) => P[id].name + ' ' + won[id]).join(', ');
  }
  // One scorecard-style cell per hole for the skins strip.
  function skinCell(k, P) {
    if (!k) return '<td></td>';
    if (k.push) return '<td class="sp" title="Pushed">–</td>';
    if (!k.winners.length) return '<td class="cv" title="Carried">→</td>';
    if (k.split) return '<td class="sp" title="Split">–</td>';
    const p = P[k.winners[0]];
    return '<td class="t' + p.color + '">' + esc(p.ini) + (k.val > 1 ? '<sup>' + k.val + '</sup>' : '') + '</td>';
  }
  // Who took each hole: the skin when skins are on, otherwise the lowest net score.
  function holeCell(z, h, P, skins) {
    if (skins) return skinCell(z.skins.per[h], P);
    const x = z.holes.find((y) => y.h === h);
    if (!x || !x.done) return '<td></td>';
    if (x.low.length > 1) return '<td class="sp" title="Halved">–</td>';
    const p = P[x.low[0]];
    return '<td class="t' + p.color + '">' + esc(p.ini) + '</td>';
  }
  const holesChanged = (a, b, P, skins) => a.list.filter((h) => holeCell(a, h, P, skins) !== holeCell(b, h, P, skins));
  function stripHTML(a, b, P, skins) {
    const nine = (list) => {
      const ka = list.map((h) => holeCell(a, h, P, skins));
      const kb = list.map((h) => holeCell(b, h, P, skins));
      const diff = list.map((h, i) => ka[i] !== kb[i]);
      const row = (label, cells) => '<tr><th scope="row">' + label + '</th>' + cells.map((c, i) => (diff[i] ? c.replace('<td', '<td data-chg="1"') : c)).join('') + '</tr>';
      return '<table class="wi-strip"><thead><tr><th></th>' + list.map((h) => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>' + row('Played', ka) + row('What if', kb) + '</tbody></table>';
    };
    const list = a.list;
    const parts = list.length > 9 ? [list.slice(0, 9), list.slice(9)] : [list];
    const key = skins ? 'Initial: who won the skin. – split or pushed. → carried. Small number: skins won on that hole.' : 'Initial: who won the hole on net. – halved.';
    return parts.map(nine).join('') + '<div class="muted wi-key">' + key + ' Highlighted: changed.</div>';
  }
  function whatIfHTML(r, a, pp) {
    const P = pp.P;
    const qs = whatIfQuestions(r);
    const w = S.whatIf && S.whatIf.id === r.id ? S.whatIf : null;
    if (!w) {
      return '<section class="card whatif stack"><div><div class="label">What if…</div><div class="muted">Same scores, different rules. Tap one to see what would have changed. Nothing is saved.</div></div><div class="picks">' +
        qs.map((q) => '<button type="button" class="pick" data-action="wi-open" data-v="' + q[0] + '">' + esc(q[1]) + '</button>').join('') + '</div></section>';
    }
    const x = whatIfRound(r, w);
    const b = Golf.analyze(x);
    const any = w.shots || w.skins || w.press || w.team || (w.hcpOn && pp.list.some((p) => w.hcp[p.id] !== hcpOf(r, p.id)));
    let out = '<section class="card whatif stack" aria-label="What if"><div class="row"><div class="label">What if…</div><button class="btn ghost" data-action="wi-close">Done</button></div>';

    // The switches
    out += '<div class="wi-sw">' + qs.map((q) => {
      const id = 'wi-' + q[0];
      const on = q[0] === 'hcp' ? w.hcpOn : w[q[0]];
      let desc = q[2];
      if (q[0] === 'shots' && on) desc = 'Shots: ' + shotsText(b, P);
      let row = '<div class="game"><div class="game-head"><label for="' + id + '"><span class="gname">' + esc(q[1]) + '</span><span class="gdesc">' + esc(desc) + '</span></label><input type="checkbox" class="switch" role="switch" id="' + id + '" data-bind="whatIf.' + (q[0] === 'hcp' ? 'hcpOn' : q[0]) + '" data-rerender="1"' + (on ? ' checked' : '') + '></div>';
      if (q[0] === 'hcp' && on) {
        row += '<div class="wi-hcps">' + pp.list.map((p) => '<div class="wi-hcp"><span class="c' + p.color + '">' + esc(p.name) + ' <span class="muted">played ' + hcpOf(r, p.id) + '</span></span><span class="mini"><button class="pm" data-action="wi-hcp" data-p="' + esc(p.id) + '" data-v="-1" aria-label="' + esc(p.name) + ' handicap down">−</button><b' + (w.hcp[p.id] !== hcpOf(r, p.id) ? ' class="chg"' : '') + '>' + w.hcp[p.id] + '</b><button class="pm" data-action="wi-hcp" data-p="' + esc(p.id) + '" data-v="1" aria-label="' + esc(p.name) + ' handicap up">+</button></span></div>').join('') + '</div>';
      }
      return row + '</div>';
    }).join('') + '</div>';

    // The answer
    const rows = [];
    if (r.games.stroke.on) rows.push(['Stroke play', strokeRes(a, P).plain, strokeRes(b, P).plain]);
    if (r.games.skins.on) rows.push(['Skins', skinsText(a, P), skinsText(b, P)]);
    if (r.games.nassau.on) rows.push(['Nassau bets', nassauText(a, P), nassauText(b, P)]);
    const cartText = (z) => z.team.matches.map((m) => (z.team.partners === 'sixes' ? holeSpan(m.played) + ': ' : '') + (m.bet.played ? betStatus(m, m.bet, P, false) : 'not started')).join(' · ');
    if (r.games.team.on && a.team.matches.length) rows.push(['Cart vs cart', cartText(a), cartText(b)]);
    const moneyText = (z) => pp.list.map((p) => p.name + ' ' + signedCents(z.money.cents[p.id])).join(', ');
    if (a.money.anyStake) rows.push(['Money', moneyText(a), moneyText(b)]);
    const moved = rows.filter((y) => y[1] !== y[2]);
    const same = rows.filter((y) => y[1] === y[2]).map((y) => y[0]);
    // Totals can match by coincidence while holes change hands, so compare hole by hole too.
    const skinsOn = !!r.games.skins.on;
    const changed = any ? holesChanged(a, b, P, skinsOn) : [];
    const holesLine = changed.length ? plural(changed.length, 'hole') + ' change hands (' + changed.join(', ') + ').' : '';
    out += '<div class="wi-ans" role="status" aria-live="polite">';
    if (!any) out += '<div class="muted">Flip a switch above to see the difference.</div>';
    else if (!moved.length && !changed.length) out += '<div class="wi-head">No difference. Same results on every hole.</div>';
    else if (!moved.length) out += '<div class="wi-head">Same totals, different holes</div><div class="muted">' + esc(holesLine) + ' The gains and losses happen to even out.</div>';
    else {
      out += '<div class="wi-head">' + (moved.length === 1 ? 'One result changes' : moved.length + ' results change') + '</div>';
      out += moved.map((y) => '<div class="wi-item"><span class="k">' + esc(y[0]) + '</span><span class="v">' + esc(y[2]) + '</span><span class="was">was ' + esc(y[1]) + '</span></div>').join('');
      if (same.length) out += '<div class="muted">' + esc(andList(same.map((n, i) => (i && n !== 'Nassau bets' ? n.toLowerCase() : n)))) + ' unchanged.</div>';
      if (holesLine) out += '<div class="muted">' + esc(holesLine) + '</div>';
    }
    out += '</div>';

    if (changed.length) {
      out += '<button type="button" class="linkish" style="align-self:flex-start" data-action="wi-holes" aria-expanded="' + !!w.holes + '">' + (w.holes ? 'Hide hole by hole' : 'Show hole by hole') + '</button>';
      if (w.holes) out += '<div class="wi-strips">' + stripHTML(a, b, P, skinsOn) + '</div>';
    }
    if (!S.readOnly && any && (moved.length || changed.length)) {
      if (S.confirm === 'whatif') out += '<div class="confirm" role="alert"><span>Use these rules for this round? Scores stay as played. The results and season totals update.</span><span style="flex:1"></span><button class="btn" data-action="cancel-confirm">Cancel</button><button class="btn primary" data-action="wi-apply">Use them</button></div>';
      else out += '<button type="button" class="linkish wi-save" data-action="wi-apply-ask">Played it this way? Save these rules to the round</button>';
    }
    return out + '</section>';
  }

  // ---------- trips: a weekend of rounds, each with its own games, settled once ----------
  const tripsSorted = () => Object.keys(S.trips).map((id) => Object.assign({ id }, S.trips[id])).sort((a, b) => String(b.start || '').localeCompare(String(a.start || '')));
  const tripRounds = (id) => roundsSorted().filter((r) => r.tripId === id).reverse();
  const tripCovers = (t, date) => !!date && !!t.start && t.start <= date && date <= t.end;
  const shortDate = (iso) => fmtDate(iso).replace(/^[A-Za-z]+, /, '');
  const tripDates = (t) => (t.start === t.end ? fmtDate(t.start) : fmtDate(t.start) + ' to ' + shortDate(t.end));
  // `m` is the trip's Golf.tripMoney: marks from before Release 1 are read against its old payments (see Golf.paidMarks).
  const isPaid = (t, x, m) => Golf.paidMarks(t.paid, x, m).length > 0;
  function tripPeople(rounds) {
    const P = {};
    rounds.forEach((r) => people(r).list.forEach((p) => { if (!P[p.id]) P[p.id] = p; }));
    return P;
  }
  function tripLeader(m, P) {
    const top = m.ids.slice().sort((p, q) => m.cents[q] - m.cents[p])[0];
    return top && m.cents[top] > 0 ? { p: P[top], amt: m.cents[top] / CENTS } : null;
  }
  function tripRowHTML(t) {
    const rounds = tripRounds(t.id);
    const m = Golf.tripMoney(rounds);
    const lead = tripLeader(m, tripPeople(rounds));
    return '<button class="round-row" data-action="trip-open" data-id="' + esc(t.id) + '"><span class="rr-top"><span class="rr-date">' + esc(t.name) + '</span>' + (lead ? '<span class="chip t' + lead.p.color + '">' + esc(lead.p.name) + ' ' + signed(lead.amt) + '</span>' : '') + '</span><span class="rr-meta">' + esc([tripDates(t), plural(rounds.length, 'round')].join(' · ')) + '</span></button>';
  }
  // The trip under way today, right under the round in progress.
  function tripNowHTML() {
    const t = tripsSorted().find((x) => tripCovers(x, todayISO()));
    if (!t) return '';
    const rounds = tripRounds(t.id);
    const m = Golf.tripMoney(rounds);
    const lead = tripLeader(m, tripPeople(rounds));
    return '<button class="resume trip-now" data-action="trip-open" data-id="' + esc(t.id) + '"><span class="rs-text"><span class="label">Trip</span><span class="rs-course">' + esc(t.name) + '</span><span class="rs-meta">' + esc([plural(rounds.length, 'round'), lead ? lead.p.name + ' up ' + money(lead.amt) : ''].filter(Boolean).join(' · ')) + '</span></span><span class="rs-go">Money ›</span></button>';
  }
  function tripHTML() {
    const t = S.trips[S.tripId];
    let out = '<div class="row"><button class="btn ghost" data-action="home">‹ Rounds</button>' + (t && !S.readOnly ? '<button class="btn ghost" data-action="trip-edit">Edit trip</button>' : '') + '</div>';
    if (!t) return out + '<div class="notice">This trip isn’t here anymore.</div>';
    const rounds = tripRounds(S.tripId);
    const m = Golf.tripMoney(rounds);
    const P = tripPeople(rounds);
    out += '<section class="stack" style="gap:2px"><div class="title">' + esc(t.name) + '</div><div class="muted">' + esc([tripDates(t), plural(rounds.length, 'round'), m.open ? m.open + ' still being played' : ''].filter(Boolean).join(' · ')) + '</div></section>';
    if (!S.readOnly) out += '<button class="btn primary wide" data-action="trip-round">Start a round on this trip</button>';
    if (!rounds.length) return out + '<div class="notice">No rounds yet. Rounds you start from ' + esc(tripDates(t)) + ' join the trip, each with its own games and stakes.</div>';
    const anyMoney = m.per.some((x) => x.anyStake);
    out += '<section class="card stack"><div class="label">' + (m.open ? 'Who owes whom so far' : 'Who owes whom') + '</div>';
    if (!anyMoney) out += '<div class="muted">No money on these rounds yet. Set stakes when you start a round and it adds up here.</div>';
    else if (!m.transfers.length) out += '<div class="muted">All square. Nobody owes anybody.</div>';
    else {
      out += m.transfers.map((x) => {
        const k = Golf.payKey(x);
        const paid = isPaid(t, x, m);
        return '<div class="pay-row' + (paid ? ' paid' : '') + '"><span class="pay-what">' + nm(P[x.from]) + ' pays ' + nm(P[x.to]) + ' <b>' + money(x.amt) + '</b></span>' +
          (S.readOnly ? (paid ? '<span class="chip">Paid</span>' : '') : '<button class="tog" data-action="trip-paid" data-v="' + esc(k) + '" aria-pressed="' + paid + '">' + (paid ? 'Paid ✓' : 'Mark paid') + '</button>') + '</div>';
      }).join('');
      out += '<div class="muted">The fewest payments that settle the whole trip.' + (m.open ? ' Still changing while a round is being played.' : '') + '</div>';
    }
    out += '</section>';
    if (anyMoney) {
      // Players down the side and rounds across (R1, R2...), so it fits a phone with four players and a full weekend.
      const cell = (x, id) => (!(id in x.cents) ? '' : x.anyStake ? signedCents(x.cents[id]) : '–');
      out += '<section class="card stack"><div class="label">Money by round</div><div class="trip-wrap"><table class="stand trip-table"><thead><tr><th scope="col">Player</th>' + rounds.map((r, i) => '<th scope="col">R' + (i + 1) + '</th>').join('') + '<th scope="col">Trip</th></tr></thead><tbody>';
      m.ids.forEach((id) => { out += '<tr><th scope="row" class="c' + P[id].color + '">' + esc(P[id].name) + '</th>' + m.per.map((x) => '<td>' + cell(x, id) + '</td>').join('') + '<td><b>' + signedCents(m.cents[id]) + '</b></td></tr>'; });
      out += '</tbody></table></div><div class="trip-key">' + rounds.map((r, i) => '<div><b>R' + (i + 1) + '</b> <button class="linkish" data-action="open" data-id="' + esc(r.id) + '">' + esc(shortDate(r.date) + ', ' + r.course.name) + '</button>' + (m.per[i].complete ? '' : ' <span class="muted">playing</span>') + (m.per[i].anyStake ? '' : ' <span class="muted">no stakes</span>') + '</div>').join('') + '</div></section>';
    }
    out += '<div class="row"><button class="btn" data-action="trip-share">' + (S.native ? 'Share with the group' : 'Copy for the group') + '</button></div>';
    if (S.copyText) out += '<textarea class="copybox" id="copybox" readonly aria-label="Trip summary to copy">' + esc(S.copyText) + '</textarea>';
    out += '<section class="stack"><div class="label">Rounds</div>' + rounds.slice().reverse().map(roundRowHTML).join('') + '</section>';
    return out;
  }
  function tripShareText(t, rounds, m, P) {
    const lines = [t.name + ', ' + tripDates(t)];
    if (!m.per.some((x) => x.anyStake)) lines.push('', 'No money on the rounds yet.');
    else if (!m.transfers.length) lines.push('', 'All square.');
    else {
      lines.push('', m.open ? 'Who owes whom so far:' : 'Who owes whom:');
      m.transfers.forEach((x) => lines.push(P[x.from].name + ' pays ' + P[x.to].name + ' ' + money(x.amt) + (isPaid(t, x, m) ? ' (paid)' : '')));
    }
    lines.push('', 'Round by round:');
    rounds.forEach((r, i) => {
      const x = m.per[i];
      lines.push(fmtDate(r.date) + ', ' + r.course.name + (x.complete ? '' : ' (still playing)') + ': ' + Object.keys(x.cents).map((id) => P[id].name + ' ' + signedCents(x.cents[id])).join(', '));
    });
    lines.push('', 'Trip: ' + m.ids.map((id) => P[id].name + ' ' + signedCents(m.cents[id])).join(', '));
    return lines.join('\n');
  }
  function shareTrip() {
    const t = S.trips[S.tripId];
    if (!t) return;
    const rounds = tripRounds(S.tripId);
    shareText(tripShareText(t, rounds, Golf.tripMoney(rounds), tripPeople(rounds)), 'Trip summary copied');
  }
  async function togglePaid(k) {
    const id = S.tripId;
    const t = S.trips[id];
    if (!t || S.readOnly) return;
    // Unmarking clears every saved mark that counted it as paid, including one from before Release 1, and keeps
    // any other payment those marks covered paid (see Golf.paidPatch).
    const now = new Date().toISOString();
    const paid = Golf.paidPatch(t.paid, Golf.tripMoney(tripRounds(id)), k, now);
    const on = !!paid[k] && !paid[k].__delete__;
    try { await S.db.doc('trips/' + id).update({ paid, updatedAt: now }); } catch (e) { onWriteFail(e, null); return; }
    buzz(on ? 'done' : 'tap');
  }
  function openTripForm(id) {
    const t = id && S.trips[id];
    S.tripForm = t ? { id, name: t.name, start: t.start, end: t.end } : { id: null, name: '', start: todayISO(), end: todayISO(new Date(Date.now() + 2 * 864e5)) };
    S.confirm = null; S.formError = ''; S.copyText = '';
    S.view = 'tripedit';
    render();
    scrollTop();
  }
  function tripFormHTML() {
    const f = S.tripForm;
    let out = '<div class="row"><button class="btn ghost" data-action="trip-cancel">‹ Back</button></div><div class="title">' + (f.id ? 'Edit trip' : 'New trip') + '</div>';
    if (S.formError) out += '<div class="err" role="alert">' + esc(S.formError) + '</div>';
    out += '<section class="card form"><label class="field"><span>Name</span><input type="text" id="t-name" data-bind="tripForm.name" maxlength="40" placeholder="Myrtle Beach weekend" value="' + esc(f.name) + '"></label>' +
      '<div class="grid2"><label class="field"><span>First day</span><input type="date" id="t-start" data-bind="tripForm.start" value="' + esc(f.start) + '"></label><label class="field"><span>Last day</span><input type="date" id="t-end" data-bind="tripForm.end" value="' + esc(f.end) + '"></label></div>' +
      '<div class="muted">Rounds you start on these days join the trip. Each round keeps its own games and stakes; the trip adds up the money and settles it once.</div></section>';
    if (f.id) {
      if (S.confirm === 'trip') out += '<div class="confirm" role="alert"><span>Delete this trip? Its rounds are kept.</span><span style="flex:1"></span><button class="btn" data-action="cancel-confirm">Keep it</button><button class="btn danger solid" data-action="trip-delete">Delete</button></div>';
      else out += '<div class="row"><button class="btn ghost danger" data-action="trip-ask-delete">Delete trip</button><span></span></div>';
    }
    out += '<button class="btn primary wide" data-action="trip-save">' + (f.id ? 'Save trip' : 'Start the trip') + '</button>';
    return out;
  }
  async function saveTrip() {
    const f = S.tripForm;
    if (!f || S.readOnly) return;
    const name = String(f.name || '').trim();
    if (!name) return formErr('Give the trip a name.');
    const day = /^\d{4}-\d{2}-\d{2}$/;
    if (!day.test(f.start || '') || !day.test(f.end || '')) return formErr('Pick the first and last day.');
    if (f.end < f.start) return formErr('The last day can’t be before the first.');
    if ((new Date(f.end) - new Date(f.start)) / 864e5 > 14) return formErr('Keep a trip to two weeks or less.');
    const id = f.id || S.db.collection('trips').doc().id;
    const now = new Date().toISOString();
    const doc = Object.assign({ paid: {}, createdAt: now }, S.trips[id] || {}, { name: clipText(name, 40), start: f.start, end: f.end, updatedAt: now });
    try { await S.db.doc('trips/' + id).set(doc); } catch (e) { onWriteFail(e, null); return; }
    // A trip started after its first round picks up the rounds already played on its days.
    if (!f.id) roundsSorted().filter((r) => !r.tripId && tripCovers(doc, r.date)).forEach((r) => editRound(r.id, { tripId: id }));
    S.tripForm = null; S.formError = ''; S.view = 'trip'; S.tripId = id;
    toast(f.id ? 'Trip saved' : name + ' started');
    render();
    scrollTop();
  }
  async function deleteTrip() {
    const id = S.tripForm && S.tripForm.id;
    if (!id || S.readOnly) return;
    tripRounds(id).forEach((r) => editRound(r.id, { tripId: null }));
    try { await S.db.doc('trips/' + id).delete(); } catch (e) { onWriteFail(e, null); return; }
    S.tripForm = null; S.confirm = null; S.view = 'home';
    toast('Trip deleted. Its rounds are kept.');
    render();
    scrollTop();
  }

  // ---------- round ----------
  function shotsLine(r, P) {
    const ids = Golf.pids(r);
    const mh = Golf.offLow(Golf.courseHcps(r, ids), ids, r.allowance);
    const getters = ids.filter((id) => mh[id] > 0);
    if (r.allowance === 'full') return 'Full shots';
    if (!getters.length) return 'Level, no shots';
    if (ids.length === 2) return P[getters[0]].name + ' gets ' + plural(mh[getters[0]], 'shot');
    return 'Shots off the low man';
  }
  // The holes in the order the group is playing them: from the first tee, or from the hole offered while "Started
  // on 10?" is open (see startOffer), since that's where the group went off. Resume and the hole bar both follow it.
  function playingOrder(r) {
    const offer = startOffer(r);
    return Golf.playOrder(offer ? Object.assign({}, r, { startHole: offer }) : r);
  }
  // The first hole still to play, in the order the group is playing.
  function firstOpenHole(r) {
    const list = playingOrder(r);
    const ids = Golf.pids(r);
    const open = list.find((h) => !ids.every((p) => r.scores[p] && r.scores[p][String(h)] > 0));
    return open || list[0];
  }
  function roundHTML() {
    const r = roundData(S.roundId);
    if (!r || !validCourse(r.course)) {
      return '<div class="row"><button class="btn ghost" data-action="home">‹ Rounds</button></div><div class="notice">This round isn’t here anymore. It may have been deleted on another device.</div>';
    }
    const a = Golf.analyze(r);
    const pp = people(r);
    if (!a.list.includes(S.hole)) S.hole = a.played[0];
    // A finished card is locked: results only, until someone taps Edit scores.
    const live = !S.readOnly && (!a.complete || S.editing === r.id);
    const nav = '<div class="row"><button class="btn ghost" data-action="home">‹ Rounds</button>' + (S.readOnly ? '<span class="chip">View only</span>' : live ? '<button class="btn ghost" data-action="edit-setup">Edit setup</button>' : '<button class="btn" data-action="edit-scores">Edit scores</button>') + '</div>';
    let out = '';
    const courseLink = S.courses[r.courseId] ? '<button class="linkish" data-action="course-open" data-id="' + esc(r.courseId) + '">' + esc(r.course.name) + '</button>' : esc(r.course.name);
    const loc = locOf(r);
    const facts = [fmtTime(r.teeTime) ? 'Tee time ' + fmtTime(r.teeTime) : '', durationOf(r)].filter(Boolean).join(' · ');
    const noWx = !wxChip(r.weather, false);

  // ---------- round actions ----------
  function scoreEdit(fn) {
    const r = roundData(S.roundId);
    if (!r || S.readOnly) return;
    const k = String(S.hole);
    const patch = fn(r, k, r.course.par[S.hole - 1]);
    if (!patch) return;
    editRound(r.id, { ...patch, ...firstScoredPatch(r, k, patch) });

  const curScore = (r, p, k) => { const v = (r.scores[p] || {})[k]; return typeof v === 'number' && v > 0 ? v : null; };
  const holeFull = (r, k) => Golf.pids(r).every((p) => curScore(r, p, k) != null);
  const hasScore = (r) => Golf.pids(r).some((p) => Object.keys(r.scores[p] || {}).some((k) => curScore(r, p, k) != null));
  const holeScored = (r, k) => Golf.pids(r).some((p) => curScore(r, p, String(k)) != null);
  // The holes in the order they were first scored (scoredOrder) and the first of them still holding a score
  // (firstScored), saved with the scores and never used to score, so the "Started on 10?" offer goes by what
  // happened. Clear hole takes a hole out of the order, so a score put on the wrong hole and cleared doesn't count,
  // even once later holes are scored. A round scored before the order was saved knows only its first hole, and
  // clearing that one takes it off. A round that already holds scores without either (scored before they were
  // saved) gets neither: its first score isn't known.
  function firstScoredPatch(r, k, patch) {
    const h = Number(k);
    const next = deepMerge(clone(r), patch);
    const scored = holeScored(next, k);
    if (holeScored(r, k) === scored) return {};
    if (!hasScore(r)) return { firstScored: h, scoredOrder: [h] };
    if (!Array.isArray(r.scoredOrder)) return scored || Number(r.firstScored) !== h ? {} : { firstScored: null };
    const rest = r.scoredOrder.filter((x) => x !== h);
    const order = scored ? rest.concat(h) : rest;
    const first = order.find((x) => holeScored(next, x));
    return { scoredOrder: order, firstScored: first == null ? null : first };
  }
  // The hole to offer as the first tee, or null: the round's first score (firstScored), when that went on another
  // hole that still holds it and the first tee has no score. That covers a group that went off 10 with First tee
  // left on Hole 1, and one that picked 10 or a shotgun hole but went off 1. Scoring never moves the start on its
  // own; the offer waits for a tap, and goes once the first tee has a score.
  function startOffer(r) {
    const h = Number(r.firstScored);
    const first = Golf.playOrder(r)[0];
    if (!Golf.holeList(r.holes).includes(h) || h === first || !holeScored(r, h)) return null;
    return holeScored(r, first) ? null : h;
  }
  // Under a live round's heading: the "Started on 10?" offer, or where a round that didn't start on its first hole started.

    return a.played[0] !== a.list[0] ? '<div><span class="chip">Started on ' + a.played[0] + '</span></div>' : '';
  }
  // A tap on "Started on 10?": hole 10 becomes the first tee, as if picked at setup, so every game runs from it.
  function takeStart(h) {
    const r = roundData(S.roundId);

  // A light tap on the phone for each change, a success buzz when a hole's card fills up. Nothing elsewhere.

  function bump(p, d) {
    scoreEdit((r, k, par) => { const c = curScore(r, p, k); return { scores: { [p]: { [k]: Math.max(1, Math.min(15, (c == null ? par : c) + d)) } } }; });

  function setPar(p) { scoreEdit((r, k, par) => (curScore(r, p, k) == null ? { scores: { [p]: { [k]: par } } } : null)); }

  // Saves a setup: checks it, remembers the players, then saves the round (edited, or a new one).
  async function saveSetup() {
    const d = S.setup;
    if (!d || S.readOnly) return;
    const roster = setupRoster(d);
    const ids = d.players.filter((id) => roster.some((p) => p.id === id));
    const course = setupRoundCourse(d);
    const problem = setupProblem(d, ids, course);
    if (problem) return formErr(problem);
    const now = new Date().toISOString();
    const weather = setupWeather(d);
    const fields = setupRoundFields(d, ids, course, roster, weather);
    if (!(await rememberPlayers(d, ids, fields.index || {}, now))) return;
    if (d.id) return saveEditedSetup(d, fields);
    return startRound(d, fields, weather, now);
  }
  // The course an edit is on and the card its round was played on, or null when there's no played card to weigh
  // against the course: a new round, another course, or a course since deleted.
  function setupCards(d) {
    const lib = S.courses[d.courseId];
    const snap = d.courseSnap;
    if (!validCourse(lib) || !validCourse(snap) || !d.saved || d.courseId !== d.saved.courseId) return null;
    return { lib, snap };
  }
  // Whether the course being edited on has a different par or hole handicaps from the card its round was played on.
  function setupCardChanged(d) {
    const c = setupCards(d);
    return !!c && (c.lib.par.some((v, i) => v !== c.snap.par[i]) || c.lib.hcp.some((v, i) => v !== c.snap.hcp[i]));
  }
  // The players' tees that the course rates differently now from the round's card (a rating filled in or changed since).
  function setupRatedSince(d) {
    const c = setupCards(d);
    return c ? setupTeeNames(d).filter((n) => ratingOn(c.lib, n) !== ratingOn(c.snap, n)) : [];
  }
  // The choice an edit offers between the card its round was played on and the course's card today: 'card' when the
  // par or hole handicaps changed (see cardChoiceHTML); 'ratings' when only the ratings of the players' tees did and
  // a handicap is being worked out again, or today's ratings are picked (see ratingsChoiceHTML); '' for none.
  function cardChoice(d) {
    if (setupCardChanged(d)) return 'card';
    const redone = () => !!d.newCard || d.players.some((id) => playerInputsChanged(d, id));
    return !d.legacy && setupRatedSince(d).length && redone() ? 'ratings' : '';
  }
  // Whether the round takes the course's card as it is today: picked in the choice while it's offered.
  const useTodaysCard = (d) => !!d.newCard && cardChoice(d) !== '';
  // The course a setup saves with its round. An edit keeps the card the round was played on (par, hole handicaps,
  // and each tee's rating and slope, or none where it had none) unless today's card is picked (see cardChoice), so a
  // course corrected or rated since neither rescores the round by surprise nor works out one player's handicap on
  // ratings the others' weren't. Its name and its tees' yardages come from the course as it is now. A course since
  // deleted keeps the round's copy.
  function setupRoundCourse(d) {
    const lib = S.courses[d.courseId];
    if (!lib) return d.courseSnap;
    const fresh = snapCourse(lib);
    const c = setupCards(d);
    if (!c || useTodaysCard(d)) return fresh;
    return Object.assign(fresh, { par: c.snap.par.slice(), hcp: c.snap.hcp.slice(), tees: ratedAsPlayed(fresh.tees, c.snap.tees) });
  }
  // The course's tees with the rating and slope each had on the round's card, and the card's tees the course no
  // longer has, as they were. A tee that card had no rating for (an older round, or tees rated since) has none.
  function ratedAsPlayed(tees, played) {
    const was = played || [];
    const unrated = (t) => Object.fromEntries(Object.entries(t).filter(([k]) => k !== 'rating' && k !== 'slope'));
    const now = tees.map((t) => {
      const p = was.find((x) => x.name === t.name);
      return isRated(p) ? Object.assign(unrated(t), { rating: p.rating, slope: p.slope }) : unrated(t);
    });
    return now.concat(clone(was.filter((p) => !tees.some((t) => t.name === p.name))));
  }
  // What stops a setup being saved, in plain words, or '' when nothing does.
  function setupProblem(d, ids, course) {
    if (ids.length < 2) return 'Pick at least two players.';
    if (ids.length > 4) return 'Four players at most.';
    if (d.legacy && ids.some((id) => !hcpOK(d.index[id]))) return 'Handicaps need to be whole numbers from -10 to 54.';
    if (!d.legacy && ids.some((id) => !indexOK(d.index[id]))) return INDEX_ERR;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d.date || '')) return 'Pick a date for the round.';
    if (!validCourse(course)) return coursesSorted().length ? 'Pick a course for the round.' : 'Add the course before starting the round.';
    const w = setupWeatherNums(d);
    if (w.temp != null && !(w.temp >= -20 && w.temp <= 120)) return 'Temperature should be between -20 and 120 °F.';
    if (w.windMph != null && !(w.windMph >= 0 && w.windMph <= 60)) return 'Wind should be between 0 and 60 mph.';
    if (w.humidity != null && !(w.humidity >= 0 && w.humidity <= 100)) return 'Humidity should be between 0 and 100%.';
    return '';
  }
  // The typed temperature, wind and humidity as whole numbers: null when left blank, NaN when not a number.
  const wholeOrBlank = (v) => (v === '' || v == null ? null : Math.round(num(v, NaN)));
  const setupWeatherNums = (d) => ({ temp: wholeOrBlank(d.temp), windMph: wholeOrBlank(d.windMph), humidity: wholeOrBlank(d.humidity) });
  // What a weather service filled in beyond the typed values, kept only while those still match it.
  const WX_KEPT = ['gustMph', 'src', 'place', 'at', 'kind', 'rainIn'];
  function setupWeather(d) {
    const w = setupWeatherNums(d);
    const weather = { sky: d.sky || '', temp: w.temp, wind: w.windMph != null ? '' : (d.wind || ''), windMph: w.windMph, windDir: d.windDir || '', precip: d.precip || '', humidity: w.humidity };
    const b = d.wxBase;
    const same = !!b && WXKEYS.every((k) => wxStr(b[k]) === wxStr(weather[k]));
    const kept = Object.fromEntries(WX_KEPT.map((k) => [k, same && b[k] != null ? b[k] : null]));
    const typed = !same && WXKEYS.some((k) => wxStr(weather[k]) !== '');
    return Object.assign(weather, kept, typed ? { src: 'manual' } : {});
  }
  // The round a setup saves, all but its scores.
  function setupRoundFields(d, ids, course, roster, weather) {
    const players = ids.map((id) => { const p = roster.find((x) => x.id === id); return { id, name: p.name, color: p.color }; });
    const hcp = Object.fromEntries(ids.map((id) => [id, setupPlayerHcp(d, id)]));
    const fields = {
      date: d.date, teeTime: /^\d{2}:\d{2}$/.test(d.teeTime || '') ? d.teeTime : '', weather, courseId: d.courseId, course,
      tee: (course.tees || []).some((t) => t.name === d.tee) ? d.tee : '', holes: d.holes, startHole: setupStart(d), players, hcp,
      allowance: d.allowance, games: normGames(d.games, ids), tripId: d.tripId && S.trips[d.tripId] ? d.tripId : null,
    };
    return Object.assign(fields, startMark(d), d.legacy ? {} : setupIndexFields(d, ids, course));
  }
  // Each player's index and tees, and hcpHoles when the handicaps are for the holes played (see setupHcpHoles).
  function setupIndexFields(d, ids, course) {
    const onCourse = (name) => (course.tees || []).some((t) => t.name === name);
    const index = Object.fromEntries(ids.map((id) => [id, parseIndex(d.index[id])]));
    const tees = Object.fromEntries(ids.map((id) => [id, onCourse(d.tees[id]) ? d.tees[id] : '']));
    const holes = setupHcpHoles(d);
    return Object.assign({ index, tees }, holes == null ? {} : { hcpHoles: holes });
  }
  // Remembers new players, their latest indexes and this group for next time. False when that couldn't be saved.
  async function rememberPlayers(d, ids, index, now) {
    const cur = conf();
    const newIndex = (p) => (ids.includes(p.id) && !d.legacy && (!d.id || d.adds.includes(p)) ? index[p.id] : p.index);
    const entry = (p) => { const ix = newIndex(p); return { id: p.id, name: p.name, hcp: Math.round(ix), index: ix, color: p.color }; };
    const added = d.adds.filter((p, i) => !cur.roster.some((x) => x.id === p.id) && d.adds.findIndex((q) => q.id === p.id) === i);
    const nextRoster = cur.roster.map(entry).concat(added.map(entry));
    const old = S.config || {};
    const tidy = !!S.config && (S.config.players || S.config.homeCourse != null);
    if (!tidy && JSON.stringify(nextRoster) === JSON.stringify(cur.roster) && (d.id || JSON.stringify(ids) === JSON.stringify(cur.lineup))) return true;
    const cfgDoc = Object.fromEntries(Object.entries(Object.assign(clone(old), { roster: nextRoster, lineup: d.id ? cur.lineup : ids, allowance: cur.allowance, games: cur.games, updatedAt: now }))
      .filter(([k]) => k !== 'players' && k !== 'homeCourse'));
    const prev = S.config;
    S.config = cfgDoc;
    try { await S.db.doc('config/app').set(cfgDoc); } catch (e) { S.config = prev; onWriteFail(e, null); return false; }
    return true;
  }
  // Saves an edited setup onto its round. A new first tee answers "Started on 10?", so the offer goes (see
  // startOffer), and moves the hole screen to the first hole still to play from there.
  function saveEditedSetup(d, fields) {
    const before = roundData(d.id);
    const moved = !!before && Golf.playOrder(before)[0] !== fields.startHole;
    const patch = moved ? Object.assign({}, fields, { firstScored: null, scoredOrder: null }) : fields;
    if (moved) S.hole = firstOpenHole(Object.assign({}, before, patch));

  // Starts a round from a setup: shown at once and saved behind it, then taken back off if the save fails.
  async function startRound(d, fields, weather, now) {
    const ref = S.db.collection('rounds').doc();
    const id = ref.id;
    const ids = fields.players.map((p) => p.id);
    const scores = Object.fromEntries(ids.map((p) => [p, {}]));
    const sandy = Object.fromEntries(ids.map((p) => [p, {}]));
    const doc = Object.assign({ createdAt: now, updatedAt: now, scores, junk: { greenie: {}, sandy } }, fields);
    S.optimistic[id] = doc;
    S.busy[id] = true;
    S.view = 'round'; S.roundId = id; S.editing = id; S.hole = Golf.playOrder(doc)[0]; S.setup = null; S.formError = '';

    S.busy[id] = false;
    if (S.pending[id]) flush(id);
    if (d.wxJob && !WXKEYS.some((k) => wxStr(weather[k]) !== '')) weatherAfterStart(d.wxJob, id);
  }

  // ---------- course library ----------
  function courseStats() {
    const st = {};
    for (const r of roundsSorted()) {
      if (!r.courseId) continue;
      const s = st[r.courseId] || (st[r.courseId] = { played: 0, last: '' });
      s.played += 1;
      if (String(r.date || '') > s.last) s.last = String(r.date || '');
    }
    return st;
  }
  // Saved courses, most recently played first.
  function coursesByRecent() {
    const st = courseStats();
    return coursesSorted().map((c) => Object.assign({}, c, st[c.id] || { played: 0, last: '' }))
      .sort((a, b) => b.last.localeCompare(a.last) || String(a.name).localeCompare(String(b.name)));
  }
  // ---------- the local course list (web/catalog.json, built into the page) ----------
  const catalogCourses = () => (typeof CATALOG !== 'undefined' && CATALOG && Array.isArray(CATALOG.courses) ? CATALOG.courses : []);
  const nameKey = (n) => String(n || '').toLowerCase().replace(/\b(the|golf|club|course|country|cc|gc|links)\b/g, '').replace(/[^a-z0-9]/g, '');
  // The saved course a list entry matches: same id, an old id it replaced, or the same name.
  function savedIdFor(c) {
    if (S.courses[c.id]) return c.id;
    const alias = (c.aliases || []).find((a) => S.courses[a]);
    if (alias) return alias;
    return Object.keys(S.courses).find((k) => S.courses[k].catalogId === c.id || nameKey(S.courses[k].name) === nameKey(c.name)) || null;
  }
  const catalogTee = (t) => Object.assign({ name: t.name, yards: t.yards.slice() }, t.rating && t.slope ? { rating: t.rating, slope: t.slope } : {});
  const catalogDoc = (c) => ({ name: c.name, location: c.city + ', ' + c.state, par: c.par.slice(), hcp: c.hcp.slice(), tees: c.tees.map(catalogTee), catalogId: c.id, lat: c.lat != null ? c.lat : null, lon: c.lon != null ? c.lon : null, source: c.website || '', updatedAt: new Date().toISOString() });
  // Saved courses the list can fill in: ratings and slopes for tees that have none, and where the course is.
  // The card itself (par, handicaps, yardages) is never touched.
  function catalogUpdates() {
    const out = [];
    for (const c of catalogCourses()) {
      const sid = savedIdFor(c);
      if (!sid) continue;
      const saved = S.courses[sid];
      let filled = 0;
      const tees = (saved.tees || []).map((t) => {
        const ct = c.tees.find((x) => x.name.toLowerCase() === String(t.name).toLowerCase());

    }

  }
  function catalogUpdatesHTML() {
    const ups = catalogUpdates().filter((u) => u.filled);

  function toBlob(canvas, q) { return new Promise((res) => canvas.toBlob(res, 'image/jpeg', q)); }
  // The whole card, plus two overlapping halves so small print survives the size limit on images.
  async function prepImages(file) {
    let bmp = null;
    try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) {
      try { bmp = await createImageBitmap(file); } catch (e2) { bmp = null; }
    }
    if (!bmp) return { blobs: [file], preview: URL.createObjectURL(file) };
    const scale = Math.min(1, 4000 / Math.max(bmp.width, bmp.height));
    const w = Math.round(bmp.width * scale);
    const h = Math.round(bmp.height * scale);
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(bmp, 0, 0, w, h);
    const blobs = [await toBlob(cv, 0.9)];
    const long = Math.max(w, h);
    const part = Math.round(long * 0.56);
    for (const start of [0, long - part]) {
      const c = document.createElement('canvas');
      if (h >= w) { c.width = w; c.height = part; c.getContext('2d').drawImage(cv, 0, start, w, part, 0, 0, w, part); }
      else { c.width = part; c.height = h; c.getContext('2d').drawImage(cv, start, 0, part, h, 0, 0, part, h); }
      blobs.push(await toBlob(c, 0.9));
    }
    const pv = document.createElement('canvas');
    const ps = Math.min(1, 1100 / long);
    pv.width = Math.round(w * ps); pv.height = Math.round(h * ps);
    pv.getContext('2d').drawImage(cv, 0, 0, pv.width, pv.height);
    const pb = await toBlob(pv, 0.82);
    return { blobs: blobs.filter(Boolean), preview: pb ? URL.createObjectURL(pb) : null };
  }
  function cardPrompt(n) {
    return [
      'This is a photo of a golf scorecard. A scoring app needs the course data from it. The card may be rotated, tilted or photographed sideways.',
      n > 1 ? 'Image 1 is the whole photo. Images 2 and 3 are close-up crops of each half of the same photo, overlapping in the middle, to help read small numbers.' : '',
      'Read holes 1 to 18:',
      '- par: the par for each hole from the men’s par row. If a hole shows two pars such as "4/3", use the first number.',
      '- hcp: the men’s handicap row, also called HCP or stroke index. It uses each number from 1 to 18 exactly once. If there are men’s and ladies’ rows, use the men’s.',
      '- tees: every tee row that has its own 18 yardages, named as printed (often a color). Skip combination tees that only point to other rows. Also copy the OUT, IN and TOTAL yardages printed for each tee.',
      '- parTotals: the OUT, IN and TOTAL par printed on the card.',
      '- courseName: the course name if it is printed, otherwise an empty string.',
      'Copy numbers exactly as printed. Use null for any number you cannot read. Do not calculate or guess missing numbers.',
      'Reply with only JSON in this shape, with 18 entries in every hole array:',
      '{"courseName":"","par":[4,5,3],"hcp":[7,13,17],"parTotals":{"out":36,"in":36,"total":72},"tees":[{"name":"White","yards":[380,512,165],"out":3100,"in":3150,"total":6250}],"notes":""}',

  function sampleCopy(c) {

    if (c === 'invalid_json' || c === 'empty_completion' || c === 'refused') return 'Couldn’t make out the card. Try a sharper photo taken straight on, with the whole card in frame.';

  async function onPhoto(file) {

  async function readCard(again) {

    const opts = { images: imgs, modelTier: 'complex', signal: ctl.signal };

  }
  const numsOf = (v) => (Array.isArray(v) ? v.slice(0, 18).map((x) => (x == null || x === '' || !Number.isFinite(Number(x)) ? '?' : String(Math.round(Number(x))))) : []);
  function applyCard(d) {
    const data = d && typeof d === 'object' ? d : {};
    const tees = (Array.isArray(data.tees) ? data.tees : []).filter((t) => t && Array.isArray(t.yards));
    S.course = Object.assign({}, S.course, {
      name: (S.course && S.course.name) || clipText(String(data.courseName || '').trim(), 48),

  // Cross-check what Claude read against the totals printed on the card.
  function cardChecks(d, tees) {
    const issues = []; const ok = [];
    const fmt = (n) => Number(n).toLocaleString('en-US');
    const vals = (a) => (Array.isArray(a) ? a.slice(0, 18).map((x) => (x == null ? NaN : Number(x))) : []);
    const par = vals(d.par);
    const parOK = par.length === 18 && par.every((p) => Number.isInteger(p) && p >= 3 && p <= 6);
    if (!parOK) issues.push('Par: ' + par.filter((p) => Number.isInteger(p)).length + ' of 18 holes read. Fill in any ? from the card.');
    const totals = d.parTotals || {};
    const cmp = (label, got, want) => { if (Number.isFinite(Number(want)) && Number(want) > 0 && got !== Number(want)) issues.push(label + ' adds to ' + fmt(got) + ' but the card says ' + fmt(want) + '.'); };
    if (parOK) {
      cmp('Par out', sum(par.slice(0, 9)), totals.out);
      cmp('Par in', sum(par.slice(9)), totals.in);
      cmp('Par total', sum(par), totals.total);
    }
    const hcp = vals(d.hcp);
    if (hcp.length !== 18 || hcp.slice().sort((x, y) => x - y).some((v, i) => v !== i + 1)) issues.push('Handicap: each number from 1 to 18 should appear once. Check the row against the card.');
    if (!tees.length) issues.push('No tee yardages found. That’s fine; tees are optional.');
    let teeIssues = 0;
    for (const t of tees) {
      const y = vals(t.yards);
      const name = String(t.name || 'Tee').trim();
      if (y.length !== 18 || y.some((v) => !Number.isInteger(v) || v <= 0)) { issues.push(name + ': some yardages are missing. Fill in any ? or delete the line.'); teeIssues++; continue; }
      const before = issues.length;
      cmp(name + ' out', sum(y.slice(0, 9)), t.out);
      cmp(name + ' in', sum(y.slice(9)), t.in);
      cmp(name + ' total', sum(y), t.total);
      if (issues.length > before) teeIssues++;
    }
    if (parOK && !issues.some((m) => m.startsWith('Par'))) ok.push('Par matches the card' + (Number(totals.total) > 0 ? ' (' + sum(par) + ')' : '') + '.');
    if (tees.length && !teeIssues) ok.push('Yardages add up to the card’s totals for ' + plural(tees.length, 'tee') + '.');
    if (d.notes && String(d.notes).trim()) issues.push('Claude’s note: ' + clipText(String(d.notes).trim(), 200));
    return { issues, ok };
  }
  // The course as saved after an edit: the editor's fields over everything already saved, so hole map marks (geo),

  async function saveCourse() {

    const hcp = parseNums(c.hcp);
    if (hcp.length !== 18 || hcp.slice().sort((x, y) => x - y).some((v, i) => v !== i + 1)) return formErr('Handicap needs each number from 1 to 18 exactly once.');
    const tees = [];

      const m = s.match(/^([^:]+):(.*)$/);
      if (!m) return formErr('Write each tee as a name, a colon, then 18 yardages.');

  document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.id === 'f-year') { S.year = el.value; render(); return; }
    if (el.id === 'h2h-a' || el.id === 'h2h-b') {
      const other = el.id === 'h2h-a' ? $('#h2h-b').value : $('#h2h-a').value;
      let a = el.id === 'h2h-a' ? el.value : other;
      let b = el.id === 'h2h-b' ? el.value : other;
      if (a === b) { const prev = S.h2h || {}; if (el.id === 'h2h-a') b = prev.a && prev.a !== a ? prev.a : b; else a = prev.b && prev.b !== b ? prev.b : a; }
      S.h2h = { a, b };
      try { localStorage.setItem('sb-h2h', JSON.stringify(S.h2h)); } catch (e) { /* storage unavailable */ }
      render(); return;
    }
    if (el.id === 'card-photo') { const f = el.files && el.files[0]; if (f) onPhoto(f); return; }
    if (!el.dataset || !el.dataset.bind) return;
    setPath(el.dataset.bind, el.type === 'checkbox' ? el.checked : el.value);
    if ((el.id === 'f-time' || el.id === 'f-date') && S.setup) {
      const d = S.setup;
      // Readings for the old time no longer apply; fetch again for the new one.
      if (setupWxAuto(d)) { WXKEYS.forEach((k) => { d[k] = ''; }); d.wxBase = null; }
      d.wx = null; wxSeq++;
      render(); fillSetupWeather(false); return;
    }
    if (el.dataset.bind === 'setup.courseId' && S.setup) {
      const c = S.courses[S.setup.courseId];
      if (!c || !(c.tees || []).some((t) => t.name === S.setup.tee)) S.setup.tee = '';
    }
    if (el.dataset.bind === 'whatIf.hcpOn' && S.whatIf && !el.checked) { const r = roundData(S.whatIf.id); if (r) Golf.pids(r).forEach((id) => { S.whatIf.hcp[id] = hcpOf(r, id); }); }
    if (el.dataset.rerender) render();
  });

  // ---------- data ----------
  function subscribe() {
    const db = S.db;
    const onErr = (again) => (e) => {
      const c = code(e);
      if (c === 'unavailable') { setTimeout(again, 3000); return; }
      if (c === 'revoked') { S.readOnly = true; toast('Your access to this tracker changed. Reload to continue.'); render(); return; }
      toast('Lost the live connection. Reload to reconnect.');
    };
    const subConfig = () => db.doc('config/app').onSnapshot((snap) => { S.config = snap.exists ? snap.data() : null; S.loaded.config = true; ready(); }, onErr(subConfig));
    const subCourses = () => db.collection('courses').onSnapshot((q) => {
      const m = {};
      q.docs.forEach((d) => { m[d.id] = d.data(); });
      S.courses = m; S.loaded.courses = true; ready();
    }, onErr(subCourses));
    const subRounds = () => db.collection('rounds').onSnapshot((q) => {
      const m = {};
      q.docs.forEach((d) => { m[d.id] = d.data(); });
      S.rounds = m;
      for (const id of Object.keys(S.optimistic)) if (m[id]) delete S.optimistic[id];
      S.loaded.rounds = true; ready();
    }, onErr(subRounds));
    const subTrips = () => db.collection('trips').onSnapshot((q) => {
      const m = {};
      q.docs.forEach((d) => { m[d.id] = d.data(); });
      S.trips = m; S.loaded.trips = true; ready();
    }, onErr(subTrips));
    subConfig(); subCourses(); subRounds(); subTrips();
  }
  function ready() {
    if (S.status === 'loading') {
      if (S.loaded.config && S.loaded.courses && S.loaded.rounds && S.loaded.trips) {
        S.status = 'ready'; restoreUI(); render();
        if (window.SB_NATIVE && window.SB_NATIVE.notice) toast(window.SB_NATIVE.notice, 10000);
        else if (expiryWarning()) toast(expiryWarning(), 8000);
      }
      return;
    }
    refresh();
  }
  async function boot() {
    S.native = !!window.SB_NATIVE;
    S.nativeWx = window.SB_NATIVE && typeof window.SB_NATIVE.weather === 'function' ? window.SB_NATIVE.weather : null;
    render();
    const c = window.claude;
    if (!c || typeof c.use !== 'function') { S.status = 'nodb'; render(); return; }
    let db = null;
    try { db = await c.use('db'); } catch (e) { db = null; if (e && e.code === 'damaged') S.loadError = e.message; }
    if (!db) { S.status = S.loadError ? 'damaged' : 'nodb'; render(); return; }
    S.db = db;
    subscribe();
    setTimeout(() => { if (S.status === 'loading') $('#view').innerHTML = '<div class="notice">Still loading your rounds. Check your connection, or reload the page.</div>'; }, 12000);
    c.use('sample').then(async (smp) => {
      if (!smp) return;
      const lim = await smp.limits().catch(() => null);
      S.sample = smp;
      S.sampleImages = !!(lim && lim.images);
      S.sampleMax = lim && lim.images ? Math.max(1, lim.images.maxCount || 1) : 1;
      if (S.status === 'ready' && (S.view === 'setup' || S.view === 'settings')) render();
    }).catch(() => {});
    c.use('mcp').then((m) => {
      if (!m) return;
      S.mcp = m;
      if (S.status === 'ready' && (S.view === 'setup' || S.view === 'round')) { render(); if (S.view === 'setup') fillSetupWeather(false); }
    }).catch(() => {});
    try {
      const u = await c.use('user');
      if (u) {
        const can = await u.can('data.write');
        S.canWrite = can;
        if (can === false) { S.readOnly = true; if (S.status === 'ready') render(); }
      }
    } catch (e) { /* treat as unknown */ }
  }
  boot();
})();

</script>
<script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script></body></html>
