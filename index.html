// Web version: stands in for the iPhone app's native side, so native.js and the app run unchanged in Safari.
// It answers the same requests the Swift Bridge does: load and save (browser storage), export, share,
// haptic (a no-op on iPhone) and weather (Open-Meteo, straight from the browser).
(() => {
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.sb) return;
  const KEY = 'oneup-data';
  const PREV = 'oneup-data-previous';
  const DAY = 'oneup-day-';
  const KEEP_DAYS = 14;

  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => localStorage.setItem(k, v),
    del: (k) => { try { localStorage.removeItem(k); } catch (e) { /* storage unavailable */ } },
    keys: () => { try { return Object.keys(localStorage); } catch (e) { return []; } },
  };
  const isObject = (t) => { try { const v = JSON.parse(t); return !!v && typeof v === 'object' && !Array.isArray(v); } catch (e) { return false; } };
  const hasContent = (t) => isObject(t) && Object.keys(JSON.parse(t)).length > 0;
  const pad = (n) => String(n).padStart(2, '0');
  const dayStamp = (d = new Date()) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

  // Ask the browser not to clear this site's storage when space runs low.
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  // Same safety rules as the phone app: keep copies, never save over data that won't read.
  function keepCopies(text) {
    if (!hasContent(text)) return;
    try {
      store.set(PREV, text);
      const today = DAY + dayStamp();
      if (store.get(today) == null) store.set(today, text);
      store.keys().filter((k) => k.startsWith(DAY)).sort().reverse().slice(KEEP_DAYS).forEach(store.del);
    } catch (e) { /* storage full: the data itself still saves */ }
  }
  function newestGoodCopy() {
    const prev = store.get(PREV);
    if (hasContent(prev)) return { text: prev, label: 'your last visit' };
    for (const k of store.keys().filter((x) => x.startsWith(DAY)).sort().reverse()) {
      const t = store.get(k);
      if (hasContent(t)) return { text: t, label: k.slice(DAY.length) };
    }
    return null;
  }
  function load() {
    const text = store.get(KEY);
    if (text != null) {
      if (isObject(text)) { keepCopies(text); return { json: text }; }
      const aside = 'oneup-data-damaged-' + Date.now();
      try { store.set(aside, text); store.del(KEY); } catch (e) { /* leave it where it is */ }
      const good = newestGoodCopy();
      if (!good) throw new Error('Your rounds couldn’t be read and there’s no backup to restore. Nothing will be saved until it’s sorted out.');
      store.set(KEY, good.text);
      return { json: good.text, notice: 'Your rounds couldn’t be read, so 1up restored the copy from ' + good.label + '.' };
    }
    const good = newestGoodCopy();
    if (good) { store.set(KEY, good.text); return { json: good.text, notice: 'Your rounds were missing, so 1up restored the copy from ' + good.label + '.' }; }
    return { json: '{}' };
  }
  function save(json) {
    if (!isObject(json)) throw new Error('That change couldn’t be saved.');
    try { store.set(KEY, json); } catch (e) { throw new Error('This phone’s browser storage is full.'); }
    return true;
  }

  async function shareText(text) {
    if (navigator.share) { try { await navigator.share({ text }); return true; } catch (e) { if (e && e.name === 'AbortError') return true; } }
    await navigator.clipboard.writeText(text);
    return true;
  }
  async function exportData() {
    const name = '1up rounds ' + dayStamp() + '.json';
    const blob = new Blob([store.get(KEY) || '{}'], { type: 'application/json' });
    const file = typeof File === 'function' ? new File([blob], name, { type: 'application/json' }) : null;
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return true; } catch (e) { if (e && e.name === 'AbortError') return true; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    return true;
  }

  // ---------- weather: the same lookup as the phone app's Weather.swift ----------
  const STATES = 'AL Alabama|AK Alaska|AZ Arizona|AR Arkansas|CA California|CO Colorado|CT Connecticut|DE Delaware|FL Florida|GA Georgia|HI Hawaii|ID Idaho|IL Illinois|IN Indiana|IA Iowa|KS Kansas|KY Kentucky|LA Louisiana|ME Maine|MD Maryland|MA Massachusetts|MI Michigan|MN Minnesota|MS Mississippi|MO Missouri|MT Montana|NE Nebraska|NV Nevada|NH New Hampshire|NJ New Jersey|NM New Mexico|NY New York|NC North Carolina|ND North Dakota|OH Ohio|OK Oklahoma|OR Oregon|PA Pennsylvania|RI Rhode Island|SC South Carolina|SD South Dakota|TN Tennessee|TX Texas|UT Utah|VT Vermont|VA Virginia|WA Washington|WV West Virginia|WI Wisconsin|WY Wyoming|DC District of Columbia'
    .split('|').map((x) => [x.slice(0, 2), x.slice(3)]);
  const places = new Map();
  async function locate(place) {
    const key = String(place || '').trim().toLowerCase();
    if (!key) throw new Error('Couldn’t find the course on the map.');
    if (places.has(key)) return places.get(key);
    const [town, region] = String(place).split(',').map((s) => s.trim());
    const state = region ? (STATES.find(([ab, nm]) => ab.toLowerCase() === region.toLowerCase() || nm.toLowerCase() === region.toLowerCase()) || null) : null;
    const url = 'https://geocoding-api.open-meteo.com/v1/search?count=10&language=en&format=json&name=' + encodeURIComponent(town);
    const res = await fetch(url);
    if (!res.ok) throw new Error('The map lookup didn’t answer (' + res.status + '). Try again in a minute.');
    const hits = (await res.json()).results || [];
    const hit = (state ? hits.find((h) => h.country_code === 'US' && h.admin1 === state[1]) : null) || (state ? null : hits[0]);
    if (!hit) throw new Error('Couldn’t find ' + place + ' on the map.');
    const ab = (STATES.find(([, nm]) => nm === hit.admin1) || [hit.admin1 || ''])[0];
    const spot = { lat: hit.latitude, lon: hit.longitude, name: [hit.name, ab].filter(Boolean).join(', ') };
    places.set(key, spot);
    return spot;
  }
  const compass = (deg) => ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round((((deg % 360) + 360) % 360) / 45) % 8];
  function sky(code, cloud) {
    if (code === 0 || code === 1) return 'sunny';
    if (code === 2) return 'partly';
    if (code === 3 || code === 45 || code === 48) return 'cloudy';
    return cloud != null && cloud < 60 ? 'partly' : 'cloudy';
  }
  function precip(code, inches) {
    if (inches >= 0.1) return 'rain';
    if (inches >= 0.02) return 'showers';
    if (inches > 0 || (code >= 51 && code <= 57)) return 'drizzle';
    if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82) || (code >= 95 && code <= 99)) return 'showers';
    return 'none';
  }
  async function weather({ place, date, time, until }) {
    const spot = await locate(place);
    const clock = String(time || '').split(':').map(Number);
    const day = String(date || '').split('-').map(Number);
    if (clock.length !== 2 || day.length !== 3 || clock.concat(day).some((n) => !Number.isFinite(n))) throw new Error('Add a tee time first.');
    const tee = new Date(day[0], day[1] - 1, day[2], clock[0], clock[1]);
    let hours = 4;
    const end = until ? new Date(until) : null;
    if (end && !isNaN(end)) hours = Math.max(1, Math.min(8, Math.ceil((end - tee) / 36e5)));
    const next = new Date(tee); next.setDate(next.getDate() + 1);
    const base = (Date.now() - tee) / 864e5 > 85 ? 'https://archive-api.open-meteo.com/v1/archive' : 'https://api.open-meteo.com/v1/forecast';
    const q = new URLSearchParams({
      latitude: spot.lat.toFixed(4), longitude: spot.lon.toFixed(4),
      hourly: 'temperature_2m,relative_humidity_2m,precipitation,weather_code,cloud_cover,wind_speed_10m,wind_direction_10m,wind_gusts_10m',
      temperature_unit: 'fahrenheit', wind_speed_unit: 'mph', precipitation_unit: 'inch', timezone: 'auto',
      start_date: date, end_date: dayStamp(next),
    });
    const res = await fetch(base + '?' + q);
    if (!res.ok) throw new Error('The weather service didn’t answer (' + res.status + '). Try again in a minute.');
    const hr = (await res.json()).hourly || {};
    let hour = clock[0] + (clock[1] >= 30 ? 1 : 0);
    let hourDay = date;
    if (hour === 24) { hour = 0; hourDay = dayStamp(next); }
    const target = hourDay + 'T' + pad(hour) + ':00';
    const i = (hr.time || []).indexOf(target);
    const val = (list, k) => (Array.isArray(list) && k >= 0 && k < list.length && list[k] != null ? list[k] : null);
    const temp = val(hr.temperature_2m, i);
    if (i < 0 || temp == null) throw new Error('No weather for that time yet.');
    const code = Math.round(val(hr.weather_code, i) || 0);
    let rain = 0;
    for (let k = i; k < Math.min(i + hours, hr.time.length); k++) rain += val(hr.precipitation, k) || 0;
    const out = { temp: Math.round(temp), sky: sky(code, val(hr.cloud_cover, i)), precip: precip(code, rain), rainIn: Math.round(rain * 100) / 100, place: spot.name, at: target, kind: tee > new Date() ? 'forecast' : 'record' };
    const opt = (k, list, f) => { const v = val(list, i); if (v != null) out[k] = f(v); };
    opt('windMph', hr.wind_speed_10m, Math.round);
    opt('windDir', hr.wind_direction_10m, compass);
    opt('gustMph', hr.wind_gusts_10m, Math.round);
    opt('humidity', hr.relative_humidity_2m, Math.round);
    return out;
  }

  const answer = async (m) => {
    switch (m && m.op) {
      case 'load': return load();
      case 'save': return save(m.json);
      case 'export': return exportData();
      case 'share': return shareText(m.text);
      case 'haptic': if (navigator.vibrate) navigator.vibrate(m.kind === 'done' ? [12, 40, 12] : 8); return true;
      case 'weather': return weather(m);
      default: throw new Error('Unknown request');
    }
  };
  window.SB_WEB = true;
  window.webkit = Object.assign(window.webkit || {}, { messageHandlers: { sb: { postMessage: answer } } });
})();

</script>
<script>
// iPhone bridge: stands in for Claude's runtime when Sandbagger runs inside the iOS app.
// Data lives in one JSON file in the app's Documents folder; weather comes from the app.
(() => {
  const h = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.sb;
  if (!h) return;
  const call = (msg) => h.postMessage(msg);
  const native = { notice: '', loadError: '', web: !!window.SB_WEB };
  window.SB_NATIVE = native;
  let store = {};
  // A file that won't load is never saved over: the page shows the problem and saves nothing.
  const ready = call({ op: 'load' })
    .then((reply) => {
      const r = reply && typeof reply === 'object' ? reply : { json: reply };
      const v = JSON.parse(r.json || '{}');
      if (!v || typeof v !== 'object' || Array.isArray(v)) throw new Error('Your rounds file isn’t in the expected shape.');
      store = v;
      native.notice = r.notice || '';
      native.expires = r.expires || '';
    })
    .catch((e) => { native.loadError = (e && e.message) || 'Your rounds couldn’t be loaded.'; });
  const listeners = new Set();
  const cp = (o) => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));
  const merge = (t, p) => {
    for (const k of Object.keys(p)) {
      const v = p[k];
      if (v && typeof v === 'object' && v.__delete__ === true) { delete t[k]; continue; }
      if (v && typeof v === 'object' && !Array.isArray(v)) {
        if (!t[k] || typeof t[k] !== 'object' || Array.isArray(t[k])) t[k] = {};
        merge(t[k], v);
      } else t[k] = v;
    }
    return t;
  };
  // Saves are batched, and written right away when the app is in the background.
  let timer = null;
  const flush = () => {
    clearTimeout(timer); timer = null;
    if (native.loadError) return Promise.resolve(false);
    return call({ op: 'save', json: JSON.stringify(store) }).catch((e) => {
      window.dispatchEvent(new CustomEvent('sb-save-failed', { detail: (e && e.message) || '' }));
      return false;
    });
  };
  const changed = () => {
    clearTimeout(timer);
    if (document.visibilityState === 'hidden') flush(); else timer = setTimeout(flush, 300);
    queueMicrotask(() => listeners.forEach((f) => f()));
  };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && timer) flush(); });
  window.addEventListener('pagehide', () => { if (timer) flush(); });

  const snap = (p) => ({ id: p.split('/').pop(), exists: p in store, data: () => cp(store[p]), metadata: { fromCache: false, hasPendingWrites: false } });
  const watch = (f) => { listeners.add(f); setTimeout(f, 0); return () => listeners.delete(f); };
  const docRef = (p) => ({
    id: p.split('/').pop(),
    path: p,
    get: async () => snap(p),
    set: async (d) => { store[p] = cp(d); changed(); },
    update: async (d) => { if (!(p in store)) throw { code: 'invalid_argument', message: 'No such document' }; merge(store[p], cp(d)); changed(); },
    delete: async () => { delete store[p]; changed(); },
    onSnapshot: (next) => watch(() => next(snap(p))),
  });
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const db = {
    doc: docRef,
    collection: (c) => ({
      path: c,
      doc: (id) => docRef(c + '/' + (id || newId())),
      onSnapshot: (next) => watch(() => {
        const depth = c.split('/').length + 1;
        const docs = Object.keys(store).filter((k) => k.startsWith(c + '/') && k.split('/').length === depth).map(snap);
        next({ docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: {} });
      }),
    }),
  };
  native.weather = (q) => call(Object.assign({ op: 'weather' }, q));
  native.flushNow = () => (timer ? flush() : Promise.resolve(true));
  native.exportData = () => native.flushNow().then(() => call({ op: 'export' }));
  native.shareText = (text) => call({ op: 'share', text });
  native.haptic = (kind) => { call({ op: 'haptic', kind }).catch(() => {}); };
  window.claude = {
    use: async (name) => {
      if (name === 'db') { await ready; if (native.loadError) throw { code: 'damaged', message: native.loadError }; return db; }
      if (name === 'user') return { can: async () => true, canEdit: () => true, isOwner: () => true };
      return null;
    },
  };
})();

</script>

  // ---------- head to head ----------
  // Two players, every finished round they both played: who beat whom, and by how much.
  function headToHead(rounds, A, B) {
    const o = { n: 0, net: { a: 0, b: 0, t: 0 }, gross: { a: 0, b: 0, t: 0 }, holes: { a: 0, b: 0, t: 0 }, skins: { a: 0, b: 0, n: 0 }, g18: 0, gA: 0, gB: 0, nA: 0, nB: 0, money: 0, moneyN: 0, last: [] };
    const cmp = (x, y) => (x < y ? 'a' : y < x ? 'b' : 't');
    for (const r of rounds) {
      const ids = Golf.pids(r);
      if (!ids.includes(A) || !ids.includes(B)) continue;
      const a = Golf.analyze(r);
      if (!a.complete) continue;
      o.n += 1;
      const k = cmp(a.stroke.net[A], a.stroke.net[B]);
      o.net[k] += 1;
      o.gross[cmp(a.stroke.gross[A], a.stroke.gross[B])] += 1;
      a.holes.forEach((x) => { o.holes[cmp(x.n[A], x.n[B])] += 1; });
      if (r.games.skins.on) { o.skins.a += a.skins.won[A]; o.skins.b += a.skins.won[B]; o.skins.n += 1; }
      if (a.list.length === 18) { o.g18 += 1; o.gA += a.stroke.gross[A]; o.gB += a.stroke.gross[B]; o.nA += a.stroke.net[A]; o.nB += a.stroke.net[B]; }
      if (ids.length === 2 && a.money.anyStake) { o.money += a.money.bal[A]; o.moneyN += 1; }
      if (o.last.length < 6) o.last.push({ id: r.id, date: r.date, w: k, nA: a.stroke.net[A], nB: a.stroke.net[B] });
    }
    return o;
  }
  // The pair to show first: the two who have finished the most rounds together.
  function busiestPair(rounds) {
    const n = {};
    for (const r of rounds) {
      const ids = Golf.pids(r);
      for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) { const k = ids[i] + '|' + ids[j]; n[k] = (n[k] || 0) + 1; }
    }
    const best = Object.keys(n).sort((x, y) => n[y] - n[x])[0];

  }
  function h2hHTML(rounds, ids, nameOf, yr) {

    const o = headToHead(done, pair.a, pair.b);

    if (!o.n) return out + '<p class="muted" style="margin:0">' + esc(A.name + ' and ' + B.name) + ' haven’t finished a round together' + esc(when) + '.</p>';
    const lead = o.net.a > o.net.b ? A : o.net.b > o.net.a ? B : null;
    out += '<div class="h2h-score"><div class="h2h-side"><b class="c' + A.color + '">' + o.net.a + '</b><span>' + esc(A.name) + '</span></div><div class="h2h-mid"><span class="label">Net wins</span><span class="muted">' + (o.net.t ? plural(o.net.t, 'tie') : 'no ties') + '</span></div><div class="h2h-side"><b class="c' + B.color + '">' + o.net.b + '</b><span>' + esc(B.name) + '</span></div></div>';
    out += '<div class="h2h-verdict">' + (lead ? nm(lead) + ' leads, ' + Math.max(o.net.a, o.net.b) + ' to ' + Math.min(o.net.a, o.net.b) : 'All square') + ' over ' + plural(o.n, 'round') + ' together' + esc(when) + '.</div>';

    }).join('') + '</div>';
    const notes = [];
    if (o.holes.t) notes.push(plural(o.holes.t, 'hole') + ' halved');
    if (o.g18 && o.g18 < o.n) notes.push('averages from 18-hole rounds');
    if (o.moneyN && Math.round(o.money * 100)) notes.push((o.money > 0 ? A.name : B.name) + ' up ' + money(Math.abs(o.money)) + ' in rounds with just the two of them');

    }).join('') + '</div></div>';
    return out;
  }

          (showSkins ? '<td class="' + (st.skins && Math.abs(st.skins - bestSkins) < 1e-9 ? 'lead' : '') + '">' + frac(st.skins) + '</td>' : '') +

          (showNet ? '<td class="' + (an != null && Math.abs(an - bestNet) < 1e-9 ? 'lead' : '') + '">' + (an == null ? '' : an.toFixed(1)) + '</td>' : '') +

  // A round from today or yesterday that isn't finished goes first on home, one tap from the hole you're on.

  function resumeHTML(rounds) {

    return '<button class="round-row" data-action="open" data-id="' + esc(r.id) + '">' +
      '<span class="rr-top"><span class="rr-date">' + esc(fmtDate(r.date)) + '</span>' + wxChip(r.weather, false) + '</span>' +
      (facts ? '<span class="rr-meta">' + esc(facts) + '</span>' : '') +
      '<span class="rr-scores">' + scores + '</span>' +

  }
  function locOf(r) { const c = S.courses[r.courseId]; return (c && c.location) || (r.course && r.course.location) || ''; }
  function fmtTime(hm) {
    if (!/^\d{1,2}:\d{2}$/.test(hm || '')) return '';
    const [h, m] = hm.split(':').map(Number);
    return (h % 12 || 12) + ':' + String(m).padStart(2, '0') + (h >= 12 ? ' PM' : ' AM');
  }
  // Tee time to the moment the round was finished, when both are known and plausible.
  function durationOf(r) {
    if (!/^\d{1,2}:\d{2}$/.test(r.teeTime || '') || !r.finishedAt || !/^\d{4}-\d{2}-\d{2}$/.test(r.date || '')) return '';
    const [y, mo, d] = r.date.split('-').map(Number);
    const [h, mi] = r.teeTime.split(':').map(Number);
    const mins = Math.round((Date.parse(r.finishedAt) - new Date(y, mo - 1, d, h, mi).getTime()) / 60000);
    if (!(mins >= 30 && mins <= 480)) return '';
    return Math.floor(mins / 60) + 'h ' + String(mins % 60).padStart(2, '0') + 'm';
  }
  const SKY = [['sunny', 'Sunny'], ['partly', 'Partly cloudy'], ['cloudy', 'Cloudy'], ['rain', 'Rain']];
  const WIND = [['calm', 'Calm'], ['breezy', 'Breezy'], ['windy', 'Windy']];
  const PRECIP = [['none', 'Dry'], ['drizzle', 'Drizzle'], ['showers', 'Showers'], ['rain', 'Steady rain']];
  const DIRS = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
  const hasNum = (v) => v != null && v !== '' && Number.isFinite(Number(v));
  function windOf(w) {
    if (hasNum(w.windMph)) {
      const mph = Math.round(Number(w.windMph));
      return { mph, dir: DIRS.includes(w.windDir) ? w.windDir : '', bucket: mph <= 5 ? 'calm' : mph <= 14 ? 'breezy' : 'windy' };
    }
    return w.wind ? { mph: null, dir: DIRS.includes(w.windDir) ? w.windDir : '', bucket: w.wind } : null;
  }
  const gustOf = (w, wd) => (wd && wd.mph != null && hasNum(w.gustMph) && Math.round(Number(w.gustMph)) > wd.mph ? Math.round(Number(w.gustMph)) : 0);
  function wxSource(w) {
    if (!w || !w.src) return '';
    if (w.src === 'accuweather') return 'AccuWeather' + (w.kind === 'forecast' ? ' forecast' : '') + (w.place ? ', ' + w.place : '');
    if (w.src === 'open-meteo') return 'Open-Meteo' + (w.kind === 'forecast' ? ' forecast' : '') + (w.place ? ', ' + w.place : '');
    if (w.src === 'obs') return w.place || 'Weather station';
    return w.src === 'manual' ? 'Entered by hand' : '';
  }
  function weatherLine(w) {
    if (!w) return '';
    const parts = [];
    const sky = SKY.find((x) => x[0] === w.sky);
    if (sky) parts.push(sky[1]);
    if (hasNum(w.temp)) parts.push(Math.round(Number(w.temp)) + '°F');
    const wd = windOf(w);
    if (wd) parts.push(wd.mph != null ? 'wind ' + wd.mph + ' mph' + (wd.dir ? ' ' + wd.dir : '') : (WIND.find((x) => x[0] === wd.bucket) || ['', ''])[1].toLowerCase());
    const g = gustOf(w, wd);
    if (g) parts.push('gusts ' + g + ' mph');
    const pr = PRECIP.find((x) => x[0] === w.precip);

  // ---------- what if: replay the same scores under other rules, nothing saved ----------
  // Each switch flips one rule from how the round was played.
  const hcpOf = (r, id) => Math.round(num(r.hcp && r.hcp[id], 0));
  function whatIfStart(r, first) {
    const hcp = {};
    Golf.pids(r).forEach((id) => { hcp[id] = hcpOf(r, id); });
    const w = { id: r.id, shots: false, skins: false, press: false, team: false, hcpOn: false, hcp, holes: false };
    if (first === 'hcp') w.hcpOn = true; else if (first) w[first] = true;
    return w;
  }
  function whatIfRound(r, w) {
    const x = clone(r);
    if (w.shots) x.allowance = r.allowance === 'full' ? 'low' : 'full';
    if (w.skins) x.games.skins.mode = r.games.skins.mode === 'carry' ? 'split' : 'carry';
    if (w.press) x.games.nassau.press = !r.games.nassau.press;
    if (w.team) x.games.team.scoring = r.games.team.scoring === 'both' ? 'best' : 'both';
    if (w.hcpOn) x.hcp = Object.assign({}, r.hcp, w.hcp);
    return x;
  }
  // The questions this round can ask, phrased as the change from how it was played.
  function whatIfQuestions(r) {
    const q = [['shots', r.allowance === 'full' ? 'Off the low man' : 'Full handicaps', r.allowance === 'full' ? 'Instead of full handicaps' : 'Instead of shots off the low man']];
    if (r.games.skins.on) q.push(['skins', r.games.skins.mode === 'carry' ? 'Split ties' : 'Carryovers', r.games.skins.mode === 'carry' ? 'Tied skins split instead of carrying over' : 'Tied skins carry to the next hole']);
    if (r.games.nassau.on) q.push(['press', r.games.nassau.press ? 'No presses' : 'Auto press', r.games.nassau.press ? 'No automatic presses in the Nassau' : 'Press automatically when 2 down']);
    if (r.games.team.on && Golf.pids(r).length === 4) q.push(['team', r.games.team.scoring === 'both' ? 'Best ball' : 'Both balls count', r.games.team.scoring === 'both' ? 'Each cart counts only its better score' : 'Each cart adds both scores']);
    q.push(['hcp', 'Other handicaps', 'Change anyone’s handicap']);
    return q;
  }
  function shotsText(a, P) {
    const got = a.ids.filter((id) => a.mh[id] !== 0);
    return got.length ? got.map((id) => P[id].name + ' ' + a.mh[id]).join(', ') : 'none';
  }
  function skinsText(a, P) {
    if (!a.thru) return 'Not started';
    let t = a.ids.slice().sort((p, q) => a.skins.won[q] - a.skins.won[p]).map((id) => P[id].name + ' ' + frac(a.skins.won[id])).join(', ');
    if (a.skins.riding > 1) t += ', ' + a.skins.riding + ' riding';
    if (a.skins.unclaimed) t += ', ' + a.skins.unclaimed + ' unclaimed';
    return t;
  }
  function nassauText(a, P) {
    const won = Golf.betsWon(a.nassau, a.ids);
    return a.ids.slice().sort((p, q) => won[q] - won[p]).map((id) => P[id].name + ' ' + won[id]).join(', ');
  }
  // One scorecard-style cell per hole for the skins strip.
  function skinCell(k, P) {
    if (!k) return '<td></td>';
    if (k.push) return '<td class="sp" title="Pushed">–</td>';
    if (!k.winners.length) return '<td class="cv" title="Carried">→</td>';
    if (k.split) return '<td class="sp" title="Split">–</td>';
    const p = P[k.winners[0]];
    return '<td class="t' + p.color + '">' + esc(p.ini) + (k.val > 1 ? '<sup>' + k.val + '</sup>' : '') + '</td>';
  }
  // Who took each hole: the skin when skins are on, otherwise the lowest net score.
  function holeCell(z, h, P, skins) {
    if (skins) return skinCell(z.skins.per[h], P);
    const x = z.holes.find((y) => y.h === h);
    if (!x || !x.done) return '<td></td>';
    if (x.low.length > 1) return '<td class="sp" title="Halved">–</td>';
    const p = P[x.low[0]];
    return '<td class="t' + p.color + '">' + esc(p.ini) + '</td>';
  }
  const holesChanged = (a, b, P, skins) => a.list.filter((h) => holeCell(a, h, P, skins) !== holeCell(b, h, P, skins));
  function stripHTML(a, b, P, skins) {
    const nine = (list) => {
      const ka = list.map((h) => holeCell(a, h, P, skins));
      const kb = list.map((h) => holeCell(b, h, P, skins));
      const diff = list.map((h, i) => ka[i] !== kb[i]);
      const row = (label, cells) => '<tr><th scope="row">' + label + '</th>' + cells.map((c, i) => (diff[i] ? c.replace('<td', '<td data-chg="1"') : c)).join('') + '</tr>';
      return '<table class="wi-strip"><thead><tr><th></th>' + list.map((h) => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>' + row('Played', ka) + row('What if', kb) + '</tbody></table>';
    };
    const list = a.list;
    const parts = list.length > 9 ? [list.slice(0, 9), list.slice(9)] : [list];
    const key = skins ? 'Initial: who won the skin. – split or pushed. → carried. Small number: skins won on that hole.' : 'Initial: who won the hole on net. – halved.';
    return parts.map(nine).join('') + '<div class="muted wi-key">' + key + ' Highlighted: changed.</div>';
  }
  function whatIfHTML(r, a, pp) {
    const P = pp.P;
    const qs = whatIfQuestions(r);
    const w = S.whatIf && S.whatIf.id === r.id ? S.whatIf : null;
    if (!w) {
      return '<section class="card whatif stack"><div><div class="label">What if…</div><div class="muted">Same scores, different rules. Tap one to see what would have changed. Nothing is saved.</div></div><div class="picks">' +
        qs.map((q) => '<button type="button" class="pick" data-action="wi-open" data-v="' + q[0] + '">' + esc(q[1]) + '</button>').join('') + '</div></section>';
    }
    const x = whatIfRound(r, w);
    const b = Golf.analyze(x);
    const any = w.shots || w.skins || w.press || w.team || (w.hcpOn && pp.list.some((p) => w.hcp[p.id] !== hcpOf(r, p.id)));
    let out = '<section class="card whatif stack" aria-label="What if"><div class="row"><div class="label">What if…</div><button class="btn ghost" data-action="wi-close">Done</button></div>';

    // The switches
    out += '<div class="wi-sw">' + qs.map((q) => {
      const id = 'wi-' + q[0];
      const on = q[0] === 'hcp' ? w.hcpOn : w[q[0]];
      let desc = q[2];
      if (q[0] === 'shots' && on) desc = 'Shots: ' + shotsText(b, P);
      let row = '<div class="game"><div class="game-head"><label for="' + id + '"><span class="gname">' + esc(q[1]) + '</span><span class="gdesc">' + esc(desc) + '</span></label><input type="checkbox" class="switch" role="switch" id="' + id + '" data-bind="whatIf.' + (q[0] === 'hcp' ? 'hcpOn' : q[0]) + '" data-rerender="1"' + (on ? ' checked' : '') + '></div>';
      if (q[0] === 'hcp' && on) {
        row += '<div class="wi-hcps">' + pp.list.map((p) => '<div class="wi-hcp"><span class="c' + p.color + '">' + esc(p.name) + ' <span class="muted">played ' + hcpOf(r, p.id) + '</span></span><span class="mini"><button class="pm" data-action="wi-hcp" data-p="' + esc(p.id) + '" data-v="-1" aria-label="' + esc(p.name) + ' handicap down">−</button><b' + (w.hcp[p.id] !== hcpOf(r, p.id) ? ' class="chg"' : '') + '>' + w.hcp[p.id] + '</b><button class="pm" data-action="wi-hcp" data-p="' + esc(p.id) + '" data-v="1" aria-label="' + esc(p.name) + ' handicap up">+</button></span></div>').join('') + '</div>';
      }
      return row + '</div>';
    }).join('') + '</div>';

    // The answer
    const rows = [];
    if (r.games.stroke.on) rows.push(['Stroke play', strokeRes(a, P).plain, strokeRes(b, P).plain]);
    if (r.games.skins.on) rows.push(['Skins', skinsText(a, P), skinsText(b, P)]);
    if (r.games.nassau.on) rows.push(['Nassau bets', nassauText(a, P), nassauText(b, P)]);
    const cartText = (z) => z.team.matches.map((m) => (z.team.partners === 'sixes' ? m.first + '–' + m.last + ': ' : '') + (m.bet.played ? betStatus(m, m.bet, P, false) : 'not started')).join(' · ');
    if (r.games.team.on && a.team.matches.length) rows.push(['Cart vs cart', cartText(a), cartText(b)]);
    if (a.money.anyStake) rows.push(['Money', pp.list.map((p) => p.name + ' ' + signed(a.money.bal[p.id])).join(', '), pp.list.map((p) => p.name + ' ' + signed(b.money.bal[p.id])).join(', ')]);
    const moved = rows.filter((y) => y[1] !== y[2]);
    const same = rows.filter((y) => y[1] === y[2]).map((y) => y[0]);
    // Totals can match by coincidence while holes change hands, so compare hole by hole too.
    const skinsOn = !!r.games.skins.on;
    const changed = any ? holesChanged(a, b, P, skinsOn) : [];
    const holesLine = changed.length ? plural(changed.length, 'hole') + ' change hands (' + changed.join(', ') + ').' : '';
    out += '<div class="wi-ans" role="status" aria-live="polite">';
    if (!any) out += '<div class="muted">Flip a switch above to see the difference.</div>';
    else if (!moved.length && !changed.length) out += '<div class="wi-head">No difference. Same results on every hole.</div>';
    else if (!moved.length) out += '<div class="wi-head">Same totals, different holes</div><div class="muted">' + esc(holesLine) + ' The gains and losses happen to even out.</div>';
    else {
      out += '<div class="wi-head">' + (moved.length === 1 ? 'One result changes' : moved.length + ' results change') + '</div>';
      out += moved.map((y) => '<div class="wi-item"><span class="k">' + esc(y[0]) + '</span><span class="v">' + esc(y[2]) + '</span><span class="was">was ' + esc(y[1]) + '</span></div>').join('');
      if (same.length) out += '<div class="muted">' + esc(andList(same.map((n, i) => (i && n !== 'Nassau bets' ? n.toLowerCase() : n)))) + ' unchanged.</div>';
      if (holesLine) out += '<div class="muted">' + esc(holesLine) + '</div>';
    }
    out += '</div>';

    if (changed.length) {
      out += '<button type="button" class="linkish" style="align-self:flex-start" data-action="wi-holes" aria-expanded="' + !!w.holes + '">' + (w.holes ? 'Hide hole by hole' : 'Show hole by hole') + '</button>';
      if (w.holes) out += '<div class="wi-strips">' + stripHTML(a, b, P, skinsOn) + '</div>';
    }
    if (!S.readOnly && any && (moved.length || changed.length)) {
      if (S.confirm === 'whatif') out += '<div class="confirm" role="alert"><span>Use these rules for this round? Scores stay as played. The results and season totals update.</span><span style="flex:1"></span><button class="btn" data-action="cancel-confirm">Cancel</button><button class="btn primary" data-action="wi-apply">Use them</button></div>';
      else out += '<button type="button" class="linkish wi-save" data-action="wi-apply-ask">Played it this way? Save these rules to the round</button>';
    }
    return out + '</section>';
  }

  // ---------- trips: a weekend of rounds, each with its own games, settled once ----------
  const tripsSorted = () => Object.keys(S.trips).map((id) => Object.assign({ id }, S.trips[id])).sort((a, b) => String(b.start || '').localeCompare(String(a.start || '')));
  const tripRounds = (id) => roundsSorted().filter((r) => r.tripId === id).reverse();
  const tripCovers = (t, date) => !!date && !!t.start && t.start <= date && date <= t.end;
  const shortDate = (iso) => fmtDate(iso).replace(/^[A-Za-z]+, /, '');
  const tripDates = (t) => (t.start === t.end ? fmtDate(t.start) : fmtDate(t.start) + ' to ' + shortDate(t.end));
  const payKey = (x) => x.from + '>' + x.to + '>' + Math.round(x.amt * 100);
  function tripPeople(rounds) {
    const P = {};
    rounds.forEach((r) => people(r).list.forEach((p) => { if (!P[p.id]) P[p.id] = p; }));
    return P;
  }
  function tripLeader(m, P) {
    const top = m.ids.slice().sort((p, q) => m.total[q] - m.total[p])[0];
    return top && Math.round(m.total[top] * 100) > 0 ? { p: P[top], amt: m.total[top] } : null;
  }
  function tripRowHTML(t) {
    const rounds = tripRounds(t.id);
    const m = Golf.tripMoney(rounds);
    const lead = tripLeader(m, tripPeople(rounds));
    return '<button class="round-row" data-action="trip-open" data-id="' + esc(t.id) + '"><span class="rr-top"><span class="rr-date">' + esc(t.name) + '</span>' + (lead ? '<span class="chip t' + lead.p.color + '">' + esc(lead.p.name) + ' ' + signed(lead.amt) + '</span>' : '') + '</span><span class="rr-meta">' + esc([tripDates(t), plural(rounds.length, 'round')].join(' · ')) + '</span></button>';
  }
  // The trip under way today, right under the round in progress.
  function tripNowHTML() {
    const t = tripsSorted().find((x) => tripCovers(x, todayISO()));
    if (!t) return '';
    const rounds = tripRounds(t.id);
    const m = Golf.tripMoney(rounds);
    const lead = tripLeader(m, tripPeople(rounds));
    return '<button class="resume trip-now" data-action="trip-open" data-id="' + esc(t.id) + '"><span class="rs-text"><span class="label">Trip</span><span class="rs-course">' + esc(t.name) + '</span><span class="rs-meta">' + esc([plural(rounds.length, 'round'), lead ? lead.p.name + ' up ' + money(lead.amt) : ''].filter(Boolean).join(' · ')) + '</span></span><span class="rs-go">Money ›</span></button>';
  }
  function tripHTML() {
    const t = S.trips[S.tripId];
    let out = '<div class="row"><button class="btn ghost" data-action="home">‹ Rounds</button>' + (t && !S.readOnly ? '<button class="btn ghost" data-action="trip-edit">Edit trip</button>' : '') + '</div>';
    if (!t) return out + '<div class="notice">This trip isn’t here anymore.</div>';
    const rounds = tripRounds(S.tripId);
    const m = Golf.tripMoney(rounds);
    const P = tripPeople(rounds);
    out += '<section class="stack" style="gap:2px"><div class="title">' + esc(t.name) + '</div><div class="muted">' + esc([tripDates(t), plural(rounds.length, 'round'), m.open ? m.open + ' still being played' : ''].filter(Boolean).join(' · ')) + '</div></section>';
    if (!S.readOnly) out += '<button class="btn primary wide" data-action="trip-round">Start a round on this trip</button>';
    if (!rounds.length) return out + '<div class="notice">No rounds yet. Rounds you start from ' + esc(tripDates(t)) + ' join the trip, each with its own games and stakes.</div>';
    const anyMoney = m.per.some((x) => x.anyStake);
    out += '<section class="card stack"><div class="label">' + (m.open ? 'Who owes whom so far' : 'Who owes whom') + '</div>';
    if (!anyMoney) out += '<div class="muted">No money on these rounds yet. Set stakes when you start a round and it adds up here.</div>';
    else if (!m.transfers.length) out += '<div class="muted">All square. Nobody owes anybody.</div>';
    else {
      out += m.transfers.map((x) => {
        const k = payKey(x);
        const paid = !!(t.paid && t.paid[k]);
        return '<div class="pay-row' + (paid ? ' paid' : '') + '"><span class="pay-what">' + nm(P[x.from]) + ' pays ' + nm(P[x.to]) + ' <b>' + money(x.amt) + '</b></span>' +
          (S.readOnly ? (paid ? '<span class="chip">Paid</span>' : '') : '<button class="tog" data-action="trip-paid" data-v="' + esc(k) + '" aria-pressed="' + paid + '">' + (paid ? 'Paid ✓' : 'Mark paid') + '</button>') + '</div>';
      }).join('');
      out += '<div class="muted">The fewest payments that settle the whole trip.' + (m.open ? ' Still changing while a round is being played.' : '') + '</div>';
    }
    out += '</section>';
    if (anyMoney) {
      // Players down the side and rounds across (R1, R2...), so it fits a phone with four players and a full weekend.
      const cell = (x, id) => (!(id in x.bal) ? '' : x.anyStake ? signed(x.bal[id]) : '–');
      out += '<section class="card stack"><div class="label">Money by round</div><div class="trip-wrap"><table class="stand trip-table"><thead><tr><th scope="col">Player</th>' + rounds.map((r, i) => '<th scope="col">R' + (i + 1) + '</th>').join('') + '<th scope="col">Trip</th></tr></thead><tbody>';
      m.ids.forEach((id) => { out += '<tr><th scope="row" class="c' + P[id].color + '">' + esc(P[id].name) + '</th>' + m.per.map((x) => '<td>' + cell(x, id) + '</td>').join('') + '<td><b>' + signed(m.total[id]) + '</b></td></tr>'; });
      out += '</tbody></table></div><div class="trip-key">' + rounds.map((r, i) => '<div><b>R' + (i + 1) + '</b> <button class="linkish" data-action="open" data-id="' + esc(r.id) + '">' + esc(shortDate(r.date) + ', ' + r.course.name) + '</button>' + (m.per[i].complete ? '' : ' <span class="muted">playing</span>') + (m.per[i].anyStake ? '' : ' <span class="muted">no stakes</span>') + '</div>').join('') + '</div></section>';
    }
    out += '<div class="row"><button class="btn" data-action="trip-share">' + (S.native ? 'Share with the group' : 'Copy for the group') + '</button></div>';
    if (S.copyText) out += '<textarea class="copybox" id="copybox" readonly aria-label="Trip summary to copy">' + esc(S.copyText) + '</textarea>';
    out += '<section class="stack"><div class="label">Rounds</div>' + rounds.slice().reverse().map(roundRowHTML).join('') + '</section>';
    return out;
  }
  function tripShareText(t, rounds, m, P) {
    const lines = [t.name + ', ' + tripDates(t)];
    if (!m.per.some((x) => x.anyStake)) lines.push('', 'No money on the rounds yet.');
    else if (!m.transfers.length) lines.push('', 'All square.');
    else {
      lines.push('', m.open ? 'Who owes whom so far:' : 'Who owes whom:');
      m.transfers.forEach((x) => lines.push(P[x.from].name + ' pays ' + P[x.to].name + ' ' + money(x.amt) + (t.paid && t.paid[payKey(x)] ? ' (paid)' : '')));
    }
    lines.push('', 'Round by round:');
    rounds.forEach((r, i) => {
      const x = m.per[i];
      lines.push(fmtDate(r.date) + ', ' + r.course.name + (x.complete ? '' : ' (still playing)') + ': ' + Object.keys(x.bal).map((id) => P[id].name + ' ' + signed(x.bal[id])).join(', '));
    });
    lines.push('', 'Trip: ' + m.ids.map((id) => P[id].name + ' ' + signed(m.total[id])).join(', '));
    return lines.join('\n');
  }
  function shareTrip() {
    const t = S.trips[S.tripId];
    if (!t) return;
    const rounds = tripRounds(S.tripId);
    shareText(tripShareText(t, rounds, Golf.tripMoney(rounds), tripPeople(rounds)), 'Trip summary copied');
  }
  async function togglePaid(k) {
    const id = S.tripId;
    const t = S.trips[id];
    if (!t || S.readOnly) return;
    const on = !(t.paid && t.paid[k]);
    try { await S.db.doc('trips/' + id).update({ paid: { [k]: on ? true : { __delete__: true } }, updatedAt: new Date().toISOString() }); } catch (e) { onWriteFail(e, null); return; }
    buzz(on ? 'done' : 'tap');
  }
  function openTripForm(id) {
    const t = id && S.trips[id];
    S.tripForm = t ? { id, name: t.name, start: t.start, end: t.end } : { id: null, name: '', start: todayISO(), end: todayISO(new Date(Date.now() + 2 * 864e5)) };
    S.confirm = null; S.formError = ''; S.copyText = '';
    S.view = 'tripedit';
    render();
    scrollTop();
  }
  function tripFormHTML() {
    const f = S.tripForm;
    let out = '<div class="row"><button class="btn ghost" data-action="trip-cancel">‹ Back</button></div><div class="title">' + (f.id ? 'Edit trip' : 'New trip') + '</div>';
    if (S.formError) out += '<div class="err" role="alert">' + esc(S.formError) + '</div>';
    out += '<section class="card form"><label class="field"><span>Name</span><input type="text" id="t-name" data-bind="tripForm.name" maxlength="40" placeholder="Myrtle Beach weekend" value="' + esc(f.name) + '"></label>' +
      '<div class="grid2"><label class="field"><span>First day</span><input type="date" id="t-start" data-bind="tripForm.start" value="' + esc(f.start) + '"></label><label class="field"><span>Last day</span><input type="date" id="t-end" data-bind="tripForm.end" value="' + esc(f.end) + '"></label></div>' +
      '<div class="muted">Rounds you start on these days join the trip. Each round keeps its own games and stakes; the trip adds up the money and settles it once.</div></section>';
    if (f.id) {
      if (S.confirm === 'trip') out += '<div class="confirm" role="alert"><span>Delete this trip? Its rounds are kept.</span><span style="flex:1"></span><button class="btn" data-action="cancel-confirm">Keep it</button><button class="btn danger solid" data-action="trip-delete">Delete</button></div>';
      else out += '<div class="row"><button class="btn ghost danger" data-action="trip-ask-delete">Delete trip</button><span></span></div>';
    }
    out += '<button class="btn primary wide" data-action="trip-save">' + (f.id ? 'Save trip' : 'Start the trip') + '</button>';
    return out;
  }
  async function saveTrip() {
    const f = S.tripForm;
    if (!f || S.readOnly) return;
    const name = String(f.name || '').trim();
    if (!name) return formErr('Give the trip a name.');
    const day = /^\d{4}-\d{2}-\d{2}$/;
    if (!day.test(f.start || '') || !day.test(f.end || '')) return formErr('Pick the first and last day.');
    if (f.end < f.start) return formErr('The last day can’t be before the first.');
    if ((new Date(f.end) - new Date(f.start)) / 864e5 > 14) return formErr('Keep a trip to two weeks or less.');
    const id = f.id || S.db.collection('trips').doc().id;
    const now = new Date().toISOString();
    const doc = Object.assign({ paid: {}, createdAt: now }, S.trips[id] || {}, { name: name.slice(0, 40), start: f.start, end: f.end, updatedAt: now });
    try { await S.db.doc('trips/' + id).set(doc); } catch (e) { onWriteFail(e, null); return; }
    // A trip started after its first round picks up the rounds already played on its days.
    if (!f.id) roundsSorted().filter((r) => !r.tripId && tripCovers(doc, r.date)).forEach((r) => editRound(r.id, { tripId: id }));
    S.tripForm = null; S.formError = ''; S.view = 'trip'; S.tripId = id;
    toast(f.id ? 'Trip saved' : name + ' started');
    render();
    scrollTop();
  }
  async function deleteTrip() {
    const id = S.tripForm && S.tripForm.id;
    if (!id || S.readOnly) return;
    tripRounds(id).forEach((r) => editRound(r.id, { tripId: null }));
    try { await S.db.doc('trips/' + id).delete(); } catch (e) { onWriteFail(e, null); return; }
    S.tripForm = null; S.confirm = null; S.view = 'home';
    toast('Trip deleted. Its rounds are kept.');
    render();
    scrollTop();
  }

  // ---------- round ----------
  function shotsLine(r, P) {
    const ids = Golf.pids(r);
    const mh = Golf.offLow(Golf.courseHcps(r, ids), ids, r.allowance);
    const getters = ids.filter((id) => mh[id] > 0);
    if (r.allowance === 'full') return 'Full shots';

  async function saveSetup() {
    const d = S.setup;
    if (!d || S.readOnly) return;
    const roster = setupRoster(d);
    const ids = d.players.filter((id) => roster.some((p) => p.id === id));
    if (ids.length < 2) return formErr('Pick at least two players.');
    if (ids.length > 4) return formErr('Four players at most.');
    if (d.legacy ? ids.some((id) => !hcpOK(d.index[id])) : ids.some((id) => !indexOK(d.index[id]))) return formErr(d.legacy ? 'Handicaps need to be whole numbers from -10 to 54.' : INDEX_ERR);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d.date || '')) return formErr('Pick a date for the round.');
    const course = S.courses[d.courseId] ? snapCourse(S.courses[d.courseId]) : d.courseSnap;
    if (!validCourse(course)) return formErr(coursesSorted().length ? 'Pick a course for the round.' : 'Add the course before starting the round.');
    const tee = (course.tees || []).some((t) => t.name === d.tee) ? d.tee : '';
    const hcp = {};
    const index = {};
    const ptees = {};
    ids.forEach((id) => {
      hcp[id] = setupHcp(d, id);
      if (d.legacy) return;
      index[id] = parseIndex(d.index[id]);
      ptees[id] = (course.tees || []).some((t) => t.name === d.tees[id]) ? d.tees[id] : '';
    });
    const now = new Date().toISOString();
    const players = ids.map((id) => { const p = roster.find((x) => x.id === id); return { id, name: p.name, color: p.color }; });
    const temp = d.temp === '' || d.temp == null ? null : Math.round(num(d.temp, NaN));
    if (temp != null && !(temp >= -20 && temp <= 120)) return formErr('Temperature should be between -20 and 120 °F.');
    const teeTime = /^\d{2}:\d{2}$/.test(d.teeTime || '') ? d.teeTime : '';
    const wmph = d.windMph === '' || d.windMph == null ? null : Math.round(num(d.windMph, NaN));
    if (wmph != null && !(wmph >= 0 && wmph <= 60)) return formErr('Wind should be between 0 and 60 mph.');
    const hum = d.humidity === '' || d.humidity == null ? null : Math.round(num(d.humidity, NaN));
    if (hum != null && !(hum >= 0 && hum <= 100)) return formErr('Humidity should be between 0 and 100%.');
    const weather = { sky: d.sky || '', temp, wind: wmph != null ? '' : (d.wind || ''), windMph: wmph, windDir: d.windDir || '', precip: d.precip || '', humidity: hum };
    const b = d.wxBase;
    const same = b && WXKEYS.every((k) => wxStr(b[k]) === wxStr(weather[k]));
    const keep = ['gustMph', 'src', 'place', 'at', 'kind', 'rainIn'];
    keep.forEach((k) => { weather[k] = same && b[k] != null ? b[k] : null; });
    if (!same && WXKEYS.some((k) => wxStr(weather[k]) !== '')) weather.src = 'manual';
    const fields = Object.assign({ date: d.date, teeTime, weather, courseId: d.courseId, course, tee, holes: d.holes, players, hcp, allowance: d.allowance, games: normGames(d.games, ids), tripId: d.tripId && S.trips[d.tripId] ? d.tripId : null }, d.legacy ? {} : { index, tees: ptees });

    // Remember new players, their latest handicaps and this group for next time.
    const c = S.config ? clone(S.config) : {};
    const cur = conf();
    const newIndex = (p) => (ids.includes(p.id) && !d.legacy && (!d.id || d.adds.includes(p)) ? index[p.id] : p.index);
    const nextRoster = cur.roster.map((p) => { const ix = newIndex(p); return { id: p.id, name: p.name, hcp: Math.round(ix), index: ix, color: p.color }; });
    d.adds.forEach((p) => { if (!nextRoster.some((x) => x.id === p.id)) { const ix = newIndex(p); nextRoster.push({ id: p.id, name: p.name, hcp: Math.round(ix), index: ix, color: p.color }); } });
    const cfgDoc = Object.assign({}, c, { roster: nextRoster, lineup: d.id ? cur.lineup : ids, allowance: cur.allowance, games: cur.games, updatedAt: now });
    delete cfgDoc.players;
    delete cfgDoc.homeCourse;
    if (JSON.stringify(nextRoster) !== JSON.stringify(cur.roster) || (!d.id && JSON.stringify(ids) !== JSON.stringify(cur.lineup)) || (S.config && (S.config.players || S.config.homeCourse != null))) {
      const prev = S.config;
      S.config = cfgDoc;
      try { await S.db.doc('config/app').set(cfgDoc); } catch (e) { S.config = prev; onWriteFail(e, null); return; }
    }

    if (d.id) {
      S.view = 'round'; S.roundId = d.id; S.setup = null; S.formError = '';
      editRound(d.id, fields);
      scrollTop();
      return;
    }
    const ref = S.db.collection('rounds').doc();
    const id = ref.id;
    const scores = {}; const sandy = {};
    ids.forEach((p) => { scores[p] = {}; sandy[p] = {}; });
    const doc = Object.assign({ createdAt: now, updatedAt: now, scores, junk: { greenie: {}, sandy } }, fields);
    S.optimistic[id] = doc;
    S.busy[id] = true;
    S.view = 'round'; S.roundId = id; S.editing = id; S.hole = Golf.holeList(doc.holes)[0]; S.setup = null; S.formError = '';
    saveUI();
    render();
    scrollTop();
    try { await ref.set(doc); } catch (e) {
      delete S.optimistic[id];
      S.busy[id] = false;
      S.view = 'home'; S.roundId = null;
      render();
      onWriteFail(e, null);
      return;
    }
    S.busy[id] = false;
    if (S.pending[id]) flush(id);
    if (d.wxJob && !WXKEYS.some((k) => wxStr(weather[k]) !== '')) weatherAfterStart(d.wxJob, id);
  }

  // ---------- course library ----------
  function courseStats() {
    const st = {};
    for (const r of roundsSorted()) {
      if (!r.courseId) continue;
      const s = st[r.courseId] || (st[r.courseId] = { played: 0, last: '' });
      s.played += 1;
      if (String(r.date || '') > s.last) s.last = String(r.date || '');
    }
    return st;
  }
  // Saved courses, most recently played first.
  function coursesByRecent() {
    const st = courseStats();
    return coursesSorted().map((c) => Object.assign({}, c, st[c.id] || { played: 0, last: '' }))
      .sort((a, b) => b.last.localeCompare(a.last) || String(a.name).localeCompare(String(b.name)));
  }
  // ---------- the local course list (web/catalog.json, built into the page) ----------
  const catalogCourses = () => (typeof CATALOG !== 'undefined' && CATALOG && Array.isArray(CATALOG.courses) ? CATALOG.courses : []);
  const nameKey = (n) => String(n || '').toLowerCase().replace(/\b(the|golf|club|course|country|cc|gc|links)\b/g, '').replace(/[^a-z0-9]/g, '');
  // The saved course a list entry matches: same id, an old id it replaced, or the same name.
  function savedIdFor(c) {
    if (S.courses[c.id]) return c.id;
    const alias = (c.aliases || []).find((a) => S.courses[a]);
    if (alias) return alias;
    return Object.keys(S.courses).find((k) => S.courses[k].catalogId === c.id || nameKey(S.courses[k].name) === nameKey(c.name)) || null;
  }
  const catalogTee = (t) => Object.assign({ name: t.name, yards: t.yards.slice() }, t.rating && t.slope ? { rating: t.rating, slope: t.slope } : {});
  const catalogDoc = (c) => ({ name: c.name, location: c.city + ', ' + c.state, par: c.par.slice(), hcp: c.hcp.slice(), tees: c.tees.map(catalogTee), catalogId: c.id, lat: c.lat != null ? c.lat : null, lon: c.lon != null ? c.lon : null, source: c.website || '', updatedAt: new Date().toISOString() });
  // Saved courses the list can fill in: ratings and slopes for tees that have none, and where the course is.
  // The card itself (par, handicaps, yardages) is never touched.
  function catalogUpdates() {
    const out = [];
    for (const c of catalogCourses()) {
      const sid = savedIdFor(c);
      if (!sid) continue;
      const saved = S.courses[sid];
      let filled = 0;
      const tees = (saved.tees || []).map((t) => {
        const ct = c.tees.find((x) => x.name.toLowerCase() === String(t.name).toLowerCase());
        if (t.rating || t.slope || !ct || !ct.rating || !ct.slope) return t;
        filled += 1;
        return Object.assign({}, t, { rating: ct.rating, slope: ct.slope });
      });
      if (filled || saved.catalogId !== c.id) out.push({ id: sid, name: saved.name, filled, doc: Object.assign({}, saved, { tees, catalogId: c.id, lat: saved.lat != null ? saved.lat : (c.lat != null ? c.lat : null), lon: saved.lon != null ? saved.lon : (c.lon != null ? c.lon : null) }) });
    }
    return out;
  }
  function catalogUpdatesHTML() {
    const ups = catalogUpdates().filter((u) => u.filled);
    if (!ups.length || S.readOnly) return '';
    const tees = ups.reduce((t, u) => t + u.filled, 0);
    return '<div class="notice row"><span>Course ratings and slopes are ready for ' + ups.length + ' of your courses (' + plural(tees, 'tee') + '). They turn indexes into course handicaps.</span><button class="btn" data-action="catalog-update">Fill them in</button></div>';

  function toBlob(canvas, q) { return new Promise((res) => canvas.toBlob(res, 'image/jpeg', q)); }
  // The whole card, plus two overlapping halves so small print survives the size limit on images.
  async function prepImages(file) {
    let bmp = null;
    try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) {
      try { bmp = await createImageBitmap(file); } catch (e2) { bmp = null; }
    }
    if (!bmp) return { blobs: [file], preview: URL.createObjectURL(file) };
    const scale = Math.min(1, 4000 / Math.max(bmp.width, bmp.height));
    const w = Math.round(bmp.width * scale);
    const h = Math.round(bmp.height * scale);
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(bmp, 0, 0, w, h);
    const blobs = [await toBlob(cv, 0.9)];
    const long = Math.max(w, h);
    const part = Math.round(long * 0.56);
    for (const start of [0, long - part]) {
      const c = document.createElement('canvas');
      if (h >= w) { c.width = w; c.height = part; c.getContext('2d').drawImage(cv, 0, start, w, part, 0, 0, w, part); }
      else { c.width = part; c.height = h; c.getContext('2d').drawImage(cv, start, 0, part, h, 0, 0, part, h); }
      blobs.push(await toBlob(c, 0.9));
    }
    const pv = document.createElement('canvas');
    const ps = Math.min(1, 1100 / long);
    pv.width = Math.round(w * ps); pv.height = Math.round(h * ps);
    pv.getContext('2d').drawImage(cv, 0, 0, pv.width, pv.height);
    const pb = await toBlob(pv, 0.82);
    return { blobs: blobs.filter(Boolean), preview: pb ? URL.createObjectURL(pb) : null };
  }
  function cardPrompt(n) {
    return [
      'This is a photo of a golf scorecard. A scoring app needs the course data from it. The card may be rotated, tilted or photographed sideways.',
      n > 1 ? 'Image 1 is the whole photo. Images 2 and 3 are close-up crops of each half of the same photo, overlapping in the middle, to help read small numbers.' : '',
      'Read holes 1 to 18:',
      '- par: the par for each hole from the men’s par row. If a hole shows two pars such as "4/3", use the first number.',
      '- hcp: the men’s handicap row, also called HCP or stroke index. It uses each number from 1 to 18 exactly once. If there are men’s and ladies’ rows, use the men’s.',
      '- tees: every tee row that has its own 18 yardages, named as printed (often a color). Skip combination tees that only point to other rows. Also copy the OUT, IN and TOTAL yardages printed for each tee.',
      '- parTotals: the OUT, IN and TOTAL par printed on the card.',
      '- courseName: the course name if it is printed, otherwise an empty string.',
      'Copy numbers exactly as printed. Use null for any number you cannot read. Do not calculate or guess missing numbers.',
      'Reply with only JSON in this shape, with 18 entries in every hole array:',
      '{"courseName":"","par":[4,5,3],"hcp":[7,13,17],"parTotals":{"out":36,"in":36,"total":72},"tees":[{"name":"White","yards":[380,512,165],"out":3100,"in":3150,"total":6250}],"notes":""}',

  function sampleCopy(c) {
    if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed', 'images_unavailable'].includes(c)) return 'Reading photos isn’t available for you here. Type the rows from the card below instead.';

    if (c === 'invalid_json' || c === 'empty_completion' || c === 'refused') return 'Couldn’t make out the card. Try a sharper photo taken straight on, with the whole card in frame.';

  async function readCard(again) {

  const numsOf = (v) => (Array.isArray(v) ? v.slice(0, 18).map((x) => (x == null || x === '' || !Number.isFinite(Number(x)) ? '?' : String(Math.round(Number(x))))) : []);
  function applyCard(d) {
    const data = d && typeof d === 'object' ? d : {};
    const tees = (Array.isArray(data.tees) ? data.tees : []).filter((t) => t && Array.isArray(t.yards));
    S.course = Object.assign({}, S.course, {
      name: (S.course && S.course.name) || String(data.courseName || '').trim().slice(0, 48),
      par: numsOf(data.par).join(' '),
      hcp: numsOf(data.hcp).join(' '),
      tees: tees.map((t) => String(t.name || 'Tee').replace(/[:\n]/g, ' ').trim().slice(0, 24) + ': ' + numsOf(t.yards).join(' ')).join('\n'),
    });
    S.cardCheck = cardChecks(data, tees);

  // Cross-check what Claude read against the totals printed on the card.
  function cardChecks(d, tees) {
    const issues = []; const ok = [];
    const fmt = (n) => Number(n).toLocaleString('en-US');
    const vals = (a) => (Array.isArray(a) ? a.slice(0, 18).map((x) => (x == null ? NaN : Number(x))) : []);
    const par = vals(d.par);
    const parOK = par.length === 18 && par.every((p) => Number.isInteger(p) && p >= 3 && p <= 6);
    if (!parOK) issues.push('Par: ' + par.filter((p) => Number.isInteger(p)).length + ' of 18 holes read. Fill in any ? from the card.');
    const totals = d.parTotals || {};
    const cmp = (label, got, want) => { if (Number.isFinite(Number(want)) && Number(want) > 0 && got !== Number(want)) issues.push(label + ' adds to ' + fmt(got) + ' but the card says ' + fmt(want) + '.'); };
    if (parOK) {
      cmp('Par out', sum(par.slice(0, 9)), totals.out);
      cmp('Par in', sum(par.slice(9)), totals.in);
      cmp('Par total', sum(par), totals.total);
    }
    const hcp = vals(d.hcp);
    if (hcp.length !== 18 || hcp.slice().sort((x, y) => x - y).some((v, i) => v !== i + 1)) issues.push('Handicap: each number from 1 to 18 should appear once. Check the row against the card.');
    if (!tees.length) issues.push('No tee yardages found. That’s fine; tees are optional.');
    let teeIssues = 0;
    for (const t of tees) {
      const y = vals(t.yards);
      const name = String(t.name || 'Tee').trim();
      if (y.length !== 18 || y.some((v) => !Number.isInteger(v) || v <= 0)) { issues.push(name + ': some yardages are missing. Fill in any ? or delete the line.'); teeIssues++; continue; }
      const before = issues.length;
      cmp(name + ' out', sum(y.slice(0, 9)), t.out);
      cmp(name + ' in', sum(y.slice(9)), t.in);
      cmp(name + ' total', sum(y), t.total);
      if (issues.length > before) teeIssues++;
    }
    if (parOK && !issues.some((m) => m.startsWith('Par'))) ok.push('Par matches the card' + (Number(totals.total) > 0 ? ' (' + sum(par) + ')' : '') + '.');
    if (tees.length && !teeIssues) ok.push('Yardages add up to the card’s totals for ' + plural(tees.length, 'tee') + '.');
    if (d.notes && String(d.notes).trim()) issues.push('Claude’s note: ' + String(d.notes).trim().slice(0, 200));
    return { issues, ok };
  }
  async function saveCourse() {
    const c = S.course;
    if (!c || S.readOnly) return;
    const name = String(c.name || '').trim();
    if (!name) return formErr('Give the course a name.');
    const par = parseNums(c.par);
    if (par.length !== 18 || par.some((p) => !Number.isInteger(p) || p < 3 || p > 6)) return formErr('Par needs 18 numbers, each from 3 to 6.');
    const hcp = parseNums(c.hcp);
    if (hcp.length !== 18 || hcp.slice().sort((x, y) => x - y).some((v, i) => v !== i + 1)) return formErr('Handicap needs each number from 1 to 18 exactly once.');
    const tees = [];
    for (const line of String(c.tees || '').split('\n')) {
      const s = line.trim();
      if (!s) continue;
      const m = s.match(/^([^:]+):(.*)$/);
      if (!m) return formErr('Write each tee as a name, a colon, then 18 yardages.');
      const ys = parseNums(m[2]);
      if (ys.length !== 18 || ys.some((y) => !Number.isInteger(y) || y <= 0)) return formErr(m[1].trim() + ' tees need 18 yardages.');
      const tee = { name: m[1].trim().slice(0, 24), yards: ys };
      const rs = (c.ratings || {})[teeKey(tee.name)] || {};
      const rt = String(rs.rating || '').trim();
      const sl = String(rs.slope || '').trim();
      if (rt || sl) {
        const rv = Number(rt); const sv = Number(sl);
        if (!(rv >= 55 && rv <= 85) || !(Number.isInteger(sv) && sv >= 55 && sv <= 155)) return formErr(tee.name + ' needs a course rating like 70.9 and a slope from 55 to 155, or neither.');
        tee.rating = Math.round(rv * 10) / 10;
        tee.slope = sv;
      }
      tees.push(tee);
    }
    const dupe = coursesSorted().find((x) => x.id !== c.id && String(x.name).trim().toLowerCase() === name.toLowerCase());
    if (dupe) return formErr(name + ' is already saved. Pick it from your courses, or give this one a different name.');
    const id = c.id || S.db.collection('courses').doc().id;
    const was = S.courses[id] || {};
    const keep = {};
    ['catalogId', 'lat', 'lon', 'source'].forEach((k) => { if (was[k] != null) keep[k] = was[k]; });
    try { await S.db.doc('courses/' + id).set(Object.assign(keep, { name: name.slice(0, 48), location: String(c.location || '').trim().slice(0, 48), par, hcp, tees, updatedAt: new Date().toISOString() })); } catch (e) { onWriteFail(e, null); return; }
    if (S.courseReturn === 'setup' && S.setup) { S.setup.courseId = id; S.setup.tee = ''; S.setup.courseSnap = null; }
    if (S.courseReturn === 'courses') { S.view = 'course'; S.courseView = id; scrollTop(); }
    S.course = null; S.photo = null; S.cardCheck = null; S.formError = '';
    toast(name + ' saved');
    render();
  }
