// Web version: stands in for the iPhone app's native side, so native.js and the app run unchanged in Safari.
// It answers the same requests the Swift Bridge does: load and save (browser storage), export, share,
// haptic (a no-op on iPhone) and weather (Open-Meteo, straight from the browser).
(() => {
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.sb) return;
  const KEY = 'oneup-data';
  const PREV = 'oneup-data-previous';
  // The stamp of the write the data came from (see "which write the data is" below).
  const REV = 'oneup-data-rev';
  const DAY = 'oneup-day-';
  const DAMAGED = 'oneup-data-damaged-';
  const ROUND_PREFIX = 'rounds/';
  const FULL_MARK = 'oneup-full'; // set when storage ran out of room for a write
  const NOTICE_DAY = 'oneup-notice-day'; // the day the storage notice was last shown
  const OWN_KEY = /^(oneup-|sb-|hvj-)/; // every key 1up keeps in this browser's storage
  const KEEP_DAYS = 7;
  const KEEP_DAMAGED = 2; // unreadable copies kept, newest first
  // WebKit, the engine under every iPhone browser, gives a site about 5 MB of localStorage, counted in bytes.
  const STORAGE_QUOTA_BYTES = 5 * 1024 * 1024;
  const BIG_STORAGE_SHARE = 0.6; // past this share of the quota, copies included, 1up says once a day to export
  const BIG_STORAGE_BYTES = Math.round(STORAGE_QUOTA_BYTES * BIG_STORAGE_SHARE); // app.js's Settings text uses the same mark
  const BIG_NOTICE = 'Your 1up data and its backup copies take over 3 MB in this browser, which allows about 5 MB. Export a copy from Settings often to keep your rounds safe.';
  const FULL_NOTICE = 'This phone’s browser storage is nearly full, so 1up can’t keep all its backup copies. Export a copy from Settings to keep your rounds safe.';
  const FULL_ERROR = 'This phone’s browser storage is full. Export a copy from Settings to keep your rounds safe.';
  const NO_BACKUP_ERROR = 'Your rounds couldn’t be read and there’s no backup to restore. 1up kept the damaged copy in this browser and won’t save over it. Save the damaged copy to keep it, or start fresh.';
  // Start fresh with no room to keep the damaged copy aside. The damaged screen offers Save, not Settings.
  const FRESH_FULL_ERROR = 'This browser’s storage is too full to keep the damaged copy and start fresh. Save the damaged copy, then clear this site’s data in your browser settings and open 1up again.';
  // Saves refused because trying again can't help. The page says so instead of retrying.
  const STALE_ERROR = '1up changed in another tab. Reload to see the latest.';
  // Another tab started the data over (storage cleared, or a restore) while this tab still holds the old data.
  const RESET_ERROR = '1up was reset in another tab. This tab still has your rounds: keep them here? If not, close this tab.';
  const DROPS_ROUNDS_ERROR = 'That change would remove rounds you didn’t delete. Your saved rounds are unchanged. Reload to see them.';
  const BAD_SAVE_ERROR = 'That change couldn’t be saved.';

  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => localStorage.setItem(k, v),
    del: (k) => { try { localStorage.removeItem(k); } catch (e) { /* storage unavailable */ } },
    keys: () => { try { return Object.keys(localStorage); } catch (e) { return []; } },
  };
  // Stored text as a data object, or null when it isn't one (missing, not JSON, or not an object).
  const parsedObject = (t) => {
    try { const v = JSON.parse(t); return !!v && typeof v === 'object' && !Array.isArray(v) ? v : null; } catch (e) { return null; }
  };
  const isObject = (t) => parsedObject(t) !== null;
  const hasContent = (t) => isObject(t) && Object.keys(JSON.parse(t)).length > 0;
  const pad = (n) => String(n).padStart(2, '0');
  const dayStamp = (d = new Date()) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const newestFirst = (prefix) => store.keys().filter((k) => k.startsWith(prefix)).sort().reverse(); // dates and times sort as text
  const dayKeys = () => newestFirst(DAY);
  const pruneDays = (keep) => dayKeys().slice(keep).forEach(store.del);
  const pruneDamaged = (keep) => newestFirst(DAMAGED).slice(keep).forEach(store.del);
  // WebKit's String::sizeInBytes: 1 byte a character for a string that's all Latin-1 (nothing past U+00FF),
  // 2 bytes a character for every character once any one is past it (an emoji, a curly apostrophe).
  const WIDE_CHAR = /[^\x00-\xff]/;
  const bytesOf = (s) => s.length * (WIDE_CHAR.test(s) ? 2 : 1);
  // Bytes 1up holds in browser storage, counted the way WebKit checks its quota: every key and value, so the
  // data, every copy (previous, daily and damaged) and its settings.
  const storedBytes = () => store.keys().filter((k) => OWN_KEY.test(k)).reduce((n, k) => n + bytesOf(k) + bytesOf(store.get(k) || ''), 0);
  // Remembers that storage ran out, so the next load says so (storageNotice).
  const markFull = () => { try { store.set(FULL_MARK, dayStamp()); } catch (e) { /* no room even for this; the size check still runs */ } };
  // The errors browsers give when storage is out of room (Firefox once used its own name).
  const QUOTA_ERRORS = ['QuotaExceededError', 'NS_ERROR_DOM_QUOTA_REACHED'];
  // One write: true when written, false when storage is full. Any other failure goes up as it is, since dropping
  // copies wouldn't help it.
  function isWritten(k, v) {
    try { store.set(k, v); return true; } catch (e) { if (e && QUOTA_ERRORS.includes(e.name)) return false; throw e; }
  }

  // ---------- making room when storage is full ----------
  const oldestFirst = (prefix) => [...newestFirst(prefix)].reverse();
  // The copies of the data, oldest first: the daily copies by date, then the previous copy (from this visit's start).
  const copyKeys = () => oldestFirst(DAY).concat(store.get(PREV) != null ? [PREV] : []);
  // Copies that repeat another copy word for word, so dropping them loses nothing. Of each set one stays: `keep`
  // when it's one of them, else the newest dated copy (the previous copy is replaced on the next visit anyway).
  function repeatedCopies(copies, keep) {
    const dated = copies.filter((k) => k !== PREV).reverse();
    const byPreference = [keep].concat(dated, copies.includes(PREV) ? [PREV] : []).filter((k) => k && copies.includes(k));
    // Built from the least preferred up, so each text ends up with its most preferred copy.
    const keeperOf = new Map([...byPreference].reverse().map((k) => [store.get(k), k]));
    const keepers = new Set(keeperOf.values());
    return copies.filter((k) => !keepers.has(k));
  }
  // What may go to make room, in the order it goes: copies that repeat another (nothing is lost), then the oldest
  // copy first. Damaged copies go last of all, and only for the data itself (`mayDropDamaged`), never to make room
  // for another damaged copy. `keep` (the copy a restore reads from, or damaged data just set aside) never goes.
  function roomPlan({ keep = null, mayDropDamaged = false } = {}) {
    const copies = copyKeys();
    const repeats = repeatedCopies(copies, keep);
    const others = copies.filter((k) => k !== keep && !repeats.includes(k));
    const damaged = mayDropDamaged ? oldestFirst(DAMAGED).filter((k) => k !== keep) : [];
    return repeats.concat(others, damaged);
  }
  const FOR_A_COPY = () => roomPlan();
  const FOR_THE_DATA = () => roomPlan({ mayDropDamaged: true });
  // Puts back what a write that still didn't fit dropped, the most valued first. The room it took is still free.
  const putBack = (dropped) => [...dropped].reverse().forEach(([k, v]) => isWritten(k, v));
  // Writes one value. When storage is full, what `plan` names goes one key at a time, with another try after each,
  // so nothing goes that the write didn't need. If it still doesn't fit, everything dropped goes back and the write
  // fails, so a failed write loses no copy. Either way the next load says storage ran short. Returns what went to
  // make room, as [key, text] pairs, so a later step that fails can put it back.
  function setWithRoom(k, v, plan = FOR_A_COPY) {
    if (isWritten(k, v)) return [];
    const dropped = [];
    for (const key of plan()) {
      const text = store.get(key);
      if (text == null) continue;
      store.del(key);
      dropped.push([key, text]);
      if (isWritten(k, v)) { markFull(); return dropped; }
    }
    putBack(dropped);
    markFull();
    throw new Error(FULL_ERROR);
  }
  // ---------- which write the data is ----------
  // Every write is stamped (under REV, as JSON) with its lineage, a revision that grows with every write, and a
  // random write id, so two different writes never look the same. A lineage starts whenever the data starts over
  // (a first visit, storage cleared, damaged data replaced, a restore); a write over data that reads goes on in its
  // lineage. `past` names every other lineage the data grew from, at the latest write it holds from each (a Keep, or
  // a tab putting its copy back after storage was cleared), so a tab still on one of them can tell the data holds
  // its copy. Older 1up stored "<lineage> <revision>" or a bare revision: no write id, and lineage ''.
  const NO_STAMP = Object.freeze({ line: '', rev: 0, id: '', past: [] });
  const isEntry = (s) => !!s && typeof s.line === 'string' && Number.isFinite(s.rev) && typeof s.id === 'string';
  const entryOf = (s) => ({ line: s.line, rev: s.rev, id: s.id });
  // A stamp's own write first, then the latest write it holds from each other lineage.
  const entriesOf = (stamp) => [entryOf(stamp)].concat(stamp.past);
  // The stamp stored as `text`, read as an older one when it isn't a stamp object.
  function parsedStamp(text) {
    const s = parsedObject(text);
    if (isEntry(s)) return { ...entryOf(s), past: Array.isArray(s.past) ? s.past.filter(isEntry).map(entryOf) : [] };
    const parts = String(text).split(' ');
    const [line, rev] = parts.length === 2 ? parts : ['', parts[0]];
    return { ...NO_STAMP, line, rev: Number(rev) || 0 };
  }
  const storedStamp = () => parsedStamp(store.get(REV) || '0');
  const randomName = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const isSameStamp = (a, b) => a.line === b.line && a.rev === b.rev && a.id === b.id;
  // Whether data stamped `stamp` holds the write `held`: that write itself, or a later one in its lineage.
  function holds(stamp, held) {
    const seen = entriesOf(stamp).find((s) => s.line === held.line);
    return !!seen && (seen.rev > held.rev || isSameStamp(seen, held));
  }
  // The lineages these stamps hold, other than `line`, each at the latest write held from it.
  // On a tie the first stamp's entry stays.
  function pastOf(stamps, line) {
    const all = stamps.flatMap(entriesOf).filter((s) => s.line !== line);
    const isBeaten = (s, i) => all.some((t, j) => t.line === s.line && (t.rev > s.rev || (t.rev === s.rev && j < i)));
    return all.filter((s, i) => !isBeaten(s, i));
  }
  // The stamp this tab's page was loaded from, last wrote, or took in from another tab. A write from another tab
  // moves the stored one past it until the storage event brings that write here.
  let baseStamp = NO_STAMP;
  // The data as this page last read, wrote or took in, so a change made elsewhere since can be told from its own.
  let baseText = '{}';
  const isOutOfDate = () => !isSameStamp(storedStamp(), baseStamp);
  // Whether stored data (readable) grew from this page's copy, so taking it in loses only what another tab removed
  // on purpose: this page had nothing yet, the data is this page's word for word, or it holds this page's write.
  // Anything else started over under this page (storage cleared or evicted, then another tab wrote, a restore, or
  // another tab's save made from the same data at the same moment as this page's), and this page's copy may be the
  // only one with its rounds.
  function isDescended(stamp, text) {
    if (!hasContent(baseText) || text === baseText) return true;
    return holds(stamp, baseStamp);
  }
  // The stamp for a write made now. Over data that reads it goes on in that data's lineage; with nothing readable
  // stored the data starts over, so a new lineage. Either way it carries this page's, and its revision moves past
  // both, so it always grows.
  function nextStamp() {
    const stored = storedStamp();
    const isOverReadable = isObject(store.get(KEY));
    const line = isOverReadable ? stored.line : randomName();
    const past = pastOf(isOverReadable ? [stored, baseStamp] : [baseStamp], line);
    return { line, rev: Math.max(stored.rev, baseStamp.rev) + 1, id: randomName(), past };
  }
  // Writes the data and its new stamp, so other tabs know their copy is out of date. This page is then up to date.
  function writeData(text, plan) {
    const next = nextStamp();
    setWithRoom(KEY, text, plan);
    setWithRoom(REV, JSON.stringify(next), plan);
    baseStamp = next;
    baseText = text;
  }

  // Ask the browser not to clear this site's storage when space runs low.
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  // Same safety rules as the phone app: keep copies, never save over data that won't read. Old copies are
  // pruned before new ones are written, so a full week of copies never needs room for one more.
  function keepCopies(text) {
    if (!hasContent(text)) return;
    const today = DAY + dayStamp();
    const isNewDay = store.get(today) == null;
    pruneDamaged(KEEP_DAMAGED);
    try {
      pruneDays(isNewDay ? KEEP_DAYS - 1 : KEEP_DAYS);
      store.set(PREV, text);
      if (isNewDay) store.set(today, text);
    } catch (e) { markFull(); /* the data itself still saves */ }
  }
  function newestGoodCopy() {
    const prev = store.get(PREV);
    if (hasContent(prev)) return { key: PREV, text: prev, label: 'your last visit' };
    for (const k of dayKeys()) {
      const t = store.get(k);
      if (hasContent(t)) return { key: k, text: t, label: k.slice(DAY.length) };
    }
    return null;
  }
  // Puts a good copy back, never dropping the copy it reads from. If storage is too full for that, the page still
  // opens with it and the next save tries.
  function restore(good, why) {
    try { writeData(good.text, () => roomPlan({ keep: good.key })); } catch (e) { /* the copy still loads, and stays */ }
    return { json: good.text, notice: why + ', so 1up restored the copy from ' + good.label + '.' };
  }
  // Moves data that won't read out of the way: a copy under its own name first, then the main key is cleared.
  // False when there's no room for the copy even after what `plan` allows goes; then it stays exactly where it is.
  function setAside(text, plan) {
    try { setWithRoom(DAMAGED + Date.now(), text, plan); } catch (e) { return false; }
    store.del(KEY);
    return true;
  }
  // Damaged data still in place, replaced by `json` as one step. A copy of it is set aside under its own name first
  // (only copies of the data go to make room for that), then `json` is written over the main key without dropping
  // that copy, so the damaged data is always in one key or the other. Older damaged copies may go for `json` only
  // when `mayDropDamaged`. If `json` doesn't fit, the copy set aside and everything dropped for it go back, and the
  // step fails having changed nothing.
  function replaceDamaged(damaged, json, mayDropDamaged) {
    const asideKey = DAMAGED + Date.now();
    const dropped = setWithRoom(asideKey, damaged, FOR_A_COPY);
    try {
      writeData(json, () => roomPlan({ keep: asideKey, mayDropDamaged }));
    } catch (e) {
      // Only undone while the damaged data is still in place: if `json` went in, the copy aside is all that's left of it.
      if (store.get(KEY) === damaged) { store.del(asideKey); putBack(dropped); }
      throw e;
    }
  }
  // The data won't read. Without room to set it aside, this visit runs on the good copy and nothing writes over
  // the damaged data until a save can set it aside first.
  function restoreDamaged(text) {
    const good = newestGoodCopy();
    const isAside = setAside(text, () => roomPlan({ keep: good && good.key }));
    if (!good) throw new Error(NO_BACKUP_ERROR);
    if (isAside) return restore(good, 'Your rounds couldn’t be read');
    return { json: good.text, notice: 'Your rounds couldn’t be read, so 1up opened the copy from ' + good.label + '. ' + FULL_ERROR };
  }
  function openData() {
    const text = store.get(KEY);
    if (text == null) {
      const good = newestGoodCopy();
      if (good) return restore(good, 'Your rounds were missing');
      // Damaged data set aside on an earlier visit means this isn't a first visit: don't start over quietly.
      if (newestFirst(DAMAGED).length) throw new Error(NO_BACKUP_ERROR);
      return { json: '{}' };
    }
    if (!isObject(text)) return restoreDamaged(text);
    keepCopies(text);
    return { json: text };
  }
  // Once a day: a word when storage ran out of room for a copy or a save (old copies had to go), or when
  // everything 1up keeps here passes 60% of the quota. Both come before saving fails, since the copies give way first.
  function storageNotice(stored) {
    const today = dayStamp();
    if (store.get(NOTICE_DAY) === today) return '';
    const text = store.get(FULL_MARK) != null ? FULL_NOTICE : stored > BIG_STORAGE_BYTES ? BIG_NOTICE : '';
    if (!text) return '';
    try { store.set(NOTICE_DAY, today); } catch (e) { /* shown again next time */ }
    store.del(FULL_MARK);
    return text;
  }
  // The data, how much 1up keeps in storage (for Settings), and one notice at most: a restore comes first.
  function load() {
    // Data that reads is this page's base as stamped. Otherwise this page holds no write yet: a lineage of its own,
    // so no write made elsewhere can look like one it holds. A restore's write then starts the data's new lineage.
    baseStamp = isObject(store.get(KEY)) ? storedStamp() : { ...NO_STAMP, line: randomName() };
    const opened = openData();
    baseText = opened.json;
    const stored = storedBytes();
    const notice = opened.notice || storageNotice(stored);
    return notice ? { json: opened.json, stored, notice } : { json: opened.json, stored };
  }
  const roundIds = (data) => Object.keys(data).filter((k) => k.startsWith(ROUND_PREFIX));
  // Rounds stored now that a save would drop without the person deleting them. It reads what's stored, not what
  // this page loaded, so a write from anywhere else (even an older copy of 1up) is caught too.
  function lostRounds(stored, saving, deleted) {
    const kept = new Set(roundIds(saving).concat(deleted));
    return roundIds(stored).filter((id) => !kept.has(id));
  }
  // JSON with every object's keys in order, so the same data compares equal however its objects were built.
  const canonical = (v) => JSON.stringify(v, (k, x) => (x && typeof x === 'object' && !Array.isArray(x) ? Object.fromEntries(Object.keys(x).sort().map((key) => [key, x[key]])) : x));
  // Changes stored since this page last read, wrote or took in the data that `saving` would undo: documents another
  // tab added, changed or deleted that the save doesn't have the same way. Rounds this page deleted on purpose don't
  // count.
  function changesLost(stored, saving, deleted) {
    const base = parsedObject(baseText) || {};
    const gone = new Set(deleted);
    const isChangedElsewhere = (k) => canonical(stored[k]) !== canonical(base[k]);
    const keys = [...new Set(Object.keys(stored).concat(Object.keys(base)))];
    return keys.filter((k) => !gone.has(k) && isChangedElsewhere(k) && canonical(stored[k]) !== canonical(saving[k]));
  }
  // A refused save: nothing is written, and the page shows why instead of trying again.
  const refuse = (reason) => ({ refused: reason });
  // Refused because the data started over in another tab: the page asks whether to keep its copy (keepHere).
  const refuseReset = () => ({ refused: RESET_ERROR, reset: true });
  // Rounds only ever leave on purpose, and a page that's out of date never writes over newer data. Out of date
  // only matters when the stored data has something this page would lose, and only until the storage event brings
  // the other tab's write here (takeInWriteElsewhere). Data that started over in another tab is never written over
  // without asking. Storage cleared under the page, or data set aside by another tab, leaves this page's copy the
  // only one, and the save puts it back (nextStamp: a new lineage that carries this page's, so another tab on the
  // same copy takes it in). Data that won't read is set aside and the save written in its place as one step
  // (replaceDamaged), never written over.
  function save(json, deletedRounds) {
    const saving = parsedObject(json);
    if (!saving) return refuse(BAD_SAVE_ERROR);
    const deleted = Array.isArray(deletedRounds) ? deletedRounds : [];
    const storedText = store.get(KEY);
    const stored = parsedObject(storedText);
    if (stored && isOutOfDate()) {
      if (!isDescended(storedStamp(), storedText)) return refuseReset();
      if (changesLost(stored, saving, deleted).length) return refuse(STALE_ERROR);
    }
    if (stored && lostRounds(stored, saving, deleted).length) return refuse(DROPS_ROUNDS_ERROR);
    try {
      if (storedText != null && !stored) replaceDamaged(storedText, json, true);
      else writeData(json, FOR_THE_DATA);
    } catch (e) {
      throw new Error(FULL_ERROR);
    }
    return { stored: storedBytes() };
  }
  const tellPage = (detail) => window.dispatchEvent(new CustomEvent('sb-stored-elsewhere', { detail }));
  // Another tab (or window) saved: when that grew from this page's copy, this page takes in what's stored now
  // (native.js puts its own unsaved changes back on top), so it shows that tab's changes, deletions included, and
  // its next save keeps them. Storage cleared (a null key), the data removed (another tab set it aside) or data that
  // won't read is never taken in: this page's copy is then the only good one, and its next save puts it back. Data
  // that started over elsewhere isn't taken in either: the page asks whether to keep its copy here. A write whose
  // stamp hasn't arrived yet waits for it (the stamp is written last, and its own event follows).
  function takeInWriteElsewhere(e) {
    if (!e || (e.key !== KEY && e.key !== REV)) return;
    const text = store.get(KEY);
    const stamp = storedStamp();
    if (!isObject(text) || isSameStamp(stamp, baseStamp)) return;
    if (!isDescended(stamp, text)) { tellPage({ reset: true, reason: RESET_ERROR }); return; }
    const was = baseText;
    baseStamp = stamp;
    baseText = text;
    if (text !== was) tellPage({ json: text, base: was });
  }
  window.addEventListener('storage', takeInWriteElsewhere);
  // Keep, after the data started over in another tab: this page takes what's stored now as its base, carrying its own
  // lineage (so other tabs still on it take the kept data in), and sends it back with what native.js merges it
  // against before saving the two together as its next version. That's this page's base when the stored data holds
  // it (another tab's Keep already took this copy in, so a correction or deletion made there since stands), and
  // nothing otherwise: data that started over never had this page's rounds. Nothing readable stored: this page's
  // copy is all there is, and its save puts it back.
  function keepHere() {
    const text = store.get(KEY);
    if (!isObject(text)) return { json: '{}', base: '{}' };
    const stamp = storedStamp();
    const base = isDescended(stamp, text) ? baseText : '{}';
    baseStamp = { ...stamp, past: pastOf([stamp, baseStamp], stamp.line) };
    baseText = text;
    return { json: text, base };
  }

  // ---------- data that won't read and has no backup: only the person can decide ----------
  // The damaged data: still in place, or the newest copy set aside.
  function damagedText() {
    const text = store.get(KEY);
    if (text != null && !isObject(text)) return text;
    const newest = newestFirst(DAMAGED)[0];
    return newest ? store.get(newest) : null;
  }
  function exportDamaged() {
    const text = damagedText();
    if (text == null) throw new Error('There’s no damaged copy to save.');
    return exportFile(text, '1up damaged copy ' + dayStamp() + '.json');
  }
  // Starting over empty, chosen on the screen that explains the damage. Damaged data still in place is set aside
  // as the empty data replaces it, and no damaged copy goes to make room: only copies of the data, none of which
  // reads in this state.
  function startFresh() {
    const text = store.get(KEY);
    if (hasContent(text)) throw new Error('Your rounds can be read, so there’s nothing to start over from.');
    try {
      if (text != null && !isObject(text)) replaceDamaged(text, '{}', false);
      else writeData('{}', FOR_A_COPY);
    } catch (e) {
      throw new Error(FRESH_FULL_ERROR);
    }
    return true;
  }

  async function shareText(text) {
    if (navigator.share) { try { await navigator.share({ text }); return true; } catch (e) { if (e && e.name === 'AbortError') return true; } }
    await navigator.clipboard.writeText(text);
    return true;
  }
  // Exports the data the page sends (what's in memory), so the copy is complete even when saving is failing.
  const exportData = (json) => exportFile(json || store.get(KEY) || '{}', '1up rounds ' + dayStamp() + '.json');
  // A file to keep: the share sheet where the browser has one for files, a download otherwise.
  async function exportFile(text, name) {
    const blob = new Blob([text], { type: 'application/json' });
    const file = typeof File === 'function' ? new File([blob], name, { type: 'application/json' }) : null;
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return true; } catch (e) { if (e && e.name === 'AbortError') return true; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    return true;
  }

  // ---------- weather: the same lookup as the phone app's Weather.swift ----------
  const STATES = 'AL Alabama|AK Alaska|AZ Arizona|AR Arkansas|CA California|CO Colorado|CT Connecticut|DE Delaware|FL Florida|GA Georgia|HI Hawaii|ID Idaho|IL Illinois|IN Indiana|IA Iowa|KS Kansas|KY Kentucky|LA Louisiana|ME Maine|MD Maryland|MA Massachusetts|MI Michigan|MN Minnesota|MS Mississippi|MO Missouri|MT Montana|NE Nebraska|NV Nevada|NH New Hampshire|NJ New Jersey|NM New Mexico|NY New York|NC North Carolina|ND North Dakota|OH Ohio|OK Oklahoma|OR Oregon|PA Pennsylvania|RI Rhode Island|SC South Carolina|SD South Dakota|TN Tennessee|TX Texas|UT Utah|VT Vermont|VA Virginia|WA Washington|WV West Virginia|WI Wisconsin|WY Wyoming|DC District of Columbia'
    .split('|').map((x) => [x.slice(0, 2), x.slice(3)]);
  const places = new Map();
  async function locate(place) {
    const key = String(place || '').trim().toLowerCase();
    if (!key) throw new Error('Couldn’t find the course on the map.');
    if (places.has(key)) return places.get(key);
    const [town, region] = String(place).split(',').map((s) => s.trim());
    const state = region ? (STATES.find(([ab, nm]) => ab.toLowerCase() === region.toLowerCase() || nm.toLowerCase() === region.toLowerCase()) || null) : null;
    const url = 'https://geocoding-api.open-meteo.com/v1/search?count=10&language=en&format=json&name=' + encodeURIComponent(town);
    const res = await fetch(url);
    if (!res.ok) throw new Error('The map lookup didn’t answer (' + res.status + '). Try again in a minute.');
    const hits = (await res.json()).results || [];
    const hit = (state ? hits.find((h) => h.country_code === 'US' && h.admin1 === state[1]) : null) || (state ? null : hits[0]);
    if (!hit) throw new Error('Couldn’t find ' + place + ' on the map.');
    const ab = (STATES.find(([, nm]) => nm === hit.admin1) || [hit.admin1 || ''])[0];
    const spot = { lat: hit.latitude, lon: hit.longitude, name: [hit.name, ab].filter(Boolean).join(', ') };
    places.set(key, spot);
    return spot;
  }
  const compass = (deg) => ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round((((deg % 360) + 360) % 360) / 45) % 8];
  function sky(code, cloud) {
    if (code === 0 || code === 1) return 'sunny';
    if (code === 2) return 'partly';
    if (code === 3 || code === 45 || code === 48) return 'cloudy';
    return cloud != null && cloud < 60 ? 'partly' : 'cloudy';
  }
  function precip(code, inches) {
    if (inches >= 0.1) return 'rain';
    if (inches >= 0.02) return 'showers';
    if (inches > 0 || (code >= 51 && code <= 57)) return 'drizzle';
    if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82) || (code >= 95 && code <= 99)) return 'showers';
    return 'none';
  }
  async function weather({ place, date, time, until }) {
    const spot = await locate(place);
    const clock = String(time || '').split(':').map(Number);
    const day = String(date || '').split('-').map(Number);
    if (clock.length !== 2 || day.length !== 3 || clock.concat(day).some((n) => !Number.isFinite(n))) throw new Error('Add a tee time first.');
    const tee = new Date(day[0], day[1] - 1, day[2], clock[0], clock[1]);
    let hours = 4;
    const end = until ? new Date(until) : null;
    if (end && !isNaN(end)) hours = Math.max(1, Math.min(8, Math.ceil((end - tee) / 36e5)));
    const next = new Date(tee); next.setDate(next.getDate() + 1);
    const base = (Date.now() - tee) / 864e5 > 85 ? 'https://archive-api.open-meteo.com/v1/archive' : 'https://api.open-meteo.com/v1/forecast';
    const q = new URLSearchParams({
      latitude: spot.lat.toFixed(4), longitude: spot.lon.toFixed(4),
      hourly: 'temperature_2m,relative_humidity_2m,precipitation,weather_code,cloud_cover,wind_speed_10m,wind_direction_10m,wind_gusts_10m',
      temperature_unit: 'fahrenheit', wind_speed_unit: 'mph', precipitation_unit: 'inch', timezone: 'auto',
      start_date: date, end_date: dayStamp(next),
    });
    const res = await fetch(base + '?' + q);
    if (!res.ok) throw new Error('The weather service didn’t answer (' + res.status + '). Try again in a minute.');
    const hr = (await res.json()).hourly || {};
    let hour = clock[0] + (clock[1] >= 30 ? 1 : 0);
    let hourDay = date;
    if (hour === 24) { hour = 0; hourDay = dayStamp(next); }
    const target = hourDay + 'T' + pad(hour) + ':00';
    const i = (hr.time || []).indexOf(target);
    const val = (list, k) => (Array.isArray(list) && k >= 0 && k < list.length && list[k] != null ? list[k] : null);
    const temp = val(hr.temperature_2m, i);
    if (i < 0 || temp == null) throw new Error('No weather for that time yet.');
    const code = Math.round(val(hr.weather_code, i) || 0);
    let rain = 0;
    for (let k = i; k < Math.min(i + hours, hr.time.length); k++) rain += val(hr.precipitation, k) || 0;
    const out = { temp: Math.round(temp), sky: sky(code, val(hr.cloud_cover, i)), precip: precip(code, rain), rainIn: Math.round(rain * 100) / 100, place: spot.name, at: target, kind: tee > new Date() ? 'forecast' : 'record' };
    const opt = (k, list, f) => { const v = val(list, i); if (v != null) out[k] = f(v); };
    opt('windMph', hr.wind_speed_10m, Math.round);
    opt('windDir', hr.wind_direction_10m, compass);
    opt('gustMph', hr.wind_gusts_10m, Math.round);
    opt('humidity', hr.relative_humidity_2m, Math.round);
    return out;
  }

  // ---------- cache: things that can be fetched again (elevation grids), kept apart from the rounds ----------
  // IndexedDB holds far more than localStorage and keeps these out of the saved copies and exports.
  const CACHE_DB = 'oneup-cache';
  const CACHE_STORE = 'files';
  const CACHE_KEY = /^[A-Za-z0-9_-]{1,120}$/;
  let cacheDb = null;
  function openCache() {
    if (!cacheDb) {
      cacheDb = new Promise((resolve, reject) => {
        if (!window.indexedDB) { reject(new Error('This browser has no room for map data.')); return; }
        const req = indexedDB.open(CACHE_DB, 1);
        req.onupgradeneeded = () => req.result.createObjectStore(CACHE_STORE);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error || new Error('Couldn’t open the map data store.'));
      }).catch((e) => { cacheDb = null; throw e; });
    }
    return cacheDb;
  }
  async function cacheRun(mode, work) {
    const db = await openCache();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(CACHE_STORE, mode);
      const req = work(tx.objectStore(CACHE_STORE));
      tx.oncomplete = () => resolve(req.result);
      tx.onerror = () => reject(tx.error || new Error('The map data store failed.'));
      tx.onabort = () => reject(tx.error || new Error('The map data store is full.'));
    });
  }
  function cacheName(key) {
    if (typeof key !== 'string' || !CACHE_KEY.test(key)) throw new Error('That cache name isn’t allowed.');
    return key;
  }
  const cacheGet = async (key) => { const v = await cacheRun('readonly', (s) => s.get(cacheName(key))); return typeof v === 'string' ? v : null; };
  const cachePut = async (key, text) => {
    if (typeof text !== 'string') throw new Error('Nothing to keep.');
    await cacheRun('readwrite', (s) => s.put(text, cacheName(key)));
    return true;
  };

  // GPS from the browser, delivered the way the app delivers it (window.__sbLoc).
  let watchId = null;
  function locStart() {
    if (!navigator.geolocation) { if (window.__sbLoc) window.__sbLoc({ error: 'unavailable' }); return true; }
    if (watchId != null) return true;
    watchId = navigator.geolocation.watchPosition(
      (p) => window.__sbLoc && window.__sbLoc({ lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy, t: p.timestamp }),
      (e) => { if (e.code === 1 && window.__sbLoc) window.__sbLoc({ error: 'denied' }); },
      { enableHighAccuracy: true, maximumAge: 2000 },
    );
    return true;
  }
  function locStop() {
    if (watchId != null && navigator.geolocation) navigator.geolocation.clearWatch(watchId);
    watchId = null;
    return true;
  }
  // Like the app after Settings: when the browser's location permission turns to allowed, say so
  // (window.__sbLocAllowed), so GPS can start again after a refusal. Browsers without the Permissions
  // API still recover when the page comes back on screen.
  function watchLocPermission() {
    if (!navigator.permissions || typeof navigator.permissions.query !== 'function') return;
    navigator.permissions.query({ name: 'geolocation' })
      .then((status) => {
        status.addEventListener('change', () => { if (status.state === 'granted' && window.__sbLocAllowed) window.__sbLocAllowed(); });
      })
      .catch(() => { /* this browser can't report location permission: coming back on screen still retries */ });
  }
  watchLocPermission();

  const answer = async (m) => {
    switch (m && m.op) {
      case 'load': return load();
      case 'save': return save(m.json, m.deletedRounds);
      case 'keep-here': return keepHere();
      case 'export': return exportData(m.json);
      case 'export-damaged': return exportDamaged();
      case 'start-fresh': return startFresh();
      case 'share': return shareText(m.text);
      case 'haptic': if (navigator.vibrate) navigator.vibrate(m.kind === 'done' ? [12, 40, 12] : 8); return true;
      case 'weather': return weather(m);
      case 'loc-start': return locStart();
      case 'loc-stop': return locStop();
      case 'cache-get': return cacheGet(m.key);
      case 'cache-put': return cachePut(m.key, m.text);
      default: throw new Error('Unknown request');
    }
  };
  window.SB_WEB = true;
  window.webkit = Object.assign(window.webkit || {}, { messageHandlers: { sb: { postMessage: answer } } });
})();

<script>
// iPhone bridge: stands in for Claude's runtime when Sandbagger runs inside the iOS app.
// Data lives in one JSON file in the app's Documents folder; weather comes from the app.
(() => {
  const h = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.sb;
  if (!h) return;
  const call = (msg) => h.postMessage(msg);
  const native = { notice: '', loadError: '', web: !!window.SB_WEB, storedBytes: null };
  window.SB_NATIVE = native;
  let store = {};
  // A file that won't load is never saved over: the page shows the problem and saves nothing.
  const ready = call({ op: 'load' })
    .then((reply) => {
      const r = reply && typeof reply === 'object' ? reply : { json: reply };
      const v = JSON.parse(r.json || '{}');
      if (!v || typeof v !== 'object' || Array.isArray(v)) throw new Error('Your rounds file isn’t in the expected shape.');
      store = v;
      native.notice = r.notice || '';
      native.expires = r.expires || '';
      noteStored(r);
    })
    .catch((e) => { native.loadError = (e && e.message) || 'Your rounds couldn’t be loaded.'; });
  // How much the web version keeps in browser storage (bytes, as WebKit counts its quota, copies included), for Settings.
  // The phone app doesn't report it, so it stays null there.
  function noteStored(reply) {
    if (reply && typeof reply.stored === 'number') native.storedBytes = reply.stored;
  }
  const listeners = new Set();
  const cp = (o) => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));
  const merge = (t, p) => {
    for (const k of Object.keys(p)) {
      const v = p[k];
      if (v && typeof v === 'object' && v.__delete__ === true) { delete t[k]; continue; }
      if (v && typeof v === 'object' && !Array.isArray(v)) {
        if (!t[k] || typeof t[k] !== 'object' || Array.isArray(t[k])) t[k] = {};
        merge(t[k], v);
      } else t[k] = v;
    }
    return t;
  };
  // JSON.stringify writes half an emoji (a lone surrogate) as \udXXX, which the app's JSON reader refuses, so
  // each half is swapped for U+FFFD before it goes. The check is one quick scan; the fix only runs when needed.
  const HALF_EMOJI_ESCAPE = /\\u[dD][89a-fA-F]/;
  const isHalfEmoji = (ch) => ch.length === 1 && ch >= '\uD800' && ch <= '\uDFFF';
  const wellFormed = (s) => Array.from(s).map((ch) => (isHalfEmoji(ch) ? '\uFFFD' : ch)).join('');
  const wellFormedValue = (k, v) => {
    if (typeof v === 'string') return wellFormed(v);
    if (v && typeof v === 'object' && !Array.isArray(v)) return Object.fromEntries(Object.entries(v).map(([key, x]) => [wellFormed(key), x]));
    return v;
  };
  const storeJSON = () => {
    const json = JSON.stringify(store);
    return HALF_EMOJI_ESCAPE.test(json) ? JSON.stringify(store, wellFormedValue) : json;
  };

  // Saves are batched, and written right away when the app is in the background. Until one works, the changes
  // stay marked unsaved: the page hears about it (sb-save-failed, then sb-saved) and saving tries again.
  // A save the native side refuses ({ refused: reason }: it would drop rounds, the file changed outside 1up, or the
  // data is out of date) can't work by sending it again, so there's no retry: the page hears sb-save-refused and
  // says what to do.
  const BATCH_MS = 300;
  const RETRY_MS = [2000, 5000, 15000, 30000, 60000]; // the last gap repeats while changes are unsaved
  let timer = null;
  let retryTimer = null;
  let edits = 0; // changes made since the page opened
  let savedEdits = 0; // changes the file holds
  let failures = 0; // saves failed in a row
  let refusals = 0; // saves refused since the last one that worked
  // Rounds deleted on purpose this session. Every save sends them, so the native side can tell a deletion from a
  // page that lost rounds (DataStore.lostRounds, browser.js lostRounds), even when the deletions waited out failed saves.
  // Round ids are never reused, and a round set again is taken off, so the list can stay for the session.
  const ROUND_PREFIX = 'rounds/';
  const deletedRounds = new Set();
  const isUnsaved = () => savedEdits < edits;
  const report = (name, detail) => window.dispatchEvent(new CustomEvent(name, { detail }));
  const retryLater = () => {
    clearTimeout(retryTimer);
    retryTimer = setTimeout(flush, RETRY_MS[Math.min(failures, RETRY_MS.length) - 1]);
  };
  const onSaved = (upTo) => {
    savedEdits = Math.max(savedEdits, upTo);
    if (isUnsaved()) return true; // newer changes are on their way
    clearTimeout(retryTimer); retryTimer = null;
    if (failures || refusals) { failures = 0; refusals = 0; report('sb-saved', ''); }
    return true;
  };
  const onFailed = (e) => {
    failures += 1;
    retryLater();
    report('sb-save-failed', (e && e.message) || String(e || ''));
    return false;
  };
  const onRefused = (reason) => {
    refusals += 1;
    report('sb-save-refused', String(reason));
    return false;
  };
  // Web only: the data started over in another tab, and this page's copy may be the only one with its rounds. It
  // counts as a refusal (nothing of this page's is stored), and the page asks whether to keep it (keepHere).
  const onReset = (reason) => {
    refusals += 1;
    report('sb-reset-elsewhere', String(reason));
    return false;
  };
  function flush() {
    clearTimeout(timer); timer = null;
    clearTimeout(retryTimer); retryTimer = null;
    if (native.loadError) return Promise.resolve(false);
    const upTo = edits;
    let json;
    try { json = storeJSON(); } catch (e) { return Promise.resolve(onFailed(e)); }
    return call({ op: 'save', json, deletedRounds: [...deletedRounds] }).then((reply) => {
      if (reply && reply.refused) return reply.reset ? onReset(reply.refused) : onRefused(reply.refused);
      noteStored(reply);
      return onSaved(upTo);
    }, onFailed);
  }
  const tellListeners = () => queueMicrotask(() => listeners.forEach((f) => f()));
  const changed = () => {
    edits += 1;
    clearTimeout(timer);
    if (document.visibilityState === 'hidden') flush(); else timer = setTimeout(flush, BATCH_MS);
    tellListeners();
  };

  // ---------- the web version: another tab saved ----------
  // browser.js sends what's stored now and what this page last loaded, saved or took in (`base`), only when the
  // stored data grew from `base`. The page takes it in, deletions included, with its own changes since `base` put
  // back on top a field at a time, then saves those right away. That save working clears any banner a refusal left,
  // and so does a take-in that leaves nothing to save: the page then matches what's stored, which holds everything
  // it had (a question left by a reset elsewhere is answered). When the data started over elsewhere instead,
  // browser.js sends { reset } and nothing is taken in.
  const isPlainObject = (v) => !!v && typeof v === 'object' && !Array.isArray(v);
  const dataObject = (text) => {
    try { const v = JSON.parse(text); return isPlainObject(v) ? v : null; } catch (e) { return null; }
  };
  // JSON with every object's keys in order, so the same data compares equal however its objects were built.
  const canonical = (v) => JSON.stringify(v, (k, x) => (isPlainObject(x) ? Object.fromEntries(Object.keys(x).sort().map((key) => [key, x[key]])) : x));
  const isSame = (a, b) => canonical(a) === canonical(b);
  // One value after another tab's save: the stored one (`theirs`), unless this page changed it since `was`. When
  // both changed an object, its fields are settled the same way; when both changed anything else, this page's
  // change wins, as the newer edit on this screen and the one about to be saved. Undefined means deleted, so an
  // edit here to something deleted there keeps it. With `was` empty, every value here counts as a change: that keeps
  // everything this page has and adds what only the stored data has (Keep over data that started over).
  function mergedValue(mine, was, theirs) {
    if (isSame(mine, was)) return theirs;
    if (isSame(theirs, was)) return mine;
    if (isPlainObject(mine) && isPlainObject(theirs)) return rebased(mine, isPlainObject(was) ? was : {}, theirs);
    return mine;
  }
  // The stored data with this page's changes since `was` on top. New objects throughout; nothing passed in changes.
  function rebased(mine, was, theirs) {
    const keys = [...new Set(Object.keys(theirs).concat(Object.keys(mine), Object.keys(was)))];
    return Object.fromEntries(keys.map((k) => [k, mergedValue(mine[k], was[k], theirs[k])]).filter(([, v]) => v !== undefined));
  }
  function takeInStored(detail) {
    if (!detail || native.loadError) return;
    if (detail.reset) { onReset(detail.reason); return; }
    const stored = dataObject(detail.json);
    if (!stored) return; // browser.js never sends data that won't read; this guards the page anyway
    store = rebased(store, dataObject(detail.base) || {}, stored);
    tellListeners();
    if (isUnsaved()) flush(); else onSaved(savedEdits);
  }
  // Keep, after a reset elsewhere: what's stored now goes under this page's copy, merged against the base browser.js
  // sends (this page's own when the stored data holds it, else nothing: then this page wins where both have a value,
  // and nothing either has is dropped), and the two are saved together right away.
  function keepHere() {
    return call({ op: 'keep-here' }).then((reply) => {
      const base = dataObject(reply && reply.base) || {};
      store = rebased(store, base, dataObject(reply && reply.json) || {});
      edits += 1; // unsaved until this save works, even with nothing new on this page
      tellListeners();
      return flush();
    });
  }
  if (native.web) {
    window.addEventListener('sb-stored-elsewhere', (e) => takeInStored(e && e.detail));
    native.keepHere = keepHere;
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && isUnsaved()) flush(); });
  window.addEventListener('pagehide', () => { if (isUnsaved()) flush(); });

  const snap = (p) => ({ id: p.split('/').pop(), exists: p in store, data: () => cp(store[p]), metadata: { fromCache: false, hasPendingWrites: false } });
  const watch = (f) => { listeners.add(f); setTimeout(f, 0); return () => listeners.delete(f); };
  const docRef = (p) => ({
    id: p.split('/').pop(),
    path: p,
    get: async () => snap(p),
    set: async (d) => { store[p] = cp(d); deletedRounds.delete(p); changed(); },
    update: async (d) => { if (!(p in store)) throw { code: 'invalid_argument', message: 'No such document' }; merge(store[p], cp(d)); changed(); },
    delete: async () => { if (p.startsWith(ROUND_PREFIX) && p in store) deletedRounds.add(p); delete store[p]; changed(); },
    onSnapshot: (next) => watch(() => next(snap(p))),
  });
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const db = {
    doc: docRef,
    collection: (c) => ({
      path: c,
      doc: (id) => docRef(c + '/' + (id || newId())),
      onSnapshot: (next) => watch(() => {
        const depth = c.split('/').length + 1;
        const docs = Object.keys(store).filter((k) => k.startsWith(c + '/') && k.split('/').length === depth).map(snap);
        next({ docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: {} });
      }),
    }),
  };
  native.weather = (q) => call(Object.assign({ op: 'weather' }, q));
  native.flushNow = () => (isUnsaved() ? flush() : Promise.resolve(true));
  // Exports what's on screen (the store in memory), so a copy is complete even while saving is failing.
  native.exportData = () => call({ op: 'export', json: storeJSON() });
  // Web only: when the data won't read and there's no backup, the person can keep the damaged copy, or start over
  // empty on purpose. (On the iPhone the damaged file is in the Files app.)
  if (native.web) {
    native.exportDamaged = () => call({ op: 'export-damaged' });
    native.startFresh = () => call({ op: 'start-fresh' });
  }
  native.shareText = (text) => call({ op: 'share', text });
  native.haptic = (kind) => { call({ op: 'haptic', kind }).catch(() => {}); };
  // A cache outside the rounds file for things that can be fetched again (elevation grids): text by name,
  // null when there's none. Not backed up or exported, and the phone may clear it.
  native.cacheGet = (key) => call({ op: 'cache-get', key }).then((text) => (typeof text === 'string' ? text : null));
  native.cachePut = (key, text) => call({ op: 'cache-put', key, text });
  // GPS for the caddie: each new position, { precise: true|false }, { error: 'denied' }, or { back: true } (the app
  // is back on screen, so a position from before soon stops counting) goes to cb until the returned stop().
  native.watchLocation = (cb) => {
    window.__sbLoc = cb;
    call({ op: 'loc-start' }).catch(() => {});
    return () => {
      if (window.__sbLoc === cb) window.__sbLoc = null;
      call({ op: 'loc-stop' }).catch(() => {});
    };
  };
  // After a refusal the page stops listening, so the app says separately when location is allowed again
  // (turned on in Settings): cb runs and the caddie can start GPS once more.
  native.onLocationAllowed = (cb) => { window.__sbLocAllowed = cb; };
  window.claude = {
    use: async (name) => {
      if (name === 'db') { await ready; if (native.loadError) throw { code: 'damaged', message: native.loadError }; return db; }
      if (name === 'user') return { can: async () => true, canEdit: () => true, isOwner: () => true };
      return null;
    },
  };
})();

/* Above the hole map and the map editor (#cad-ov), which show toasts while they're open. */
#toast { position: fixed; left: 50%; transform: translateX(-50%); width: max-content; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--bar); color: var(--on-bar); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 500; max-width: calc(100% - 32px); z-index: 45; }
/* Save problem: stays at the top while scrolling until a save works. In two columns, the sticky columns sit
   below it: app.js sets --save-banner-h to its height while it shows. */
#save-banner { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 12; margin-bottom: 16px; padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--danger); background: var(--danger-tint); color: var(--ink); font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; }
#save-banner strong { font-weight: 600; }
#save-banner[hidden] { display: none; }
#save-banner .btn { display: flex; width: max-content; margin-top: 8px; }
#save-banner .btn[hidden] { display: none; }
/* Over the full-screen hole map the banner stays in sight: pinned under the status bar, with the map below it.
   app.js sets body.save-problem while the banner shows. */
body.cad-open.save-problem #save-banner { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 41; margin: 0; border-radius: 0; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
body.cad-open.save-problem #cad-ov { top: calc(env(safe-area-inset-top, 0px) + var(--save-banner-h, 0px)); }
body.cad-open.save-problem #cad-ov .hm { padding-top: 0; }

@media (min-width: 640px) { .wrap { padding-block: 24px 64px; } .brand { font-size: 28px; } }

.cad-none { flex-direction: row; align-items: center; justify-content: space-between; font-size: 14px; }

/* "From the ... tees" as a button (more than one tee set in the round): the label's look in the link color, with a
   taller tap area that doesn't move anything. */

/* The hole map: a full-screen layer over the page, with the aerial photo turned so the tee is at the bottom. */

#cad-ov[hidden] { display: none; }
body.cad-open { overflow: hidden; }
.hm { position: absolute; inset: 0; display: flex; flex-direction: column; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px); background: var(--bar); }

.hm-bar .btn.ghost { color: var(--on-bar); }
.hm-view { position: relative; flex: 1; min-height: 200px; overflow: hidden; background: #34503a; touch-action: manipulation; cursor: crosshair; }
#hm-img { position: absolute; left: 0; top: 0; max-width: none; transform-origin: 0 0; pointer-events: none; user-select: none; -webkit-user-drag: none; }

.hm-view[data-photo="loading"]::before, .hm-view[data-photo="failed"]::before { position: absolute; left: 0; right: 0; top: 12px; text-align: center; font-size: 13px; color: rgba(255, 255, 255, .85); }
.hm-view[data-photo="loading"]::before { content: "Loading the aerial photo…"; }
.hm-view[data-photo="failed"]::before { content: "No aerial photo right now (no signal?). Yardages still work."; }
.hm-credit { position: absolute; right: 6px; bottom: 4px; font-size: 10px; color: rgba(255, 255, 255, .9); text-shadow: 0 1px 2px rgba(0, 0, 0, .7); pointer-events: none; }
/* A fixed height, so the map above never changes size as the details below change. */
.hm-foot { flex: none; height: clamp(220px, 38%, 340px); padding: 10px 14px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; background: var(--card); border-top: 1px solid var(--rule); overflow-y: auto; font-size: 15px; }
.hm-acts { justify-content: flex-start; }
.hm-tap { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.hm-confirm { display: flex; flex-direction: column; gap: 6px; }
.hm-undo { justify-content: flex-start; gap: 4px; }
.hm-line { fill: none; stroke: #fff; stroke-width: 2; stroke-dasharray: 6 6; opacity: .9; }
.hm-line.cur { stroke: #ffd54a; stroke-dasharray: none; stroke-width: 3; opacity: 1; }
.hm-green { fill: rgba(90, 210, 130, .3); stroke: #c8f7d4; stroke-width: 2; }
.hm-sand { fill: rgba(245, 226, 180, .45); stroke: rgba(255, 255, 255, .75); stroke-width: 1; }
.hm-water { fill: rgba(70, 140, 230, .4); stroke: rgba(170, 210, 255, .85); stroke-width: 1; }
.hm-tee { fill: #fff; stroke: #0f1d33; stroke-width: 2; }
.hm-pin { fill: #e53935; stroke: #fff; stroke-width: 2; }
.hm-me { fill: #1e88e5; stroke: #fff; stroke-width: 3; }
.hm-acc { fill: rgba(30, 136, 229, .18); stroke: rgba(30, 136, 229, .55); }
.hm-shot { fill: none; stroke: #ffd54a; stroke-width: 2.5; }
.hm-mark { fill: #ffd54a; stroke: #0f1d33; stroke-width: 2; }
/* Settings: my bag, two clubs to a row. */
.bag { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 14px; }
.bag-row { display: grid; grid-template-columns: minmax(0, 1fr) 64px; align-items: center; gap: 6px; font-size: 14px; }
.bag-row input { min-height: 40px; min-width: 0; }
.bag-row input[type="number"] { text-align: right; }
/* Settings: About 1up. Links open outside the app; the privacy link gets a full-size tap target. */
.about a { color: var(--link); text-decoration: underline; text-underline-offset: 2px; overflow-wrap: anywhere; }
.about a.about-policy { display: inline-flex; align-items: center; min-height: 44px; font-weight: 600; }
.about-credits { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
/* Long-pressing an image (the logo) offers no save, copy or share menu, and images don't drag. */
img { -webkit-touch-callout: none; -webkit-user-drag: none; -webkit-user-select: none; user-select: none; }
/* Wide screens (an unfolded iPhone Duo, an iPad, a laptop) get two columns. 760px matches WIDE_QUERY in app.js.
   Until the page redraws after a fold, columns just stack. */
.cols, .cols > .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@media (min-width: 760px) {
  .wrap, .appbar-in, .holebar-in { max-width: 1120px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  .cols.hole { grid-template-columns: minmax(0, 11fr) minmax(0, 10fr); }
  /* The whole hole fits above the hole bar on an unfolded Duo: tighter rows, tap targets still 44pt or more. */
  .wrap { padding-top: 12px; }
  .cols.hole .entry { padding-top: 8px; }
  .cols.hole .holeno { font-size: 32px; }
  .cols.hole .entry-head { padding-bottom: 4px; }
  .cols.hole .prow { padding: 4px 0; }
  .cols.hole .stepper .pm { width: 46px; height: 46px; }
  .cols.hole .stepper .val { height: 46px; }
  .cols.hole .junk { padding: 6px 0 2px; gap: 6px; }
  .cols.hole .outcome { padding-top: 6px; }
  /* The hole card stays put while the games beside it scroll; if it's ever taller than the space, it scrolls on its own. */
  .cols.hole > .col:first-child { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px + var(--save-banner-h, 0px)); max-height: calc(100dvh - 78px - env(safe-area-inset-bottom, 0px) - env(safe-area-inset-top, 0px) - 24px - var(--save-banner-h, 0px)); overflow-y: auto; overscroll-behavior: contain; border-radius: 12px; }
  table.sc.whole { min-width: 640px; }
  .tot-card { max-width: 560px; }
  /* Home: the season stays in view beside a long list of rounds. */
  .cols.home > .col:last-child { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px + var(--save-banner-h, 0px)); }
}
</style>

  const mapWantsGps = () => !!ov && (ov.kind === 'hole' || !ov.centre);
  function sync() {
    elev.moveSaved();
    const r = liveRound();
    const want = canWatch() && gpsOn() && !loc.error && (mapWantsGps() || (r && hasAnyGeo(S.courses[r.courseId])));
    if (want && !loc.stop) startWatch();
    if (!want && loc.stop) stopWatch();

  function startWatch() {

  function onFix(f) {

    const t = Math.min(Number(f.t) || Date.now(), Date.now());
    if (isStaleReading(t)) return;

    // it clearly puts you somewhere else: then yardages go back to the tee until a good one comes.
    loc.weak = !(acc >= 0 && acc <= MAX_ACC_M);

  // Started again (back on screen, or back to the round), iOS first hands back the position it had before, with
  // that old time: one from before GPS started or the page came back, or older than the one kept, says nothing new.
  const isStaleReading = (t) => t < Math.max(loc.backAt, loc.startedAt) || (!!loc.fix && t < loc.fix.t);
  function isClearlyElsewhere(p, acc) {
    if (!loc.fix || !(acc >= 0)) return false;

  // The iPhone app says whether Precise Location is on ({precise}); the web version goes by the readings: a run

  function noteWebAccuracy(acc) {

  // A new position redraws only the yardage strip (when it changed) and the map's marks, never the whole page.
  function refreshLive() {

    const r = liveRound();

      const html = buildStrip(r, S.hole);
      if (html !== shownStrip) { el.outerHTML = html; shownStrip = html; }

  function startGps() {

  // After location was refused: try again once it may be allowed. If it's still off, the answer comes at once.

  // ---------- elevation (elevation.js) ----------
  // A hole's grid covers its tee, green, outline, line (a dogleg's corner can stick out past the rest) and every
  // full card's tee where it's drawn, so plays-like from any of them has the slope.
  const coverPoints = (course, n, h) => [h.tee, h.green].concat(h.outline || [], h.line || [], fullCards(course && course.tees).map((t) => Geo.teeSpot(h, holeYards(t, n), fullCards(course && course.tees).map((t) => ({ name: t.name, yds: holeYards(t, n) })))));
  const elev = makeElevation({ S, holeGeo, coverPoints, onGrid: () => refreshLive() });

  // ---------- advice ----------
  // Plays-like and a club for a shot of `yards` from `from` to `to` (from the tee, the card's yardage).
  function advice(r, courseId, course, n, h, from, to, yards) {
    const cfg = caddieCfg();
    const longest = Math.max(0, ...cfg.bag.map((b) => Number(b.carry) || 0));
    const reach = longest ? longest + REACH_EXTRA_YD : REACH_NO_BAG_YD;
    if (cfg.tournament || yards > reach) return { yards, pl: null, club: null };
    const w = r.weather || {};
    const g = elev.gridFor(courseId, course, n, h, playTee(r, h, n).at);
    const e0 = g ? Geo.elevAt(g, from) : null;
    const e1 = g ? Geo.elevAt(g, to) : null;
    const hasSlope = e0 != null && e1 != null;
    const pl = Geo.playsLike({ yards, riseM: hasSlope ? e1 - e0 : NaN, windMph: numOr(w.windMph), windFrom: Geo.windFromDeg(w.windDir), shotBearing: Geo.bearing(from, to), tempF: numOr(w.temp) });
    // No grid yet (or none to be had), or a spot off it: plays-like says the slope is left out.
    return { yards, pl, club: pl ? Geo.pickClub(cfg.bag, pl.yards) : null, noSlope: !hasSlope };
  }
  function partsText(pl) {
    const out = [];
    if (pl.parts.elev) out.push(signed(pl.parts.elev) + (pl.parts.elev > 0 ? ' uphill' : ' downhill'));
    if (pl.parts.wind) out.push(signed(pl.parts.wind) + (pl.parts.wind > 0 ? ' into the wind' : ' downwind'));
    if (pl.parts.temp) out.push(signed(pl.parts.temp) + (pl.parts.temp > 0 ? ' cool air' : ' warm air'));
    if (Math.abs(pl.cross) >= 5) out.push('wind ' + Math.abs(pl.cross) + ' mph from the ' + (pl.cross > 0 ? 'right' : 'left'));
    return out.join(', ');
  }
  function clubText(c) {
    if (!c) return '';

    return c.club.name + (c.alt ? ' or a hard ' + c.alt.name : '');
  }
  function adviceHTML(adv, cls) {
    if (!adv.pl) return '';
    const plays = adv.pl.yards !== Math.round(adv.yards) ? 'Plays ' + adv.pl.yards : 'Plays as it measures';
    const club = clubText(adv.club);
    const why = partsText(adv.pl);
    const notes = [why, adv.noSlope ? NO_SLOPE : ''].filter(Boolean).join(', ') + (why ? ' (estimate)' : '');
    return '<div class="' + cls + '"><b>' + esc(plays) + (club ? ' · ' + esc(club) : '') + '</b>' + (notes ? '<span>' + esc(notes) + '</span>' : '') + '</div>';
  }

  // ---------- hole card strip ----------
  const muted = (text) => '<span class="muted">' + esc(text) + '</span>';
  // Front, Middle and Back, on the strip and the hole map alike.
  const fmbCells = (d) => '<div class="cad-fmb">' + [['Front', d.front], ['Middle', d.middle], ['Back', d.back]].map((c) => '<div><span>' + c[0] + '</span><b>' + yd(c[1]) + '</b></div>').join('') + '</div>';
  // Where yardages are from, on the strip and the hole map. From the tee, with more than one tee set in the round,
  // the label is a button that shows the next one.
  function srcHTML(r, b, from, d) {
    const est = d.est ? ' · green size estimated' : '';
    if (b.gps) return '<div class="cad-src">From you' + est + '</div>';
    const label = teeChoices(r).length > 1 ? '<button class="linkish cad-tees" data-action="cad-tees" aria-label="' + esc(from.label + '. Show the next tees in this round.') + '">' + esc(from.label) + '</button>' : esc(from.label);
    return '<div class="cad-src">' + label + est + '</div>';
  }
  const USE_GPS_BTN = '<button class="linkish cad-retry" data-action="cad-gps">Use GPS</button>';
  const minutesAgo = (ms) => Math.max(1, Math.floor(ms / 60000)) + ' min ago';
  // Said the same way on the strip and the hole map.
  const PRECISE_PATH = 'Settings › 1up › Location › Precise Location.';
  const PRECISE_WEB_PATH = 'Settings › Privacy & Security › Location Services › Safari Websites › Precise Location.';
  const WEAK_TEE_NOTE = 'Weak GPS: yardages are from the tee for now.';
  const preciseHow = () => 'Turn on Precise Location: ' + (window.SB_NATIVE.web ? PRECISE_WEB_PATH : PRECISE_PATH);
  const preciseNote = () => 'Yardages need Precise Location: ' + (window.SB_NATIVE.web ? PRECISE_WEB_PATH : PRECISE_PATH);
  const lastGood = () => { const age = fixAgeMs(); return 'your last good position' + (age > OLD_FIX_MS ? ', from ' + minutesAgo(age) : ''); };
  // Approximate location: how to turn on Precise Location, after which position yardages are from (if any).
  const approxNote = (b) => (b.gps ? 'Using ' + lastGood() + '. ' : '') + preciseNote();
  function gpsProblemNote(b) {
    if (loc.error === 'denied') return muted('Location is off for 1up. ' + (window.SB_NATIVE.web ? 'Allow it for this site in your browser settings.' : 'Turn it on in Settings › 1up › Location.')) + USE_GPS_BTN;
    if (loc.error) return muted('GPS isn’t available right now.') + USE_GPS_BTN;
    if (isApprox()) return muted(approxNote(b));
    return '';
  }
  function gpsNote(b) {
    if (!canWatch()) return '';
    if (!gpsOn()) return '<button class="linkish" data-action="cad-gps">Use GPS for yardages</button>';
    const problem = gpsProblemNote(b);
    if (problem) return problem;
    if (!b.gps) {
      if (fresh()) return muted('You’re away from this hole: yardages are from the tee.');
      return muted(loc.weak ? WEAK_TEE_NOTE : 'Finding you…');
    }
    const age = fixAgeMs();
    if (loc.weak) return muted('Weak GPS: using ' + lastGood() + '.');
    if (age > OLD_FIX_MS) return muted('GPS last updated ' + minutesAgo(age) + '.');
    return loc.fix.acc > NOTE_ACC_M ? muted('GPS within about ' + Math.round(loc.fix.acc * Geo.YARDS_PER_M) + ' yards') : '';
  }
  function buildStrip(r, n) {
    const courseId = r.courseId;
    const course = S.courses[courseId];
    const h = holeGeo(course, n);
    if (!h) {
      if (S.readOnly || !course) return '<div id="cad-strip"></div>';
      return '<div id="cad-strip" class="cad cad-none"><span class="muted">No map of this hole yet.</span><button class="linkish" data-action="cad-edit" data-h="' + n + '">Map it</button></div>';
    }
    const from = playTee(r, h, n);
    const b = ballFor(h, from);
    const d = depthsFor(h, b, from);
    const adv = advice(r, courseId, course, n, h, b.at, h.green, d.middle);
    return '<div id="cad-strip" class="cad"><div class="cad-top">' + srcHTML(r, b, from, d) +
      '<button class="btn ghost cad-mapbtn" data-action="cad-map">Hole map</button></div>' +
      fmbCells(d) + adviceHTML(adv, 'cad-adv') + '<div class="cad-note">' + gpsNote(b) + '</div></div>';
  }
  // The page draws the strip through this, so a GPS update can tell whether anything on it changed.
  function stripHTML(r, n) {
    shownStrip = buildStrip(r, n);
    return shownStrip;
  }

  // ---------- map view ----------
  // The aerial photo covering the view, and the CSS that lays it under the drawing.
  function imageFor(v) {
    const corners = [[0, 0], [v.W, 0], [0, v.H], [v.W, v.H]].map((c) => Geo.merc(v.fromScreen(c[0], c[1])));
    const xs = corners.map((m) => m[0]);
    const ys = corners.map((m) => m[1]);
    const [x0, y0, x1, y1] = Geo.snapBox([Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)], Geo.REQUEST_GRID_M);
    // Its size in pixels comes from the gridded box and the screen, never a mark.
    const [pw, ph] = Geo.photoSize(x1 - x0, y1 - y0, v.W, v.H, window.devicePixelRatio);
    const q = new URLSearchParams({ bbox: [x0, y0, x1, y1].join(','), bboxSR: '3857', imageSR: '3857', size: pw + ',' + ph, format: 'jpg', f: 'image' });
    const tl = v.toScreenM([x0, y1]);
    return { src: IMAGERY + '?' + q.toString(), style: 'width:' + (x1 - x0) * v.s + 'px;height:' + (y1 - y0) * v.s + 'px;transform:translate(' + tl[0] + 'px,' + tl[1] + 'px) rotate(' + -v.theta + 'deg)' };
  }
  const pathOf = (v, pts, close) => pts.map((p, i) => (i ? 'L' : 'M') + v.toScreen(p).map((z) => z.toFixed(1)).join(' ')).join('') + (close ? 'Z' : '');

  // ---------- overlay ----------
  function root() {
    let el = document.getElementById('cad-ov');
    if (!el) {
      el = document.createElement('div');
      el.id = 'cad-ov';
      el.setAttribute('role', 'dialog');
      el.setAttribute('aria-modal', 'true');
      document.body.appendChild(el);
      el.addEventListener('click', onMapTap);
    }
    return el;
  }
  function close() {
    ov = null;
    const el = root();
    el.innerHTML = '';
    el.hidden = true;
    document.body.classList.remove('cad-open');
    sync();
    render();
  }
  function openHole() {
    const r = ctx.roundData(S.roundId);
    if (!r) return;
    ov = { kind: 'hole', session: ++mapsOpened, roundId: r.id, hole: S.hole, tap: null, confirm: null, undo: null };
    drawOverlay();
    sync();
  }
  function openEditor(courseId, n) {
    const course = S.courses[courseId];
    if (!course) return;
    const hole = Math.max(1, Math.min(18, Number(n) || 1));
    ov = Object.assign({ kind: 'edit', session: ++mapsOpened, courseId, hole, step: 'tee', zoom: null, tee: null, undo: null }, editorCentre(course, hole, null));
    drawOverlay();
    sync();
  }
  // The editor on another hole: a fresh step and zoom, and its own centre (worked out once, so GPS never moves it).
  const editorAt = (n) => Object.assign({}, ov, { hole: n, step: 'tee', zoom: null, tee: null }, editorCentre(S.courses[ov.courseId], n, ov));
  function showMap(next) {
    ov = next;
    placeImage();
    drawMarks();
    sync();
  }
  // Where the editor's overview of hole n centres: the course's own data when there is any, else where the
  // last hole's overview was, else where you are, rounded to about 1 km. centreCoarse: it's that rounded spot.
  function editorCentre(course, n, prev) {
    const known = courseCentre(course, n);
    if (known) return { centre: known, centreCoarse: false };
    if (prev && prev.centre) return { centre: prev.centre, centreCoarse: !!prev.centreCoarse };
    const coarse = coarsePoint(roughSpot());
    return { centre: coarse, centreCoarse: !!coarse };
  }
  // A reading far too rough for yardages (weak GPS, approximate location) can still find the course, rounded to
  // about 1 km, when its whole circle fits in the overview around that rounded spot: then you're on the map
  // wherever in the circle you really are. Until one does, GPS keeps running.
  const fitsOverview = (p, acc) => acc >= 0 && Geo.meters(p, coarsePoint(p)) + acc <= EDIT_COARSE_M;
  const isRoughUsable = () => !!loc.reading && fitsOverview([loc.reading.lat, loc.reading.lon], loc.reading.acc);
  // The good position when there is one, else the newest reading, when it fits.
  function roughSpot() {
    const good = fresh();
    if (good && fitsOverview(good, loc.fix.acc)) return good;
    return loc.stop && !loc.error && isRoughUsable() ? [loc.reading.lat, loc.reading.lon] : null;
  }
  // A course with nothing to centre on waits for your position; once it has one, GPS can stop.
  function centreEditorOnYou() {
    if (ov.centre) return;
    Object.assign(ov, editorCentre(S.courses[ov.courseId], ov.hole, null));
    if (ov.centre) { placeImage(); sync(); }
    drawMarks();
  }
  function drawOverlay() {
    const el = root();
    if (!ov) return;
    el.hidden = false;
    document.body.classList.add('cad-open');
    ov.footHTML = '';
    const title = ov.kind === 'hole' ? 'Hole ' + ov.hole : 'Map ' + esc((S.courses[ov.courseId] || {}).name || 'course');
    el.innerHTML = '<div class="hm"><div class="hm-bar"><b>' + title + '</b><span id="hm-sub" class="muted"></span><button class="btn ghost" data-action="cad-close">Done</button></div>' +
      '<div class="hm-view" id="hm-view"><img id="hm-img" alt="" decoding="async"><svg id="hm-svg" aria-hidden="true"></svg><div id="hm-labels"></div><div class="hm-credit" id="hm-credit"></div></div>' +
      '<div class="hm-foot" id="hm-foot"></div></div>';
    requestAnimationFrame(() => { placeImage(); drawMarks(); });
  }
  // The view for what's on screen now: the hole (tee at the bottom) or the editor's overview or close-up.
  function currentView() {
    const box = document.getElementById('hm-view');
    if (!box || !ov) return null;
    const W = box.clientWidth;
    const H = box.clientHeight;
    if (ov.kind === 'hole') {
      const r = ctx.roundData(ov.roundId);
      const h = r && holeGeo(S.courses[r.courseId], ov.hole);
      if (!h) return null;
      const from = playTee(r, h, ov.hole);
      const pts = [h.tee, from.at, h.green].concat(h.outline || []);
      return { v: Geo.makeView(pts, Geo.bearing(h.tee, h.green), W, H, 34, 6), h, r, from, osm: h.osm };
    }
    // The green step looks around the tee just tapped; the overview around the hole's centre.
    const course = S.courses[ov.courseId];
    const onTee = ov.step === 'green' && Geo.isPoint(ov.tee);
    const centre = ov.zoom || (onTee ? ov.tee : ov.centre);
    if (!centre) return null;
    const rad = ov.zoom ? EDIT_ZOOM_M : !onTee && ov.centreCoarse ? EDIT_COARSE_M : EDIT_OVERVIEW_M;
    const pts = [Geo.fromXY(centre, [-rad, -rad]), Geo.fromXY(centre, [rad, rad])];
    return { v: Geo.makeView(pts, 0, W, H, 8, 40), course, osm: holesOf(course).some((h) => h && h.osm) };
  }
  function courseCentre(course, n) {
    const prev = holeGeo(course, n - 1);
    if (prev) return prev.green;
    const mine = holeGeo(course, n);
    if (mine) return mine.tee;
    return Geo.isPoint([course.lat, course.lon]) ? [course.lat, course.lon] : null;
  }
  const coarsePoint = (p) => { const steps = Math.round(1 / COARSE_DEG); return p ? p.map((z) => Math.round(z * steps) / steps) : null; };
  const viewKey = () => {
    const box = document.getElementById('hm-view');
    return box && ov ? [box.clientWidth, box.clientHeight, ov.kind, ov.hole, ov.step, ov.zoom ? ov.zoom.join() : '', ov.centre ? ov.centre.join() : ''].join('|') : '';
  };
  function placeImage() {
    const cv = currentView();
    const img = document.getElementById('hm-img');
    if (!cv || !img) return;
    ov.placed = viewKey();
    const im = imageFor(cv.v);
    const box = document.getElementById('hm-view');
    // USGS draws each photo on request, which can take several seconds; the drawing shows meanwhile.
    if (box) box.dataset.photo = 'loading';
    img.style.cssText = im.style + ';visibility:hidden';
    img.onload = () => { if (img.src === im.src) { img.style.visibility = ''; if (box) box.dataset.photo = 'ok'; } };
    img.onerror = () => { if (img.src === im.src && box) box.dataset.photo = 'failed'; };
    img.src = im.src;
    const credit = document.getElementById('hm-credit');
    if (credit) credit.textContent = 'Aerial photo: USGS' + (cv.osm ? ' · Holes: © OpenStreetMap contributors' : '');
  }
  // The footer only changes when its content does, so a button isn't swapped out under your thumb.
  function setFoot(foot, html) {
    if (ov.footHTML === html) return;
    foot.innerHTML = html;
    ov.footHTML = html;
  }
  function drawMarks() {
    const cv = currentView();
    const svg = document.getElementById('hm-svg');
    const labels = document.getElementById('hm-labels');
    const foot = document.getElementById('hm-foot');
    if (!svg || !labels || !foot) return;
    if (cv && ov.placed !== viewKey()) placeImage();
    if (!cv) {
      setFoot(foot, '<div class="notice">There’s nothing to show here yet. ' + (ov && ov.kind === 'edit' ? noCentreHelp() : '') + '</div>');
      return;
    }
    svg.setAttribute('viewBox', '0 0 ' + cv.v.W + ' ' + cv.v.H);
    const out = ov.kind === 'hole' ? holeMarks(cv) : editMarks(cv);
    svg.innerHTML = out.svg;
    labels.innerHTML = out.labels;
    setFoot(foot, out.foot);
    const sub = document.getElementById('hm-sub');
    if (sub) sub.textContent = out.sub || '';
  }
  function noCentreHelp() {
    const help = 'This course has no location on file: open the map while you’re at the course.';
    return esc(help + tooRoughToCentre()) + (canWatch() && !gpsOn() ? ' <button class="linkish" data-action="cad-gps">Use GPS</button>' : '');
  }
  // GPS is running but its readings can't place you even to a kilometre: say why, and what helps.
  function tooRoughToCentre() {
    if (!loc.stop || loc.error || !loc.reading || isRoughUsable()) return '';
