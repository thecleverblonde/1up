    const ro = S.readOnly;
    let out = '<div class="row"><button class="btn ghost" data-action="home">‹ Rounds</button></div><div class="title">Settings</div>';
    if (ro) out += '<div class="notice">You can see these settings but not change them.</div>';
    if (S.formError) out += '<div class="err" role="alert">' + esc(S.formError) + '</div>';
    const tp = themePref();
    out += '<section class="card form"><div class="label">Appearance</div><div class="seg" role="group">' + [['auto', 'Automatic'], ['light', 'Light'], ['dark', 'Dark']].map((o) => '<button type="button" data-action="theme" data-value="' + o[0] + '" aria-pressed="' + (tp === o[0]) + '">' + o[1] + '</button>').join('') + '</div><div class="muted">Automatic follows your phone' + (S.native ? '' : ' or Claude’s setting') + '. Saved on this device.</div></section>';
    out += '<section class="card form"><div class="label">Players</div><div class="muted">Handicap indexes here fill in new rounds, which turn them into course handicaps for the tees played. Usual players are picked for you.</div>';
    d.roster.forEach((p, i) => {
      out += '<div class="stack" style="gap:6px"><div class="roster-row"><input type="text" id="r-name-' + i + '" data-bind="settings.roster.' + i + '.name" maxlength="24" value="' + esc(p.name) + '" aria-label="Player name" placeholder="Name"><input type="text" inputmode="decimal" id="r-hcp-' + i + '" data-bind="settings.roster.' + i + '.index" value="' + esc(p.index) + '" aria-label="Handicap index" placeholder="Index"><span class="c' + p.color + '" aria-hidden="true" style="font-size:22px;line-height:1">●</span></div>' +
        '<div class="roster-meta"><span style="display:flex;gap:14px;flex-wrap:wrap"><label class="check"><input type="checkbox" id="r-usual-' + i + '" data-bind="settings.roster.' + i + '.usual"' + (p.usual ? ' checked' : '') + '>Usually plays</label><label class="check"><input type="checkbox" id="r-plus-' + i + '" data-bind="settings.roster.' + i + '.plus"' + (p.plus ? ' checked' : '') + '>Plus index</label></span>' + (ro ? '' : '<button class="btn ghost danger" data-action="roster-remove" data-i="' + i + '">Remove</button>') + '</div></div>';
    });
    if (!ro) out += '<div><button class="btn" data-action="roster-add">+ Add player</button></div>';
    out += '<div class="field"><span>Shots for skins and matches</span>' + seg('settings.allowance', [['low', 'Off the low man'], ['full', 'Full handicaps']], d.allowance) + '<div class="muted">Off the low man gives everyone the gap to the lowest handicap in the group, on the hardest holes. It’s the usual way to play matches and skins.</div></div>';
    out += '</section>';
    out += '<section class="card form"><div class="label">Default games</div><div class="muted">New rounds start with these. Each round can change them.</div>' + gamesEditor('settings.games', d.games, 'all', null, null) + '</section>';
    if (S.native && window.SB_NATIVE.exportData) out += '<section class="card form"><div class="label">Your data</div><div class="muted">' + (window.SB_NATIVE.web ? 'Rounds, courses and players are saved in this browser on this phone, not online. Export a copy now and then to keep a backup.' : 'Rounds, courses and players are saved on this phone. A copy from the start of each day is kept for 14 days in Files › On My iPhone › 1up › Backups.') + '</div>' + (installExpiry() ? '<div class="muted">This install works until ' + esc(fmtMoment(installExpiry())) + '. Reinstall from the Mac before then.</div>' : '') + '<div><button class="btn" data-action="export-data">Export a copy</button></div></section>';
    if (!ro) out += '<button class="btn primary wide" data-action="save-settings">Save settings</button>';
    return out;
  }
  async function saveSettings() {
    const d = S.settings;
    if (!d || S.readOnly) return;
    const roster = d.roster.map((p) => { const x = parseIndex(p.index); return { id: p.id, name: String(p.name || '').trim().slice(0, 24), index: p.plus ? -Math.abs(x) : x, color: p.color, usual: !!p.usual }; });
    if (roster.length < 2) return formErr('Keep at least two players.');
    if (roster.some((p) => !p.name)) return formErr('Every player needs a name.');
    if (new Set(roster.map((p) => p.name.toLowerCase())).size !== roster.length) return formErr('Two players have the same name. Make each one different.');
    if (roster.some((p) => !indexOK(p.index))) return formErr(INDEX_ERR);
    let lineup = roster.filter((p) => p.usual).map((p) => p.id).slice(0, 4);
    if (lineup.length < 2) lineup = roster.slice(0, 2).map((p) => p.id);
    const now = new Date().toISOString();
    const doc = Object.assign({}, S.config ? clone(S.config) : {}, {
      roster: roster.map((p) => ({ id: p.id, name: p.name, hcp: Math.round(p.index), index: p.index, color: p.color })),
      lineup, allowance: d.allowance, games: normGames(d.games, null), updatedAt: now,
    });
    delete doc.players;
    delete doc.homeCourse;
    const prev = S.config;
    S.config = doc;
    try { await S.db.doc('config/app').set(doc); } catch (e) { S.config = prev; onWriteFail(e, null); return; }
    toast('Settings saved');
    S.settings = null;
    S.view = 'home';
    render();
    scrollTop();
  }

  // ---------- theme ----------
  const hostTheme = document.documentElement.getAttribute('data-theme');
  function themePref() { try { return localStorage.getItem('sb-theme') || 'auto'; } catch (e) { return 'auto'; } }
  function applyTheme(t) {
    const root = document.documentElement;
    if (t === 'light' || t === 'dark') root.setAttribute('data-theme', t);
    else if (hostTheme) root.setAttribute('data-theme', hostTheme);
    else root.removeAttribute('data-theme');
  }
  function setTheme(t) { try { localStorage.setItem('sb-theme', t); } catch (e) { /* storage unavailable */ } applyTheme(t); }
  function isDark() {
    const t = document.documentElement.getAttribute('data-theme');
    if (t === 'dark' || t === 'light') return t === 'dark';
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function themeBtn() {
    const moon = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
    const sun = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    const dark = isDark();
    return '<button class="iconbtn" data-action="theme-toggle" aria-label="' + (dark ? 'Switch to light mode' : 'Switch to dark mode') + '">' + (dark ? sun : moon) + '</button>';
  }
  applyTheme(themePref());

  // ---------- ui state ----------
  function saveUI() {
    try { localStorage.setItem('hvj-ui', JSON.stringify({ view: S.view === 'round' ? 'round' : 'home', roundId: S.roundId, hole: S.hole })); } catch (e) { /* storage unavailable */ }
  }
  function restoreUI() {
    if (S.restored) return;
    S.restored = true;
    try {
      const u = JSON.parse(localStorage.getItem('hvj-ui') || 'null');
      if (u && u.view === 'round' && u.roundId && S.rounds[u.roundId]) {
        const r = roundData(u.roundId);
        const a = r && validCourse(r.course) ? Golf.analyze(r) : null;
        if (a && !a.complete) { S.view = 'round'; S.roundId = u.roundId; S.editing = u.roundId; S.hole = Number(u.hole) || firstOpenHole(r); }
      }
    } catch (e) { /* storage unavailable */ }
  }

  // ---------- events ----------
  const ACT = {
    home: () => { if (S.photo && S.photo.ctl) S.photo.ctl.abort(); S.view = 'home'; S.confirm = null; S.copyText = ''; S.formError = ''; S.settings = null; S.course = null; S.photo = null; saveUI(); render(); scrollTop(); },
    settings: () => openSettings(),
    new: () => openSetup(null),
    open: (el) => {
      const r = roundData(el.dataset.id);
      if (!r) return;
      S.view = 'round'; S.roundId = r.id; S.confirm = null; S.copyText = ''; S.hole = firstOpenHole(r);
      S.editing = Golf.analyze(r).complete ? null : r.id;
      saveUI(); render(); scrollTop();
    },
    'edit-setup': () => openSetup(S.roundId),
    'cancel-setup': () => { if (S.photo && S.photo.ctl) S.photo.ctl.abort(); const id = S.setup && S.setup.id; const from = S.setup && S.setup.from; S.setup = null; S.course = null; S.photo = null; S.formError = ''; S.view = id ? 'round' : (from === 'course' && S.courses[S.courseView] ? 'course' : from === 'trip' && S.trips[S.tripId] ? 'trip' : 'home'); render(); scrollTop(); },
    seg: (el) => {
      setPath(el.dataset.bind, el.dataset.value);
      if (el.dataset.bind === 'report') { try { localStorage.setItem('sb-report', S.report); } catch (e) { /* storage unavailable */ } }
      render();
    },
    'wi-open': (el) => { const r = roundData(S.roundId); if (!r) return; S.whatIf = whatIfStart(r, el.dataset.v); S.confirm = null; render(); },
    'wi-close': () => { S.whatIf = null; S.confirm = null; render(); },
    'wi-holes': () => { if (S.whatIf) { S.whatIf.holes = !S.whatIf.holes; render(); } },
    'wi-hcp': (el) => { const w = S.whatIf; if (!w) return; const v = (w.hcp[el.dataset.p] || 0) + Number(el.dataset.v); if (v >= -10 && v <= 54) w.hcp[el.dataset.p] = v; render(); },
    'wi-apply-ask': () => { S.confirm = 'whatif'; render(); },
    'wi-apply': () => {
      const r = roundData(S.roundId); const w = S.whatIf;
      if (!r || !w || w.id !== r.id || S.readOnly) return;
      const x = whatIfRound(r, w);
      S.confirm = null; S.whatIf = null;
      editRound(r.id, { allowance: x.allowance, hcp: Object.assign({}, x.hcp), games: { skins: { mode: x.games.skins.mode }, nassau: { press: x.games.nassau.press }, team: { scoring: x.games.team.scoring } } });
      toast('Round updated with the new rules');
    },
    pick: (el) => pickPlayer(el.dataset.id),
    'add-player': () => { S.setup.adding = true; render(); const n = $('#np-name'); if (n) n.focus(); },
    'add-player-cancel': () => { S.setup.adding = false; S.formError = ''; render(); },
    'add-player-save': () => addPlayerSave(),
    team: (el) => {
      const d = S.setup;
      const roster = setupRoster(d);
      const ids = d.players.filter((id) => roster.some((p) => p.id === id));
      if (ids.length === 4) { const t = teamOptions(ids)[Number(el.dataset.i)]; d.games.nassau.teams = t; d.games.team.teams = t; }
      render();
    },
    'save-setup': () => saveSetup(),
    inc: (el) => bump(el.dataset.p, 1),
    dec: (el) => bump(el.dataset.p, -1),
    setpar: (el) => setPar(el.dataset.p),
    goto: (el) => {
      S.hole = Number(el.dataset.h);
      S.copyText = '';
      saveUI();
      render();
      showEntry(false);
    },
    'clear-hole': () => clearHole(),
    greenie: (el) => toggleGreenie(el.dataset.v),
    sandy: (el) => toggleSandy(el.dataset.p),
    'ask-delete': () => { S.confirm = 'round'; render(); },
    'edit-scores': () => {
      const r = roundData(S.roundId);
      if (!r) return;
      S.editing = r.id;
      S.hole = Golf.holeList(r.holes)[0];
      render();
      showEntry(true);
    },
    finish: () => {
      const r = roundData(S.roundId);
      S.editing = null;
      S.confirm = null;
      if (r && !r.finishedAt && !S.readOnly) { editRound(r.id, { finishedAt: new Date().toISOString() }); rainSinceTee(r); }
      else render();
      scrollTop();
      toast('Round final');
    },
    'wx-fill': () => fillSetupWeather(true),
    'wx-round': () => fillRoundWeather(),
    'wx-manual': (el) => { S.setup.wxManual = el.getAttribute('aria-expanded') !== 'true'; render(); },
    'pick-sky': (el) => { S.setup.sky = S.setup.sky === el.dataset.v ? '' : el.dataset.v; render(); },
    'pick-dir': (el) => { S.setup.windDir = S.setup.windDir === el.dataset.v ? '' : el.dataset.v; render(); },
    'pick-precip': (el) => { S.setup.precip = S.setup.precip === el.dataset.v ? '' : el.dataset.v; render(); },
    theme: (el) => { setTheme(el.dataset.value); render(); },
    'theme-toggle': () => { setTheme(isDark() ? 'light' : 'dark'); renderTop(); },
    'cancel-confirm': () => { S.confirm = null; render(); },
    'delete-round': () => deleteRound(),
    copy: () => copyResults(),
    'save-settings': () => saveSettings(),
    'export-data': () => { window.__sbFlushAll(); window.SB_NATIVE.exportData().catch((e) => toast((e && e.message) || 'Couldn’t export a copy.', 6000)); },
    'roster-add': () => { const used = S.settings.roster.map((p) => p.color); S.settings.roster.push({ id: newId(), name: '', index: '0', plus: false, color: freeColor(used), usual: false }); render(); const el = $('#r-name-' + (S.settings.roster.length - 1)); if (el) el.focus(); },
    'roster-remove': (el) => { S.settings.roster.splice(Number(el.dataset.i), 1); render(); },
    courses: () => { if (S.photo && S.photo.ctl) S.photo.ctl.abort(); S.course = null; S.photo = null; S.confirm = null; S.formError = ''; S.view = 'courses'; render(); scrollTop(); },
    'course-open': (el) => { if (S.photo && S.photo.ctl) S.photo.ctl.abort(); S.course = null; S.photo = null; S.confirm = null; S.formError = ''; S.courseView = el.dataset.id; S.view = 'course'; render(); scrollTop(); },
    'start-here': (el) => openSetup(null, el.dataset.id),
    'pick-course': (el) => {
      const d = S.setup;
      d.courseId = el.dataset.id;
      const c = S.courses[d.courseId];
      if (!c || !(c.tees || []).some((t) => t.name === d.tee)) d.tee = lastTeeAt(d.courseId);
      Object.keys(d.tees).forEach((id) => { if (!c || !(c.tees || []).some((t) => t.name === d.tees[id])) d.tees[id] = ''; });
      S.formError = '';
      render();
      fillSetupWeather(false);
    },
    'pick-tee': (el) => { S.setup.tee = el.dataset.v; render(); },
    'courses-all': () => { S.showAllCourses = true; render(); },
    'catalog-add': (el) => addFromCatalog(el.dataset.id, el.dataset.v),
    'trip-new': () => openTripForm(null),
    'trip-edit': () => openTripForm(S.tripId),
    'trip-cancel': () => { const id = S.tripForm && S.tripForm.id; S.tripForm = null; S.formError = ''; S.confirm = null; S.view = id ? 'trip' : 'home'; render(); scrollTop(); },
    'trip-save': () => saveTrip(),
    'trip-ask-delete': () => { S.confirm = 'trip'; render(); },
    'trip-delete': () => deleteTrip(),
    'trip-open': (el) => { S.tripId = el.dataset.id; S.view = 'trip'; S.copyText = ''; S.confirm = null; render(); scrollTop(); },
    'trip-round': () => openSetup(null),
    'trip-paid': (el) => togglePaid(el.dataset.v),
    'trip-share': () => shareTrip(),
    'catalog-update': () => applyCatalogUpdates(),
    'course-new': (el) => openCourse(el.dataset.v || 'courses', null),
    'course-edit': (el) => openCourse(S.view === 'course' ? 'detail' : 'courses', el.dataset.id),
    'course-cancel': () => closeCourse(),
    'course-save': () => saveCourse(),
    'course-ask-delete': () => { S.confirm = 'course'; render(); },
    'course-delete': () => deleteCourse(),
    'photo-stop': () => { if (S.photo && S.photo.ctl) S.photo.ctl.abort(); },
    'photo-retry': () => readCard(true),
  };
  // iOS only shows :active pressed styles when the page listens for touches.
  document.addEventListener('touchstart', () => {}, { passive: true });
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    const fn = ACT[el.dataset.action];
    if (fn) { e.preventDefault(); fn(el); }
  });
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (!el.dataset || !el.dataset.bind || el.type === 'checkbox' || el.type === 'file' || el.tagName === 'SELECT') return;
    setPath(el.dataset.bind, el.value);
    if (el.dataset.live && S.setup) refreshSetupHcps();
    if (el.dataset.find) { const box = document.getElementById('find-' + el.dataset.find); if (box) box.innerHTML = findRowsHTML(el.dataset.find); }
  });
  document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.id === 'f-year') { S.year = el.value; render(); return; }
    if (el.id === 'h2h-a' || el.id === 'h2h-b') {
      const other = el.id === 'h2h-a' ? $('#h2h-b').value : $('#h2h-a').value;
      let a = el.id === 'h2h-a' ? el.value : other;
      let b = el.id === 'h2h-b' ? el.value : other;
      if (a === b) { const prev = S.h2h || {}; if (el.id === 'h2h-a') b = prev.a && prev.a !== a ? prev.a : b; else a = prev.b && prev.b !== b ? prev.b : a; }
      S.h2h = { a, b };
      try { localStorage.setItem('sb-h2h', JSON.stringify(S.h2h)); } catch (e) { /* storage unavailable */ }
      render(); return;
    }
    if (el.id === 'card-photo') { const f = el.files && el.files[0]; if (f) onPhoto(f); return; }
    if (!el.dataset || !el.dataset.bind) return;
    setPath(el.dataset.bind, el.type === 'checkbox' ? el.checked : el.value);
    if ((el.id === 'f-time' || el.id === 'f-date') && S.setup) {
      const d = S.setup;
      // Readings for the old time no longer apply; fetch again for the new one.
      if (setupWxAuto(d)) { WXKEYS.forEach((k) => { d[k] = ''; }); d.wxBase = null; }
      d.wx = null; wxSeq++;
      render(); fillSetupWeather(false); return;
    }
    if (el.dataset.bind === 'setup.courseId' && S.setup) {
      const c = S.courses[S.setup.courseId];
      if (!c || !(c.tees || []).some((t) => t.name === S.setup.tee)) S.setup.tee = '';
    }
    if (el.dataset.bind === 'whatIf.hcpOn' && S.whatIf && !el.checked) { const r = roundData(S.whatIf.id); if (r) Golf.pids(r).forEach((id) => { S.whatIf.hcp[id] = hcpOf(r, id); }); }
    if (el.dataset.rerender) render();
  });

  // ---------- data ----------
  function subscribe() {
    const db = S.db;
    const onErr = (again) => (e) => {
      const c = code(e);
      if (c === 'unavailable') { setTimeout(again, 3000); return; }
      if (c === 'revoked') { S.readOnly = true; toast('Your access to this tracker changed. Reload to continue.'); render(); return; }
      toast('Lost the live connection. Reload to reconnect.');
    };
    const subConfig = () => db.doc('config/app').onSnapshot((snap) => { S.config = snap.exists ? snap.data() : null; S.loaded.config = true; ready(); }, onErr(subConfig));
    const subCourses = () => db.collection('courses').onSnapshot((q) => {
      const m = {};
      q.docs.forEach((d) => { m[d.id] = d.data(); });
      S.courses = m; S.loaded.courses = true; ready();
    }, onErr(subCourses));
    const subRounds = () => db.collection('rounds').onSnapshot((q) => {
      const m = {};
      q.docs.forEach((d) => { m[d.id] = d.data(); });
      S.rounds = m;
      for (const id of Object.keys(S.optimistic)) if (m[id]) delete S.optimistic[id];
      S.loaded.rounds = true; ready();
    }, onErr(subRounds));
    const subTrips = () => db.collection('trips').onSnapshot((q) => {
      const m = {};
      q.docs.forEach((d) => { m[d.id] = d.data(); });
      S.trips = m; S.loaded.trips = true; ready();
    }, onErr(subTrips));
    subConfig(); subCourses(); subRounds(); subTrips();
  }
  function ready() {
    if (S.status === 'loading') {
      if (S.loaded.config && S.loaded.courses && S.loaded.rounds && S.loaded.trips) {
        S.status = 'ready'; restoreUI(); render();
        if (window.SB_NATIVE && window.SB_NATIVE.notice) toast(window.SB_NATIVE.notice, 10000);
        else if (expiryWarning()) toast(expiryWarning(), 8000);
      }
      return;
    }
    refresh();
  }
  async function boot() {
    S.native = !!window.SB_NATIVE;
    S.nativeWx = window.SB_NATIVE && typeof window.SB_NATIVE.weather === 'function' ? window.SB_NATIVE.weather : null;
    render();
    const c = window.claude;
    if (!c || typeof c.use !== 'function') { S.status = 'nodb'; render(); return; }
    let db = null;
    try { db = await c.use('db'); } catch (e) { db = null; if (e && e.code === 'damaged') S.loadError = e.message; }
    if (!db) { S.status = S.loadError ? 'damaged' : 'nodb'; render(); return; }
    S.db = db;
    subscribe();
    setTimeout(() => { if (S.status === 'loading') $('#view').innerHTML = '<div class="notice">Still loading your rounds. Check your connection, or reload the page.</div>'; }, 12000);
    c.use('sample').then(async (smp) => {
      if (!smp) return;
      const lim = await smp.limits().catch(() => null);
      S.sample = smp;
      S.sampleImages = !!(lim && lim.images);
      S.sampleMax = lim && lim.images ? Math.max(1, lim.images.maxCount || 1) : 1;
      if (S.status === 'ready' && (S.view === 'setup' || S.view === 'settings')) render();
    }).catch(() => {});
    c.use('mcp').then((m) => {
      if (!m) return;
      S.mcp = m;
      if (S.status === 'ready' && (S.view === 'setup' || S.view === 'round')) { render(); if (S.view === 'setup') fillSetupWeather(false); }
    }).catch(() => {});
    try {
      const u = await c.use('user');
      if (u) {
        const can = await u.can('data.write');
        S.canWrite = can;
        if (can === false) { S.readOnly = true; if (S.status === 'ready') render(); }
      }
    } catch (e) { /* treat as unknown */ }
  }
  boot();
})();

</script>
<script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script></body></html>
